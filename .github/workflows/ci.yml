name: FMS CI Pipeline

# Runs on every PR to master, every push to master, and on demand.
# Feature-branch pushes are covered by their PR run, so they are not
# triggered twice.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      profile:
        description: >-
          The load test's profile: full (200 vehicles, the default), smoke, or fleet500 (NFR-3: 500 vehicles on the
          live map, FMS-152, about 25 minutes; on demand only, never on a push).
        type: choice
        options: [full, smoke, fleet500]
        default: full

permissions:
  contents: read

# A newer push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  # CI databases are throwaway containers on the runner, started by
  # scripts/ci/start-postgres.sh. Every password is generated per run in the
  # "Generate per-run secrets" step; none is written in this file.
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: fms_admin
  PGDATABASE: fms_db
  # Read by the backend config (src/config) and by 01_app_role.sh.
  DB_HOST: localhost
  DB_PORT: "5432"
  DB_NAME: fms_db
  DB_ADMIN_USER: fms_admin
  POSTGRES_USER: fms_admin
  POSTGRES_DB: fms_db

# Job `name`s are the required status checks in branch protection
# (see docs/ci.md). Renaming one means updating the protection rule.
jobs:
  backend:
    name: backend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Includes the module boundary rules (FMS-12): a cross-module import or
      # cross-schema SQL fails here even if the pre-commit hook was skipped.
      - name: Lint
        run: npm run lint -w fms-backend
      - name: ESLint rule tests
        run: npm test -w eslint-plugin-fms
      - name: Type-check
        run: npm run typecheck -w fms-backend
      - name: Build
        run: npm run build -w fms-backend
      # Random per run and masked in logs; never stored anywhere. psql reads
      # the admin password under its own variable name, so it gets two names.
      - name: Generate per-run secrets
        run: |
          for names in "DB_ADMIN_PASSWORD PGPASSWORD" DB_APP_PASSWORD JWT_SECRET DATA_ENCRYPTION_KEY REDIS_PASSWORD; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            for name in $names; do echo "$name=$value" >> "$GITHUB_ENV"; done
          done
      - name: Start PostgreSQL
        run: sh scripts/ci/start-postgres.sh
      - name: Start Redis
        run: sh scripts/ci/start-redis.sh
      # The app role is cluster-wide, as in the dev stack. The test run then
      # creates and migrates its own fms_test database (test/support).
      - name: Create app role
        run: sh docker/postgres/init/01_app_role.sh
      - name: Unit and integration tests with coverage
        run: DB_PASSWORD="$DB_APP_PASSWORD" npm run test:coverage -w fms-backend
        env:
          DB_USER: fms_app
          REDIS_HOST: localhost
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: packages/backend/coverage/
          retention-days: 14

  # The load suite (FMS-61, docs/load-testing.md): the compiled API with NODE_ENV=production on a seeded database of its
  # own. Pull requests run the smoke profile, so the suite keeps working; pushes to master and manual runs run the card's
  # workload. Either fails the job when a budget is missed. The JSON report and the API's log are kept as an artifact.
  load-test:
    name: load-test
    runs-on: ubuntu-24.04
    # fleet500 seeds 500 vehicles before its 5 minutes of load.
    timeout-minutes: ${{ inputs.profile == 'fleet500' && 60 || 30 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build -w fms-backend
      - name: Generate per-run secrets
        run: |
          for names in "DB_ADMIN_PASSWORD PGPASSWORD" DB_APP_PASSWORD JWT_SECRET DATA_ENCRYPTION_KEY REDIS_PASSWORD; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            for name in $names; do echo "$name=$value" >> "$GITHUB_ENV"; done
          done
      - name: Start PostgreSQL
        run: sh scripts/ci/start-postgres.sh
      - name: Start Redis
        run: sh scripts/ci/start-redis.sh
      - name: Create app role
        run: sh docker/postgres/init/01_app_role.sh
      - name: Load test
        run: DB_PASSWORD="$DB_APP_PASSWORD" npm run load-test -w fms-backend -- --profile "$PROFILE"
        env:
          # Pull requests: smoke. Pushes to master: full. By hand: the profile chosen (FMS-152: fleet500 only this way).
          PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'pull_request' && 'smoke' || 'full') }}
          DB_USER: fms_app
          REDIS_HOST: localhost
      - name: Upload load report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: load-report
          path: packages/backend/load-report/
          retention-days: 30

  frontend:
    name: frontend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint -w fms-frontend
      - name: Type-check
        run: npm run typecheck -w fms-frontend
      - name: Component tests with coverage
        run: npm run test:coverage -w fms-frontend
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: packages/frontend/coverage/
          retention-days: 14
      - name: Build
        run: npm run build -w fms-frontend

  # The Python ML service: the feature spec, the training dataset generator and
  # its data quality checks (FMS-52), the predictive model (FMS-53) and the service
  # that serves it (FMS-54), under pytest.
  ai-service:
    name: ai-service-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/ai-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/ai-service/requirements.txt
            packages/ai-service/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        run: python -m pytest
      # The dataset the model trains on: 12,000 rows, checked, the same bytes twice.
      - name: Generate the training dataset twice
        run: |
          set -euo pipefail
          python scripts/generate_training_data.py --out "$RUNNER_TEMP/a.csv"
          python scripts/generate_training_data.py --out "$RUNNER_TEMP/b.csv"
          cmp "$RUNNER_TEMP/a.csv" "$RUNNER_TEMP/b.csv"
      # The model, trained on it and graded on the vehicles it has not seen.
      - name: Train and grade the model
        run: |
          set -euo pipefail
          python scripts/train.py --data "$RUNNER_TEMP/a.csv" --out "$RUNNER_TEMP/models" --version pm-0000.00
          python scripts/evaluate.py "$RUNNER_TEMP/models/pm-0000.00" --data "$RUNNER_TEMP/a.csv"
      # The trip risk model (FMS-155): its generated trips the same bytes twice, then trained, graded and re-graded.
      - name: Train and grade the trip risk model
        run: |
          set -euo pipefail
          python scripts/generate_trip_risk_data.py --out "$RUNNER_TEMP/trips-a.csv"
          python scripts/generate_trip_risk_data.py --out "$RUNNER_TEMP/trips-b.csv"
          cmp "$RUNNER_TEMP/trips-a.csv" "$RUNNER_TEMP/trips-b.csv"
          python scripts/train_trip_risk.py --data "$RUNNER_TEMP/trips-a.csv" --out "$RUNNER_TEMP/models" --version tr-0000.00
          python scripts/evaluate_trip_risk.py "$RUNNER_TEMP/models/tr-0000.00" --data "$RUNNER_TEMP/trips-a.csv"

  migrations:
    name: migrations-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Random per run and masked in logs; never stored anywhere. psql reads
      # the admin password under its own variable name, so it gets two names.
      - name: Generate per-run secrets
        run: |
          for names in "DB_ADMIN_PASSWORD PGPASSWORD" DB_APP_PASSWORD JWT_SECRET DATA_ENCRYPTION_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            for name in $names; do echo "$name=$value" >> "$GITHUB_ENV"; done
          done
      - name: Start PostgreSQL
        run: sh scripts/ci/start-postgres.sh
      - name: Create app role
        run: sh docker/postgres/init/01_app_role.sh
      # Every Up section in file order twice (idempotency), every Down in
      # reverse order, then Up again (Definition of Done: reversible).
      - name: Verify migrations (up, up, down, up)
        run: |
          set -euo pipefail
          run_sql() { psql -v ON_ERROR_STOP=1 -q; }
          up()   { for f in $(ls packages/backend/migrations/*.sql); do echo "up   $f"; sed -n '/^-- +migrate Up/,/^-- +migrate Down/p' "$f" | run_sql; done; }
          down() { for f in $(ls -r packages/backend/migrations/*.sql); do echo "down $f"; sed -n '/^-- +migrate Down/,$p' "$f" | run_sql; done; }
          up; up; down
          left=$(psql -At -c "select count(*) from pg_namespace where nspname not like 'pg_%' and nspname not in ('information_schema','public')")
          if [ "$left" != "0" ]; then echo "Down left $left schema(s) behind"; exit 1; fi
          up
          psql -c "select table_schema, count(*) as tables from information_schema.tables where table_schema not in ('pg_catalog','information_schema') group by 1 order by 1"
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The path developers use (`make migrate`): fresh database, apply all,
      # then a second run must skip every file.
      - name: Verify migration runner on a fresh database
        run: |
          set -euo pipefail
          psql -q -c "create database fms_runner_check"
          npm run -s migrate -w fms-backend
          applied=$(psql -d fms_runner_check -At -c "select count(*) from schema_migrations")
          files=$(ls packages/backend/migrations/*.sql | wc -l)
          if [ "$applied" != "$files" ]; then echo "Runner applied $applied of $files files"; exit 1; fi
          npm run -s migrate -w fms-backend | tee "$RUNNER_TEMP/second-run.log"
          if grep -q "RUNNING" "$RUNNER_TEMP/second-run.log"; then echo "Second run re-applied a migration"; exit 1; fi
        env:
          DB_NAME: fms_runner_check
      # FMS-113: the budget dataset on the database the runner just built,
      # through the API as the app role. Twice with the same seed (the second
      # after --reset): 200 vehicles, 300 drivers, 1,000 trips and the same
      # fingerprint both times. NODE_ENV=production must be refused.
      - name: Seed the budget dataset twice
        run: |
          set -euo pipefail
          export DB_PASSWORD="$DB_APP_PASSWORD" FMS_SEED_PASSWORD="$DB_APP_PASSWORD"
          seed() { npm run -s seed -w fms-backend -- --size=budget --seed=42 --anchor=2026-10-01 "$@" | tee -a "$RUNNER_TEMP/seed.log"; }
          seed
          seed --reset
          counts=$(psql -d fms_runner_check -At -c "select (select count(*) from fleet.vehicles) || '/' || (select count(*) from fleet.drivers) || '/' || (select count(*) from trip.trips)")
          if [ "$counts" != "200/300/1000" ]; then echo "Budget profile created $counts vehicles/drivers/trips"; exit 1; fi
          runs=$(grep -c '^fingerprint ' "$RUNNER_TEMP/seed.log")
          distinct=$(grep '^fingerprint ' "$RUNNER_TEMP/seed.log" | sort -u | wc -l)
          if [ "$runs" != "2" ] || [ "$distinct" != "1" ]; then echo "Two runs with the same seed produced different data"; exit 1; fi
          if NODE_ENV=production npm run -s seed -w fms-backend -- --size=small; then echo "The seed ran with NODE_ENV=production"; exit 1; fi
        env:
          DB_NAME: fms_runner_check
          DB_USER: fms_app

  docker:
    name: docker-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Create .env with generated secrets
        run: node scripts/init-env.mjs
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Backend answers its health check
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health/ready; then echo; exit 0; fi
            sleep 2
          done
          echo "Backend did not become healthy in 120 s"; exit 1
      # FMS-94: the replica streams from the primary, a write on the primary
      # reaches it, it refuses writes, the API reads it, and with it stopped
      # readiness reports it degraded (still 200: reads use the primary).
      - name: Read replica follows the primary
        run: sh scripts/ci/check-replica.sh
      # FMS-75: the database preloads pg_stat_statements (the Compose command) and collects with it, and the API's metrics port
      # answers inside its container. This job applies no migrations, so the extension (migration 064) is created here.
      - name: Query statistics and metrics are on
        run: |
          set -euo pipefail
          psql_admin() { docker compose exec -T postgres psql -U fms_admin -d fms_db -Atc "$1"; }
          psql_admin "show shared_preload_libraries" | grep -q pg_stat_statements
          psql_admin "create extension if not exists pg_stat_statements" >/dev/null
          psql_admin "select 1" >/dev/null
          psql_admin "select count(*) > 0 from pg_stat_statements" | grep -qx t
          docker compose exec -T backend wget -qO- http://127.0.0.1:9464/metrics | grep -q '^# TYPE http_request_duration_seconds histogram'
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # FMS-105 (docs/production-images.md): the three production images are built (tagged by commit),
  # scanned, and run. Separate from docker-stack, which builds the development images.
  images:
    name: production-images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRIVY_VERSION: "0.76.2"
    steps:
      - uses: actions/checkout@v5
      - name: Build images, tagged by commit
        run: |
          set -euo pipefail
          docker build -f packages/backend/Dockerfile -t "fms-backend:${GITHUB_SHA}" .
          docker build -f packages/frontend/Dockerfile -t "fms-frontend:${GITHUB_SHA}" .
          docker build -t "fms-ai-service:${GITHUB_SHA}" packages/ai-service
      - name: Install Trivy
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          # GitHub's release downloads answer 504 now and then: retry, instead of failing the job on a download.
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/$file" "$base/$file"
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/trivy-checksums.txt" "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $file\$" trivy-checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" trivy
      # The card's bar: no critical finding that has a fix. HIGH ones are listed, not failed on.
      - name: Scan images
        run: |
          set -euo pipefail
          for image in fms-backend fms-frontend fms-ai-service; do
            echo "::group::$image"
            "$RUNNER_TEMP/trivy" image --quiet --severity HIGH,CRITICAL --ignore-unfixed "${image}:${GITHUB_SHA}" || true
            "$RUNNER_TEMP/trivy" image --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 "${image}:${GITHUB_SHA}"
            echo "::endgroup::"
          done
      - name: Smoke run
        run: sh scripts/ci/smoke-images.sh "fms-backend:${GITHUB_SHA}" "fms-frontend:${GITHUB_SHA}" "fms-ai-service:${GITHUB_SHA}"

  # FMS-103 (docs/security.md): a known critical vulnerability in a dependency fails the build. The lockfile and the pins are
  # audited as they are, with no install. npm grades its advisories, so the bar is critical, and high ones are listed; pip-audit does
  # not grade, so any known vulnerability in the (few) Python pins fails it. Secret scanning is the secrets-scan job.
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (fails on critical)
        run: |
          set -euo pipefail
          # npm exits 1 both for a finding and for a registry that answered 5xx, so a failure is tried three times: a finding
          # fails all three, a hiccup does not.
          audit() { for attempt in 1 2 3; do npm audit "$@" && return 0; sleep 10; done; return 1; }
          echo "::group::High and moderate findings (listed, not failed on)"
          npm audit --audit-level=none || true
          echo "::endgroup::"
          audit --audit-level=critical
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: pip-audit (fails on any known vulnerability)
        run: |
          set -euo pipefail
          pip install pip-audit
          pip-audit -r packages/ai-service/requirements.txt --progress-spinner off

  secrets:
    name: secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v5
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "$base/$file"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $file\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
      # Scans the checked-out files (not history) with the default rules
      # plus the project rules in .gitleaks.toml (weak hardcoded passwords).
      - name: Scan for secrets
        run: $RUNNER_TEMP/gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  # FMS-66: the documents a reader starts from (README.md, docs/USER_GUIDE.md, docs/DEFENCE_NOTES.md) pass markdownlint
  # with the repo's rules in .markdownlint-cli2.jsonc, and every screenshot they show exists.
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.24.0
      - name: The screenshots exist
        run: |
          set -euo pipefail
          missing=0
          for img in $(grep -oh '](user-guide/images/[^)]*)' docs/USER_GUIDE.md docs/DEFENCE_NOTES.md | sed 's/^](//; s/)$//' | sort -u); do
            [ -f "docs/$img" ] || { echo "::error::missing docs/$img"; missing=1; }
          done
          exit $missing
