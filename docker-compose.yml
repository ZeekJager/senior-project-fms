# Secrets come from .env in this folder (see .env.example). `make dev`
# creates it on first run; otherwise run `node scripts/init-env.mjs`.
# A missing value stops `docker compose up` and says how to create .env.

services:
  # 1. PostgreSQL Database (Persisted)
  # fms_admin owns the schema and runs migrations. The backend connects as
  # fms_app (created by docker/postgres/init), a non-owner role, so table
  # level REVOKEs like audit_logs INSERT-only actually apply to it.
  postgres:
    image: postgres:16
    container_name: fms_postgres
    environment:
      POSTGRES_USER: fms_admin
      POSTGRES_PASSWORD: "${DB_ADMIN_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      POSTGRES_DB: fms_db
      # Read by docker/postgres/init/01_app_role.sh on first boot only.
      DB_APP_PASSWORD: "${DB_APP_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"
    # Client rules with the replica's replication login (FMS-94), applied to an
    # existing volume too. The slot keeps at most 1 GB of WAL for a replica that
    # is down, so a stopped replica cannot fill the disk.
    # pg_stat_statements (FMS-75, docs/metrics.md): preloaded, so the slowest and most frequent SQL can be read.
    command: ["postgres", "-c", "hba_file=/etc/fms/pg_hba.conf", "-c", "max_slot_wal_keep_size=1GB", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/pg_hba.conf:/etc/fms/pg_hba.conf:ro
    healthcheck:
      # -h localhost forces TCP, which only answers once init scripts finish
      test: ["CMD-SHELL", "pg_isready -h localhost -U fms_admin -d fms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 1b. Read replica (FMS-94, docs/read-replica.md): a streaming hot standby of
  # postgres for reporting reads (fuel reconciliation, the audit log). Not
  # published to the host. The backend falls back to the primary when it is
  # down or too far behind. Its entrypoint creates the replication role and
  # slot on the primary, then copies it on first start.
  postgres-replica:
    image: postgres:16
    container_name: fms_postgres_replica
    entrypoint: ["sh", "/replica/entrypoint.sh"]
    environment:
      PRIMARY_HOST: postgres
      DB_ADMIN_PASSWORD: "${DB_ADMIN_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      DB_REPLICATION_PASSWORD: "${DB_REPLICATION_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to add it to .env}"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./docker/postgres/replica:/replica:ro
      - ./docker/postgres/pg_hba.conf:/etc/fms/pg_hba.conf:ro
    healthcheck:
      # Answers once it accepts connections, as a standby.
      test: ["CMD-SHELL", "pg_isready -h localhost -U fms_admin -d fms_db && psql -h localhost -U fms_admin -d fms_db -Atc 'select pg_is_in_recovery()' | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  # 2. Redis (FMS-72): cache, login throttle, job locks. Password-protected
  # and not published to the host: only containers on this network reach it.
  # A cache, not a store: nothing is saved to disk, and keys (all with a
  # TTL) are evicted least-recently-used under memory pressure.
  redis:
    image: redis:7.4-alpine
    container_name: fms_redis
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save '' --appendonly no --maxmemory 128mb --maxmemory-policy volatile-lru
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to add it to .env}"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 3. Node.js Backend API
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile.dev
    container_name: fms_backend
    # Polls for changes: a bind mount from a Windows drive (Docker Desktop)
    # delivers no file-change events, so plain `npm run dev` never reloads.
    # Same reason the frontend's Vite config sets usePolling.
    command: ["npm", "run", "dev:docker"]
    ports:
      - "3000:3000"
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
      # Uploaded documents (FMS-17), kept in a volume outside the source tree.
      - document_files:/app/storage
      # The feature spec shared with the ML service (FMS-127): ML_FEATURE_SPEC_PATH's
      # default, ../ai-service/feature_spec.json, from /app as from packages/backend.
      - ./packages/ai-service/feature_spec.json:/ai-service/feature_spec.json:ro
      # The trip risk model's (FMS-155), ML_TRIP_RISK_SPEC_PATH's default the same way.
      - ./packages/ai-service/trip_risk_spec.json:/ai-service/trip_risk_spec.json:ro
      # The API's OpenAPI spec, for Swagger UI at /api-docs (FMS-65, docs/api-docs.md): the backend finds
      # docs/openapi.yaml by walking up from its own folder, which in this container reaches /docs.
      - ./docs/openapi.yaml:/docs/openapi.yaml:ro
    environment:
      NODE_ENV: development
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: fms_db
      DB_USER: fms_app
      DB_PASSWORD: "${DB_APP_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      # Reporting reads (FMS-94): the replica, as the same fms_app role.
      DB_READ_HOST: postgres-replica
      DB_READ_PORT: "5432"
      # Used by `make migrate`, which runs inside this container, and by database backups (FMS-144,
      # docs/backups.md): pg_dump connects as this role, as fms_app may not read every table.
      DB_ADMIN_USER: fms_admin
      DB_ADMIN_PASSWORD: "${DB_ADMIN_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # GET /metrics (FMS-75, docs/metrics.md) on port 9464 for a Prometheus on this network. Not published to the host.
      METRICS_HOST: 0.0.0.0
      # How often a vehicle's position reaches the live map, at most (FMS-88): 5 s by default. The presentation sets 2 in .env,
      # so vehicles pinging every 2 s move on the map every 2 s.
      TRACKING_EVENT_INTERVAL_SECONDS: "${TRACKING_EVENT_INTERVAL_SECONDS:-5}"
      JWT_SECRET: "${JWT_SECRET:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      # Encrypts licence and phone numbers in the database (FMS-104).
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:?is not set - run node scripts/init-env.mjs to add it to .env}"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/storage
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to add it to .env}"
      # Predictive maintenance service (FMS-54), on this network only.
      ML_SERVICE_URL: http://ai-service:5000
      ML_SERVICE_TOKEN: "${ML_SERVICE_TOKEN:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      # Road routing (FMS-84, docs/routing.md): OSRM, started by `make routing`.
      # Not running, routes save with the distance typed in; ROUTING_URL= (empty) in .env switches it off.
      ROUTING_URL: "${ROUTING_URL-http://osrm:5000}"
      # Alerts by email, SMS and push (FMS-93, docs/notification-channels.md): the link in alert emails, and the
      # notification providers' secrets by code. Empty, a channel's provider has no secret.
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-}"
      INTEGRATION_SMTP_EMAIL_API_KEY: "${INTEGRATION_SMTP_EMAIL_API_KEY:-}"
      INTEGRATION_SMS_GATEWAY_API_KEY: "${INTEGRATION_SMS_GATEWAY_API_KEY:-}"
      INTEGRATION_WEB_PUSH_API_KEY: "${INTEGRATION_WEB_PUSH_API_KEY:-}"
      # The GPS simulator's telematics provider (FMS-138, docs/telematics.md); empty, its webhooks answer 404.
      INTEGRATION_FMS_SIMULATOR_WEBHOOK_SECRET: "${INTEGRATION_FMS_SIMULATOR_WEBHOOK_SECRET:-}"
    healthcheck:
      # 200 when the API can reach PostgreSQL (GET /health/ready); a Redis
      # outage shows as "degraded" but keeps it healthy.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      # Started, not healthy: the API runs without Redis (direct reads).
      redis:
        condition: service_started
      # Started, not healthy: reporting reads use the primary until it is up.
      postgres-replica:
        condition: service_started

  # 4. React Frontend (Vite)
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile.dev
    container_name: fms_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
      # Dev-server /api proxy target (localhost here would be this container)
      API_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend

  # 5. The predictive maintenance service (FMS-54, docs/ml-service.md). Internal
  # only: not published to the host; the backend reaches it at
  # http://ai-service:5000 with ML_SERVICE_TOKEN. Its model is trained when
  # the image is built.
  ai-service:
    build:
      context: ./packages/ai-service
      dockerfile: Dockerfile.dev
    container_name: fms_ai_service
    volumes:
      - ./packages/ai-service:/app
    environment:
      ML_SERVICE_TOKEN: "${ML_SERVICE_TOKEN:?is not set - run make env or node scripts/init-env.mjs to create .env}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. Road routing (FMS-84, docs/routing.md): OSRM on Ethiopia's OpenStreetMap
  # roads. Optional: `make routing` downloads and prepares the map once (about
  # 10 minutes) and starts it; COMPOSE_PROFILES=routing in .env starts it with
  # `make dev`. Without it, routes keep the distance typed in.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: fms_osrm
    profiles: [routing]
    command: ["osrm-routed", "--algorithm", "mld", "--max-viaroute-size", "30", "/data/ethiopia-latest.osrm"]
    ports:
      # Host access for `npm run routes:roads` and an API run outside Docker.
      - "127.0.0.1:${OSRM_HOST_PORT:-5050}:5000"
    volumes:
      - osrm_data:/data:ro

  # One-off steps of `make routing`: fetch the map (checked against Geofabrik's
  # MD5), then build OSRM's car graph from it. Each skips work already done.
  osrm-download:
    image: curlimages/curl:8.10.1
    profiles: [routing-setup]
    user: "0:0"
    volumes:
      - osrm_data:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        cd /data
        if [ -f ethiopia-latest.osrm.mldgr ]; then echo "map already prepared"; exit 0; fi
        if [ -f ethiopia-latest.osm.pbf.md5 ] && md5sum -c ethiopia-latest.osm.pbf.md5 >/dev/null 2>&1; then echo "map already downloaded"; exit 0; fi
        curl -fsSL --retry 3 -o ethiopia-latest.osm.pbf https://download.geofabrik.de/africa/ethiopia-latest.osm.pbf
        curl -fsSL --retry 3 -o ethiopia-latest.osm.pbf.md5 https://download.geofabrik.de/africa/ethiopia-latest.osm.pbf.md5
        md5sum -c ethiopia-latest.osm.pbf.md5

  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: [routing-setup]
    volumes:
      - osrm_data:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        cd /data
        if [ -f ethiopia-latest.osrm.mldgr ]; then echo "road graph already built"; exit 0; fi
        osrm-extract -p /opt/car.lua ethiopia-latest.osm.pbf
        osrm-partition ethiopia-latest.osrm
        osrm-customize ethiopia-latest.osrm

volumes:
  postgres_data:
  postgres_replica_data:
  document_files:
  # The prepared map (1-2 GB, minutes to build): shared by every checkout, created by
  # `make routing`, and external so `make clean` (down -v) keeps it.
  osrm_data:
    name: fms_osrm_data
    external: true
