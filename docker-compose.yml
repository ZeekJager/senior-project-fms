
services:
  # 1. PostgreSQL Database (Persisted)
  # fms_admin owns the schema and runs migrations. The backend connects as
  # fms_app (created by docker/postgres/init), a non-owner role, so table
  # level REVOKEs like audit_logs INSERT-only actually apply to it.
  postgres:
    image: postgres:16
    container_name: fms_postgres
    environment:
      POSTGRES_USER: fms_admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: fms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h localhost forces TCP, which only answers once init scripts finish
      test: ["CMD-SHELL", "pg_isready -h localhost -U fms_admin -d fms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Node.js Backend API
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile.dev
    container_name: fms_backend
    ports:
      - "3000:3000"
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=fms_app
      - DB_PASS=apppassword
      - DB_NAME=fms_db
      - JWT_SECRET=development_secret_do_not_use_in_prod
    depends_on:
      postgres:
        condition: service_healthy

  # 3. React Frontend (Vite)
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile.dev
    container_name: fms_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000/api/v1
    depends_on:
      - backend

  # 4. Python AI Service
  ai-service:
    build:
      context: ./packages/ai-service
      dockerfile: Dockerfile.dev
    container_name: fms_ai_service
    ports:
      - "5000:5000"
    volumes:
      - ./packages/ai-service:/app
    environment:
      - FLASK_ENV=development
      - INTERNAL_TOKEN=ai_internal_secret

volumes:
  postgres_data:
