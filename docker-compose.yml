# Secrets come from .env in this folder (see .env.example). `make dev`
# creates it on first run; otherwise run `node scripts/init-env.mjs`.
# A missing value stops `docker compose up` and says how to create .env.

services:
  # 1. PostgreSQL Database (Persisted)
  # fms_admin owns the schema and runs migrations. The backend connects as
  # fms_app (created by docker/postgres/init), a non-owner role, so table
  # level REVOKEs like audit_logs INSERT-only actually apply to it.
  postgres:
    image: postgres:16
    container_name: fms_postgres
    environment:
      POSTGRES_USER: fms_admin
      POSTGRES_PASSWORD: "${DB_ADMIN_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      POSTGRES_DB: fms_db
      # Read by docker/postgres/init/01_app_role.sh on first boot only.
      DB_APP_PASSWORD: "${DB_APP_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h localhost forces TCP, which only answers once init scripts finish
      test: ["CMD-SHELL", "pg_isready -h localhost -U fms_admin -d fms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Node.js Backend API
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile.dev
    container_name: fms_backend
    ports:
      - "3000:3000"
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: fms_db
      DB_USER: fms_app
      DB_PASSWORD: "${DB_APP_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      # Used only by `make migrate`, which runs inside this container.
      DB_ADMIN_USER: fms_admin
      DB_ADMIN_PASSWORD: "${DB_ADMIN_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: "${JWT_SECRET:?is not set - run make env or node scripts/init-env.mjs to create .env}"
    healthcheck:
      # 200 only when the API can reach PostgreSQL (GET /health/ready).
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  # 3. React Frontend (Vite)
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile.dev
    container_name: fms_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
      # Dev-server /api proxy target (localhost here would be this container)
      API_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend

  # 4. Python AI Service
  ai-service:
    build:
      context: ./packages/ai-service
      dockerfile: Dockerfile.dev
    container_name: fms_ai_service
    ports:
      - "5000:5000"
    volumes:
      - ./packages/ai-service:/app
    environment:
      FLASK_ENV: development
      ML_SERVICE_TOKEN: "${ML_SERVICE_TOKEN:?is not set - run make env or node scripts/init-env.mjs to create .env}"

volumes:
  postgres_data:
