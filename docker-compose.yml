# Secrets come from .env in this folder (see .env.example). `make dev`
# creates it on first run; otherwise run `node scripts/init-env.mjs`.
# A missing value stops `docker compose up` and says how to create .env.

services:
  # 1. PostgreSQL: two servers, the primary and its streaming standby (FMS-94), on the same image, settings and
  # backup repository (FMS-108, FMS-162). Either can be the primary: scripts/dr/promote.sh promotes the standby when
  # the primary is lost, and scripts/dr/rejoin.sh makes the old primary the standby (docs/disaster-recovery.md). Each
  # data directory says what its server is, not the service name: after a failover, postgres-replica is the primary.
  # Nothing connects to them by name: db-proxy (below) is the one stable endpoint.
  # fms_admin owns the schema and runs migrations. The backend connects as fms_app (created by docker/postgres/init),
  # a non-owner role, so table-level REVOKEs like audit_logs INSERT-only actually apply to it.
  postgres:
    # PostgreSQL 16 with pgBackRest (FMS-108, ADR-07, docs/backups.md): every WAL segment is archived,
    # compressed and encrypted, within archive_timeout (60 s), and a full base backup is taken weekly and
    # a differential one daily, so the database can be restored to any second of the last 14 days.
    build: ./docker/postgres
    image: fms-postgres:16
    container_name: fms_postgres
    environment: &db-environment
      POSTGRES_USER: fms_admin
      POSTGRES_PASSWORD: "${DB_ADMIN_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      POSTGRES_DB: fms_db
      # Read by docker/postgres/init/01_app_role.sh on first boot only.
      DB_APP_PASSWORD: "${DB_APP_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      # A standby connects to the primary as fms_admin (role and slot) and streams as fms_replicator (standby.sh).
      DB_ADMIN_PASSWORD: "${DB_ADMIN_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      DB_REPLICATION_PASSWORD: "${DB_REPLICATION_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to add it to .env}"
      PRIMARY_HOST: db-proxy
      # Encrypts the backup repository (aes-256-cbc). Losing it makes every backup unreadable: keep a copy
      # outside this machine (docs/backups.md).
      PGBACKREST_REPO1_CIPHER_PASS: "${BACKUP_REPO_CIPHER_PASS:?is not set - run node scripts/init-env.mjs to add it to .env}"
      BACKUP_BASE_HOUR_UTC: "${BACKUP_BASE_HOUR_UTC:-22}"
      # What a new, empty volume becomes: the primary (an empty database), or a copy of it.
      FMS_ROLE: primary
    # The off-site repository (repo2), when configured: pgBackRest's own PGBACKREST_REPO2_* settings in
    # docker/postgres/offsite.env, git-ignored (offsite.env.example, docs/backups.md#off-site-repository).
    # Every WAL segment and base backup then goes to both repositories.
    env_file: &db-env-file
      - path: ./docker/postgres/offsite.env
        required: false
    # Client rules with the replica's replication login (FMS-94). The slot keeps at most 1 GB of WAL for a standby
    # that is down, so a stopped standby cannot fill the disk.
    # pg_stat_statements (FMS-75, docs/metrics.md): preloaded, so the slowest and most frequent SQL can be read.
    # Archiving (FMS-108): archive_timeout closes a segment at least every 60 s, so at most a minute of
    # writes is ever only on this disk; wal_compression shrinks the WAL written (measured in ADR-07).
    # A standby archives nothing until it is promoted. wal_log_hints lets pg_rewind turn an old primary into the
    # standby after a failover (FMS-162); hot_standby and its feedback apply only while the server is a standby.
    command: &db-command
      - postgres
      - -c
      - hba_file=/etc/fms/pg_hba.conf
      - -c
      - max_slot_wal_keep_size=1GB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=fms archive-push %p
      - -c
      - archive_timeout=60
      - -c
      - wal_compression=lz4
      - -c
      - wal_log_hints=on
      - -c
      - hot_standby=on
      - -c
      - hot_standby_feedback=on
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # The backup repository, shared by both servers: only the primary writes to it. In production, repo1 is an S3
      # bucket and repo2 a second one off site.
      - pgbackrest_repo:/var/lib/pgbackrest
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/pg_hba.conf:/etc/fms/pg_hba.conf:ro
    healthcheck: &db-healthcheck
      # -h localhost forces TCP, which only answers once init scripts finish. Up as primary or standby: which one it
      # is, db-proxy asks its role agent.
      test: ["CMD-SHELL", "pg_isready -h localhost -U fms_admin -d fms_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 1b. The standby (FMS-94, docs/read-replica.md): a streaming hot standby of the primary, for reporting reads, and
  # the server promoted when the primary is lost (FMS-162). A new volume is copied from the primary through db-proxy;
  # it streams through db-proxy too, so it follows whichever server is the primary. Not published to the host.
  postgres-replica:
    image: fms-postgres:16
    container_name: fms_postgres_replica
    environment:
      <<: *db-environment
      FMS_ROLE: standby
    env_file: *db-env-file
    command: *db-command
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - pgbackrest_repo:/var/lib/pgbackrest
      - ./docker/postgres/pg_hba.conf:/etc/fms/pg_hba.conf:ro
    healthcheck: *db-healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      db-proxy:
        condition: service_started

  # 1c. The stable database endpoint (FMS-162, docs/disaster-recovery.md): HAProxy, routing :5432 to whichever server
  # is the primary and :5433 to the standby, as each server's role agent says, once a second. A failover moves it in
  # seconds; the API needs no redeploy or configuration change. Not published to the host.
  db-proxy:
    image: haproxy:3.0.29-alpine
    container_name: fms_db_proxy
    volumes:
      - ./docker/db-proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 2. Redis (FMS-72): cache, login throttle, job locks. Password-protected
  # and not published to the host: only containers on this network reach it.
  # A cache, not a store: nothing is saved to disk, and keys (all with a
  # TTL) are evicted least-recently-used under memory pressure.
  redis:
    image: redis:7.4-alpine
    container_name: fms_redis
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save '' --appendonly no --maxmemory 128mb --maxmemory-policy volatile-lru
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to add it to .env}"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 3. Node.js Backend API
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile.dev
    container_name: fms_backend
    # Polls for changes: a bind mount from a Windows drive (Docker Desktop)
    # delivers no file-change events, so plain `npm run dev` never reloads.
    # Same reason the frontend's Vite config sets usePolling.
    command: ["npm", "run", "dev:docker"]
    ports:
      - "3000:3000"
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
      # Uploaded documents (FMS-17), kept in a volume outside the source tree.
      - document_files:/app/storage
      # The feature spec shared with the ML service (FMS-127): ML_FEATURE_SPEC_PATH's
      # default, ../ai-service/feature_spec.json, from /app as from packages/backend.
      - ./packages/ai-service/feature_spec.json:/ai-service/feature_spec.json:ro
      # The trip risk model's (FMS-155), ML_TRIP_RISK_SPEC_PATH's default the same way.
      - ./packages/ai-service/trip_risk_spec.json:/ai-service/trip_risk_spec.json:ro
      # The EV predictive maintenance model's (FMS-135), ML_EV_FEATURE_SPEC_PATH's default the same way.
      - ./packages/ai-service/feature_spec_ev.json:/ai-service/feature_spec_ev.json:ro
      # The API's OpenAPI spec, for Swagger UI at /api-docs (FMS-65, docs/api-docs.md): the backend finds
      # docs/openapi.yaml by walking up from its own folder, which in this container reaches /docs.
      - ./docs/openapi.yaml:/docs/openapi.yaml:ro
    environment:
      NODE_ENV: development
      PORT: "3000"
      # The stable endpoint (FMS-162): whichever server is the primary.
      DB_HOST: db-proxy
      DB_PORT: "5432"
      DB_NAME: fms_db
      DB_USER: fms_app
      DB_PASSWORD: "${DB_APP_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      # Reporting reads (FMS-94): the standby, as the same fms_app role, through the same endpoint.
      DB_READ_HOST: db-proxy
      DB_READ_PORT: "5433"
      # Used by `make migrate`, which runs inside this container, and by database backups (FMS-144,
      # docs/backups.md): pg_dump connects as this role, as fms_app may not read every table.
      DB_ADMIN_USER: fms_admin
      DB_ADMIN_PASSWORD: "${DB_ADMIN_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # GET /metrics (FMS-75, docs/metrics.md) on port 9464 for a Prometheus on this network. Not published to the host.
      METRICS_HOST: 0.0.0.0
      JWT_SECRET: "${JWT_SECRET:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      # Encrypts licence and phone numbers in the database (FMS-104).
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:?is not set - run node scripts/init-env.mjs to add it to .env}"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/storage
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to add it to .env}"
      # Predictive maintenance service (FMS-54), on this network only.
      ML_SERVICE_URL: http://ai-service:5000
      ML_SERVICE_TOKEN: "${ML_SERVICE_TOKEN:?is not set - run make env or node scripts/init-env.mjs to create .env}"
      # Road routing (FMS-84, docs/routing.md): OSRM, started by `make routing`.
      # Not running, routes save with the distance typed in; ROUTING_URL= (empty) in .env switches it off.
      ROUTING_URL: "${ROUTING_URL-http://osrm:5000}"
      # Alerts by email, SMS and push (FMS-93, docs/notification-channels.md): the link in alert emails, and the
      # notification providers' secrets by code. Empty, a channel's provider has no secret.
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-}"
      INTEGRATION_SMTP_EMAIL_API_KEY: "${INTEGRATION_SMTP_EMAIL_API_KEY:-}"
      INTEGRATION_SMS_GATEWAY_API_KEY: "${INTEGRATION_SMS_GATEWAY_API_KEY:-}"
      INTEGRATION_WEB_PUSH_API_KEY: "${INTEGRATION_WEB_PUSH_API_KEY:-}"
      # The GPS simulator's telematics provider (FMS-138, docs/telematics.md); empty, its webhooks answer 404.
      INTEGRATION_FMS_SIMULATOR_WEBHOOK_SECRET: "${INTEGRATION_FMS_SIMULATOR_WEBHOOK_SECRET:-}"
      # The EV simulator's charging provider (FMS-97, docs/ev.md#synthetic-data); empty, its webhooks answer 404.
      INTEGRATION_SIMULATED_WEBHOOK_SECRET: "${INTEGRATION_SIMULATED_WEBHOOK_SECRET:-}"
    healthcheck:
      # 200 when the API can reach PostgreSQL (GET /health/ready); a Redis
      # outage shows as "degraded" but keeps it healthy.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      db-proxy:
        condition: service_healthy
      # Started, not healthy: the API runs without Redis (direct reads).
      redis:
        condition: service_started
      # Started, not healthy: reporting reads use the primary until it is up.
      postgres-replica:
        condition: service_started

  # 4. React Frontend (Vite)
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile.dev
    container_name: fms_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
      # Dev-server /api proxy target (localhost here would be this container)
      API_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend

  # 5. The predictive maintenance service (FMS-54, docs/ml-service.md). Internal
  # only: not published to the host; the backend reaches it at
  # http://ai-service:5000 with ML_SERVICE_TOKEN. Its model is trained when
  # the image is built.
  ai-service:
    build:
      context: ./packages/ai-service
      dockerfile: Dockerfile.dev
    container_name: fms_ai_service
    volumes:
      - ./packages/ai-service:/app
    environment:
      ML_SERVICE_TOKEN: "${ML_SERVICE_TOKEN:?is not set - run make env or node scripts/init-env.mjs to create .env}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. Road routing (FMS-84, docs/routing.md): OSRM on Ethiopia's OpenStreetMap
  # roads. Optional: `make routing` downloads and prepares the map once (about
  # 10 minutes) and starts it; COMPOSE_PROFILES=routing in .env starts it with
  # `make dev`. Without it, routes keep the distance typed in.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: fms_osrm
    profiles: [routing]
    command: ["osrm-routed", "--algorithm", "mld", "--max-viaroute-size", "30", "/data/ethiopia-latest.osrm"]
    ports:
      # Host access for `npm run routes:roads` and an API run outside Docker.
      - "127.0.0.1:${OSRM_HOST_PORT:-5050}:5000"
    volumes:
      - osrm_data:/data:ro

  # One-off steps of `make routing`: fetch the map (checked against Geofabrik's
  # MD5), then build OSRM's car graph from it. Each skips work already done.
  osrm-download:
    image: curlimages/curl:8.10.1
    profiles: [routing-setup]
    user: "0:0"
    volumes:
      - osrm_data:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        cd /data
        if [ -f ethiopia-latest.osrm.mldgr ]; then echo "map already prepared"; exit 0; fi
        if [ -f ethiopia-latest.osm.pbf.md5 ] && md5sum -c ethiopia-latest.osm.pbf.md5 >/dev/null 2>&1; then echo "map already downloaded"; exit 0; fi
        curl -fsSL --retry 3 -o ethiopia-latest.osm.pbf https://download.geofabrik.de/africa/ethiopia-latest.osm.pbf
        curl -fsSL --retry 3 -o ethiopia-latest.osm.pbf.md5 https://download.geofabrik.de/africa/ethiopia-latest.osm.pbf.md5
        md5sum -c ethiopia-latest.osm.pbf.md5

  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: [routing-setup]
    volumes:
      - osrm_data:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        cd /data
        if [ -f ethiopia-latest.osrm.mldgr ]; then echo "road graph already built"; exit 0; fi
        osrm-extract -p /opt/car.lua ethiopia-latest.osm.pbf
        osrm-partition ethiopia-latest.osrm
        osrm-customize ethiopia-latest.osrm

volumes:
  postgres_data:
  postgres_replica_data:
  # pgBackRest's repository: base backups and archived WAL (FMS-108). On its own volume, so a lost
  # database volume leaves the backups; in production it is an S3 bucket, plus a second one off site.
  pgbackrest_repo:
  document_files:
  # The prepared map (1-2 GB, minutes to build): shared by every checkout, created by
  # `make routing`, and external so `make clean` (down -v) keeps it.
  osrm_data:
    name: fms_osrm_data
    external: true
