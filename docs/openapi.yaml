  /fuel-anomalies/{anomaly_id}/resolve:
    post:
      tags: [Fuel]
      operationId: closeFuelAnomaly
      summary: Resolve or dismiss a fuel anomaly (FMS-42)
      description: >
        Closes an open or reviewed anomaly, recording who and when (reviewed_by, reviewed_at); audited. Needs
        fuel-anomaly:write (admin, fleet manager, finance clerk).
      parameters:
        - { name: anomaly_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                outcome: { type: string, enum: [resolved, dismissed], default: resolved }
                notes: { type: string, minLength: 1, maxLength: 2000, description: Required to dismiss. }
      responses:
        '200':
          description: The closed anomaly.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/FuelAnomaly' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (an unknown outcome or field; notes required_to_dismiss).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION (already resolved or dismissed).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /analytics/fleet-summary:
