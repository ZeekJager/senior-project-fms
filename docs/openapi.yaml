      description: >
        Vehicles by status, utilisation, distance, trips, on-time, fuel, repair cost, cost per km and open alerts, and the same KPIs per day. From analytics_cache (refreshed hourly and nightly) and the analytics views on the read replica;
        integers throughout. Needs analytics:read, in the caller's depot scope.
      parameters:
        - { name: from, in: query, description: 'An Addis Ababa day, included. Default: 29 days before to.', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'An Addis Ababa day, included. Default and latest: today.', schema: { type: string, format: date } }
        - { name: depot_id, in: query, description: 'One of the caller''s depots; an unknown or other depot gives zeros.', schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The KPIs, with the range and how old the cache is.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [vehicles, utilisation_pct, distance_km, trips_completed, on_time_pct, fuel_ml, fuel_cost_cents, maintenance_cost_cents, total_cost_cents, cost_per_km_cents, open_alerts, daily]
                    properties:
                      vehicles: { type: object, description: 'total, by_status (active, inactive, maintenance, retired), maintenance_flagged, average_health_score.' }
                      utilisation_pct: { type: [integer, 'null'], description: 'Vehicle-days used of vehicle-days in the range.' }
                      distance_km: { type: integer }
                      trips_completed: { type: integer }
                      on_time_pct: { type: [integer, 'null'] }
                      fuel_ml: { type: integer }
                      fuel_cost_cents: { type: integer }
                      maintenance_cost_cents: { type: integer }
                      total_cost_cents: { type: integer }
                      cost_per_km_cents: { type: [integer, 'null'], description: '(fuel + repair cost) over distance, whole cents.' }
                      open_alerts: { type: object, description: 'low, medium, high, critical, total.' }
                      daily: { type: array, items: { type: object, description: 'date, vehicles_used and the KPIs above for one day.' } }
                  meta: { $ref: '#/components/schemas/AnalyticsMeta' }
        '400':
          description: VALIDATION_FAILED (a bad date; to before_from; range_too_long, over 366 days).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

