        '403': { $ref: '#/components/responses/Forbidden' }

  /inventory/{part_id}:
    get:
      tags: [Inventory]
      operationId: getInventoryPart
      summary: One spare part (FMS-23)
      description: Needs inventory:read. A part outside the caller's depots, or an id that is not a UUID, is a 404. The ETag is the version.
      parameters:
        - $ref: '#/components/parameters/PartId'
      responses:
        '200':
          description: The part.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/InventoryPart' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Inventory]
      operationId: updateInventoryPart
      summary: Change a spare part (FMS-23)
      description: >
        Needs inventory:write. Send the fields to change, at least one; is_active false retires the part from pickers.
        Stock is not here: it moves through POST .../adjust and through repairs. Send If-Match to refuse a stale write.
        Publishes InventoryPartUpdated. Audited.
      parameters:
        - $ref: '#/components/parameters/PartId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/InventoryPartFields'
                - type: object
                  minProperties: 1
                  properties:
                    is_active: { type: boolean }
      responses:
        '200':
          description: The part after the change.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/InventoryPart' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (an empty_update, or a field the part cannot hold).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_CONCURRENT_MODIFICATION (a stale If-Match) or CONFLICT_DUPLICATE (the part number).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /inventory/{part_id}/adjust:
    post:
      tags: [Inventory]
      operationId: adjustInventoryStock
      summary: Add or remove stock (FMS-23)
      description: >
        Needs inventory:write. quantity is positive to add stock and negative to remove it (never 0); the reason is kept
        in the part's ledger. Stock cannot go below zero by hand. Publishes InventoryStockAdjusted, and
        InventoryReorderNeeded when stock falls to or below the threshold. Audited.
      parameters:
        - $ref: '#/components/parameters/PartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity, reason]
              properties:
                quantity: { type: integer, minimum: -1000000, maximum: 1000000, description: 'Positive to add, negative to remove; never 0.' }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: The part with its new stock.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/InventoryPart' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (quantity zero, or out of range; reason too short).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_INSUFFICIENT_STOCK (removing more than is in stock).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /inventory/{part_id}/movements:
    get:
      tags: [Inventory]
      operationId: listInventoryMovements
      summary: A part's stock ledger (FMS-23)
      description: Needs inventory:read. Every change to the part's stock, newest first.
      parameters:
        - $ref: '#/components/parameters/PartId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of ledger lines.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InventoryMovement' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: The audit trail (FMS-28)
      description: >
        Needs audit:read (administrators, fleet owners, compliance officers). Read-only: rows are written by the API
        with each change and sign-in event. Newest first, with keyset paging: pass meta.next_cursor as cursor;
        next_cursor is null on the last page. A date in from or to means that Addis Ababa day (UTC+3); to covers the
        whole day. action takes up to 20 comma-separated actions, each like UPDATE, or auth.* for every action starting
        auth. Never cached. Also mounted at /audit (deprecated). api-contract §5.2.
      parameters:
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: entity_type, in: query, description: 'A schema-qualified table, e.g. fleet.vehicles.', schema: { type: string, pattern: '^[a-z_]+\.[a-z_]+$' } }
        - { name: entity_id, in: query, schema: { type: string, format: uuid } }
        - { name: correlation_id, in: query, description: The request id that made the changes (X-Request-Id)., schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string, maxLength: 500 } }
        - { name: result, in: query, schema: { type: string, enum: [success, denied, failed] } }
        - { name: from, in: query, description: A date or an instant (with offset)., schema: { type: string } }
        - { name: to, in: query, description: A date or an instant (with offset); after from., schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200':
          description: A page of audit rows.
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  meta:
                    type: object
                    required: [page_size, next_cursor, data_freshness, request_id]
                    properties:
                      page_size: { type: integer }
                      next_cursor: { type: [string, 'null'] }
                      data_freshness: { $ref: '#/components/schemas/DataFreshness' }
                      request_id: { type: string, format: uuid }
        '400':
          description: VALIDATION_FAILED (an unknown parameter, an invalid_action, before_from, an invalid cursor).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit:
    get:
      tags: [Audit]
      operationId: listAuditLogsLegacy
      deprecated: true
      summary: The audit trail (legacy path)
      description: The legacy-compatible mount of GET /audit-logs, with the same behaviour, parameters and responses.
      parameters:
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: entity_type, in: query, schema: { type: string, pattern: '^[a-z_]+\.[a-z_]+$' } }
        - { name: entity_id, in: query, schema: { type: string, format: uuid } }
        - { name: correlation_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string, maxLength: 500 } }
        - { name: result, in: query, schema: { type: string, enum: [success, denied, failed] } }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200':
          description: A page of audit rows.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  meta:
                    type: object
                    required: [page_size, next_cursor, data_freshness, request_id]
                    properties:
                      page_size: { type: integer }
                      next_cursor: { type: [string, 'null'] }
                      data_freshness: { $ref: '#/components/schemas/DataFreshness' }
                      request_id: { type: string, format: uuid }
        '400':
          description: As GET /audit-logs.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /health/live:
    servers:
      - url: /
        description: Outside the versioned API, at the root.
    get:
      tags: [Health]
      operationId: healthLive
      summary: The process is up
      description: No dependencies are checked. For a liveness probe. Public, and not under /api/v1.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status: { type: string, enum: [ok] }
                  timestamp: { type: string, format: date-time }

  /health/ready:
    servers:
      - url: /
        description: Outside the versioned API, at the root.
    get:
      tags: [Health]
      operationId: healthReady
      summary: The API can take traffic
      description: >
        Every required dependency (the database) answers within its timeout, or 503, so a load balancer stops sending
        traffic. Optional dependencies (Redis, the event outbox) are reported, never a reason for 503: ok, degraded
        (configured but failing; the API serves without it, status degraded, still 200) or disabled. metrics adds
        numbers for operators, such as the outbox's lag; one that fails is left out. Public, and not under /api/v1.
      security: []
      responses:
        '200':
          description: Ready (status ok), or serving without an optional dependency (status degraded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }
        '503':
          description: A required dependency failed (status unavailable).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReport' }

  /system/health:
    get:
      tags: [System]
      operationId: getSystemHealth
      summary: Uptime, outages and failed jobs (FMS-143)
      description: >
        The health of the FMS from its own samples: once a minute each API instance checks the API (its own
        /health/live), the database, the read replica, Redis, the AI service and each active provider's circuit
        breaker, and records ok, down (with the error) or disabled (not configured). Per component: its status now,
        its last latency, and its uptime over 24 hours, 7 days and 30 days (ok / (ok + down) minutes, floored to two
        decimals; minutes with no sample are no data and left out). For the API itself a minute between two of its
        samples with none is the API down. Also every outage (a run of down minutes) of the last 30 days, and the
        scheduled job runs that failed. Read from the primary; never cached. Needs system:read (admin).
      responses:
        '200':
          description: The summary.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/SystemHealth' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /telemetry/web-vitals:
    post:
      tags: [System]
      operationId: reportWebVitals
      summary: How fast a page was for a real session (FMS-75)
      description: >
        Any signed-in user. The web app reports Core Web Vitals (LCP, INP, CLS, FCP, TTFB: the times in milliseconds, CLS a
        score) with the rating the browser gave and the route template of the page (`/vehicles/:id`, never a URL). They are
        recorded as Prometheus histograms by metric and page (docs/metrics.md); nothing about the user is kept. At most 10 a
        request; a page beyond the first 100 distinct ones counts as `other`. Answers 204 with no body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [metrics]
              properties:
                metrics:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required: [name, value, rating]
                    properties:
                      name: { type: string, enum: [LCP, INP, CLS, FCP, TTFB] }
                      value: { type: number, minimum: 0, maximum: 600000, description: 'Milliseconds; for CLS a score of at most 20.' }
                      rating: { type: string, enum: [good, needs-improvement, poor] }
                      page: { type: string, maxLength: 80, pattern: '^/[A-Za-z0-9/:_-]*$', description: 'The page route template, such as /vehicles/:id.' }
      responses:
        '204': { description: Recorded. }
        '400':
          description: VALIDATION_FAILED (an unknown metric, a negative or absurd value, a page that is not a route template, more than 10).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /system/health/history:
    get:
      tags: [System]
      operationId: getSystemHealthHistory
      summary: Requests, errors, latency and component status over time (FMS-143)
      description: >
        A window cut into cells ending at the start of the current minute: 96 cells of 15 minutes over 24 hours, 84
        of 2 hours over 7 days, 90 of 8 hours over 30 days. Per cell, the API's requests, its 5xx answers, their
        share and the p95 latency (from a latency histogram, interpolated within its bucket), and each component's
        ok, down, disabled and no-data minutes for the status strip. Health checks are not counted. Needs
        system:read (admin).
      parameters:
        - { name: window, in: query, required: false, schema: { type: string, enum: [24h, 7d, 30d], default: 24h } }
      responses:
        '200':
          description: The history.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/SystemHealthHistory' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (a window other than 24h, 7d or 30d).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: fms_access
      description: The httpOnly access cookie set by POST /auth/login and rotated by POST /auth/refresh.
    deviceToken:
      type: http
      scheme: bearer
      description: A GPS device's token (fmsd_...), issued by npm run device:register; only its SHA-256 is stored.
    webhookSignature:
      type: apiKey
      in: header
      name: X-FMS-Signature
      description: >
        Webhooks only: "sha256=" and the hex HMAC-SHA256 of "<X-FMS-Timestamp>.<raw body>" with the provider's
        shared secret. Compared in constant time; the timestamp must be within 5 minutes of the server clock.

  parameters:
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PredictionId:
      name: prediction_id
      in: path
      required: true
      description: A prediction's id, as GET /vehicles/{vehicle_id}/maintenance-risk returns it (prediction_id).
      schema: { type: string, format: uuid }
    ServiceProgramId:
      name: program_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WarrantyId:
      name: warranty_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecallId:
      name: recall_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MaintenanceRecordId:
      name: record_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AlertId:
      name: alert_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TripId:
      name: trip_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExceptionId:
      name: exception_id
      in: path
      required: true
      description: An assignment held for approval (FMS-151).
      schema: { type: string, format: uuid }
    MlModelId:
      name: model_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VehicleId:
      name: vehicle_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RouteId:
      name: route_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FuelLogId:
      name: fuel_log_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: The page, from 1.
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      description: Items per page. A larger value is capped at 100.
      schema: { type: integer, minimum: 1, default: 25 }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DepotId:
      name: depot_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DriverId:
      name: driver_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttendanceId:
      name: attendance_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PartId:
      name: part_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The version last read, as an ETag ("3"). A newer version is 409 CONFLICT_CONCURRENT_MODIFICATION.
      schema: { type: string }
    ProviderCode:
      name: provider
      in: path
      required: true
      description: The provider's code (integration.external_providers.code), e.g. mock-telematics.
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
    WebhookTimestamp:
      name: X-FMS-Timestamp
      in: header
      required: true
      description: When the provider signed the delivery, in Unix seconds. Part of the signed text.
      schema: { type: string, pattern: '^[0-9]{1,12}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Makes a retry safe: the same key and body replays the stored 2xx with Idempotent-Replayed: true.
        Kept 24 hours, except on POST /fuel-logs, /dvir-reports and /incidents (the driver's offline
        queue), which keep it 7 days.
      schema: { type: string, format: uuid }

  headers:
    ETag:
      description: The resource's version, quoted ("3").
      schema: { type: string }

  responses:
    TripMoved:
      description: The trip after the move.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { $ref: '#/components/schemas/Trip' }
              meta:
                type: object
                required: [warnings, request_id]
                properties:
                  warnings:
                    type: array
                    items: { $ref: '#/components/schemas/AssignmentWarning' }
                  request_id: { type: string, format: uuid }
    TripMoveRefused:
      description: >
        CONFLICT_INVALID_STATE_TRANSITION (details[].allowed_transitions lists where the trip can go; empty for
        completed and cancelled), CONFLICT_CONCURRENT_MODIFICATION, or on start the assignment's
        CONFLICT_DEPOT_MISMATCH, CONFLICT_VEHICLE_FLAGGED and CONFLICT_DRIVER_NOT_ELIGIBLE.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    WebhookAccepted:
      description: Stored and announced, or a duplicate of a delivery already stored (the same id).
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [id, status, duplicate]
                properties:
                  id: { type: string, format: uuid, description: The inbound sync log. }
                  status: { type: string, enum: [accepted] }
                  duplicate: { type: boolean }
              meta: { $ref: '#/components/schemas/Meta' }
    WebhookRefused:
      description: >
        AUTH_TOKEN_INVALID (signature missing, malformed or not matching; details reason missing_signature,
        malformed_signature or signature_mismatch) or AUTH_TOKEN_EXPIRED (a genuine signature with a timestamp more
        than 5 minutes from the server clock: a replay). Nothing is stored.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    DvirRecorded:
      description: >
        The inspection: 201 when it was recorded now, 200 when this trip already had one of this type (the original
        is returned and meta.created is false).
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { $ref: '#/components/schemas/DvirReport' }
              meta:
                type: object
                required: [created, request_id]
                properties:
                  created: { type: boolean }
                  request_id: { type: string, format: uuid }
    Unauthenticated:
      description: AUTH_TOKEN_INVALID (no session, or a bad token) or AUTH_TOKEN_EXPIRED.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: FORBIDDEN_INSUFFICIENT_ROLE (the role lacks the permission), or on a write made with the session cookie, FORBIDDEN_CSRF (not from this site, or no valid X-CSRF-Token).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: NOT_FOUND (missing, or outside the caller's depots).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    AssignmentExceptionDecision:
      description: The request as decided (FMS-151); meta has the trip as it is now and, on approval, its warnings.
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { $ref: '#/components/schemas/AssignmentException' }
              meta:
                type: object
                required: [trip, warnings, request_id]
                properties:
                  trip: { $ref: '#/components/schemas/Trip' }
                  warnings:
                    type: array
                    items: { $ref: '#/components/schemas/AssignmentWarning' }
                  request_id: { type: string, format: uuid }

  schemas:
    Uptime:
      type: object
      required: [uptime_pct, ok_minutes, down_minutes, disabled_minutes, no_data_minutes]
      properties:
        uptime_pct: { type: [number, 'null'], description: 'ok / (ok + down), floored to two decimals; null with neither.' }
        ok_minutes: { type: integer }
        down_minutes: { type: integer }
        disabled_minutes: { type: integer }
        no_data_minutes: { type: integer, description: Minutes since sampling began with no sample of the component. }
    ComponentHealth:
      type: object
      required: [component, kind, label, status, checked_at, latency_ms, error, uptime]
      properties:
        component: { type: string, description: 'api, database, replica, redis, ai_service, or provider:<code>.' }
        kind: { type: string, enum: [api, database, replica, redis, ai_service, provider] }
        label: { type: string }
        status: { type: string, enum: [ok, down, disabled, no_data], description: Its sample of the last minute or the one before. }
        checked_at: { type: [string, 'null'], format: date-time }
        latency_ms: { type: [integer, 'null'], description: "The last check's; a provider's is its circuit's mean." }
        error: { type: [string, 'null'], description: 'Why it is down, in our words (never a request, a user or an id).' }
        uptime:
          type: object
          required: [24h, 7d, 30d]
          properties:
            24h: { $ref: '#/components/schemas/Uptime' }
            7d: { $ref: '#/components/schemas/Uptime' }
            30d: { $ref: '#/components/schemas/Uptime' }
    Outage:
      type: object
      required: [component, label, started_at, ended_at, duration_minutes, error]
      properties:
        component: { type: string }
        label: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time, description: Null while it goes on. }
        duration_minutes: { type: integer }
        error: { type: [string, 'null'], description: 'The first error of the outage; for the API, "No samples: the API was not running".' }
    FailedJobRun:
      type: object
      required: [job, run_key, attempts, started_at, failed_at, error]
      properties:
        job: { type: string }
        run_key: { type: string, description: 'The local day (YYYY-MM-DD) of a daily job, the slot (YYYY-MM-DDTHH:MM) of an interval job.' }
        attempts: { type: integer }
        started_at: { type: string, format: date-time }
        failed_at: { type: string, format: date-time }
        error: { type: [string, 'null'] }
    SystemHealth:
      type: object
      required: [generated_at, window_end, sampled_from, components, outages, outages_total, failed_jobs, failed_jobs_total]
      properties:
        generated_at: { type: string, format: date-time }
        window_end: { type: string, format: date-time, description: The start of the current minute; every window ends there. }
        sampled_from: { type: [string, 'null'], format: date-time, description: 'The first sample in the last 30 days; null when there is none.' }
        components: { type: array, items: { $ref: '#/components/schemas/ComponentHealth' } }
        outages: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Outage' }, description: 'The last 30 days, newest first.' }
        outages_total: { type: integer }
        failed_jobs: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/FailedJobRun' }, description: "The last 30 days, newest first (interval jobs' runs are kept 7 days)." }
        failed_jobs_total: { type: integer }
    RequestStats:
      type: object
      required: [requests, errors_5xx, error_rate_pct, p95_ms]
      properties:
        requests: { type: integer }
        errors_5xx: { type: integer }
        error_rate_pct: { type: [number, 'null'] }
        p95_ms: { type: [integer, 'null'], description: 'At least 10000 when the 95th request took over 10 s.' }
    SystemHealthHistory:
      type: object
      required: [window, from, to, bucket_minutes, requests, components]
      properties:
        window: { type: string, enum: [24h, 7d, 30d] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucket_minutes: { type: integer, enum: [15, 120, 480] }
        requests:
          allOf:
            - { $ref: '#/components/schemas/RequestStats' }
            - type: object
              required: [cells]
              properties:
                cells:
                  type: array
                  items:
                    allOf:
                      - { $ref: '#/components/schemas/RequestStats' }
                      - { type: object, required: [start], properties: { start: { type: string, format: date-time } } }
        components:
          type: array
          items:
            type: object
            required: [component, label, cells]
            properties:
              component: { type: string }
              label: { type: string }
              cells:
                type: array
                items:
                  type: object
                  required: [start, ok_minutes, down_minutes, disabled_minutes, no_data_minutes]
                  properties:
                    start: { type: string, format: date-time }
                    ok_minutes: { type: integer }
                    down_minutes: { type: integer }
                    disabled_minutes: { type: integer }
                    no_data_minutes: { type: integer }
    Backup:
      type: object
      description: A database backup (FMS-144, docs/backups.md).
      required: [id, kind, status, database_name, requested_by, requested_at, started_at, finished_at, size_bytes, checksum_sha256, error, expires_at, downloadable]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [scheduled, manual] }
        status: { type: string, enum: [queued, running, succeeded, failed, expired] }
        database_name: { type: string }
        requested_by:
          type: object
          nullable: true
          description: Who pressed Back up now; null for the nightly one.
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        requested_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        size_bytes: { type: integer, nullable: true }
        checksum_sha256: { type: string, nullable: true, pattern: '^[0-9a-f]{64}$' }
        error: { type: string, nullable: true, description: "pg_dump's own words, for a failed backup." }
        expires_at: { type: string, format: date-time, nullable: true, description: When the file is removed (succeeded), or was (expired). }
        downloadable: { type: boolean }
    BackupsMeta:
      type: object
      required: [page, page_size, total_items, total_pages, available, retention_days, last_succeeded_at, last_restore_drill, request_id]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }
        available: { type: boolean, description: Whether this server can take a backup (pg_dump's credentials are set). }
        retention_days: { type: integer }
        last_succeeded_at: { type: string, format: date-time, nullable: true }
        last_restore_drill:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            backup_id: { type: string, format: uuid }
            target_database: { type: string }
            status: { type: string, enum: [succeeded, failed] }
            started_at: { type: string, format: date-time }
            finished_at: { type: string, format: date-time }
            tables_restored: { type: integer, nullable: true }
            error: { type: string, nullable: true }
            run_by: { type: string }
        request_id: { type: string, format: uuid }
    PhotoUrl:
      type: object
      required: [photo_url]
      properties:
        photo_url: { type: string, description: 'The URL to show the photo from, versioned (?v=) by when it changed (docs/photos.md).' }
    Setting:
      type: object
      description: A setting an administrator tunes (FMS-80, docs/settings.md).
      required: [key, value, default_value, is_default, unit, min, max, updated_by, updated_by_name, updated_at]
      properties:
        key:
          type: string
          enum:
            [
              fuel_variance_threshold_pct,
              health_alert_below,
              expiry_warning_days,
              driver_score_weight_punctuality,
              driver_score_weight_safety,
              driver_score_weight_incidents,
              driver_score_weight_dvir,
            ]
        value: { type: integer }
        default_value: { type: integer }
        is_default: { type: boolean }
        unit: { type: string, enum: [percent, score, days, weight], description: 'weight: a share of the driver performance score (FMS-146).' }
        min: { type: integer }
        max: { type: integer }
        updated_by: { type: [string, 'null'], format: uuid, description: Who changed it last; null while never changed. }
        updated_by_name: { type: [string, 'null'] }
        updated_at: { type: [string, 'null'], format: date-time }
    RuleThresholds:
      type: object
      description: >
        The telemetry rules' thresholds (FMS-46, FMS-90), with the trip delay alert's margins (FMS-147). In a PUT the four
        of FMS-46 are required; route deviation's and the margins are optional, and one left out keeps the row's value
        (or the starting one). trip_delay_urgent_minutes must be above trip_delay_minutes (400 not_above_late).
      additionalProperties: false
      required: [speed_limit_kmh, speeding_pings, clear_pings, idle_minutes]
      properties:
        speed_limit_kmh: { type: integer, minimum: 20, maximum: 200 }
        speeding_pings: { type: integer, minimum: 1, maximum: 20, description: Consecutive pings over the limit that raise a speeding flag. }
        clear_pings: { type: integer, minimum: 1, maximum: 20, description: Consecutive pings at or under the limit that resolve it. }
        idle_minutes: { type: integer, minimum: 1, maximum: 120, description: Minutes at 0 km/h, engine not reported off, that raise an idling flag. }
        route_deviation_m: { type: integer, minimum: 100, maximum: 5000, default: 500, description: Further than this from the trip's road is off route. }
        route_deviation_pings: { type: integer, minimum: 1, maximum: 20, default: 3, description: Consecutive pings off route that raise a route deviation flag; clear_pings back on it resolve it. }
        trip_delay_minutes: { type: integer, minimum: 5, maximum: 240, default: 15, description: Minutes past its scheduled end a trip under way is expected before its dispatchers are told it is late. }
        trip_delay_urgent_minutes: { type: integer, minimum: 10, maximum: 720, default: 60, description: Minutes past its scheduled end before the late trip is urgent (email, SMS and push); above trip_delay_minutes. }
        driver_attendance_exception: { type: string, enum: [warn, approve], default: warn, description: 'FMS-151: a driver marked absent, on leave or sick that day only warns, or holds the assignment for a fleet manager.' }
        trip_overrun_exception: { type: string, enum: [warn, approve], default: warn, description: 'FMS-151: a trip of the driver or vehicle still under way running into this one only warns, or holds the assignment.' }
        daily_distance_km: { type: integer, minimum: 50, maximum: 2000, default: 500, description: 'FMS-156: the load-weighted km a driver may be given in a calendar day in Addis Ababa.' }
        weekly_distance_km: { type: integer, minimum: 100, maximum: 10000, default: 2500, description: 'FMS-156: the same, Monday to Sunday; at least daily_distance_km (400 below_daily).' }
        distance_weight_light: { type: number, minimum: 0.5, maximum: 3, multipleOf: 0.01, default: 0.8, description: 'FMS-156: what a km of a light job counts for; at most the standard weight.' }
        distance_weight_standard: { type: number, minimum: 0.5, maximum: 3, multipleOf: 0.01, default: 1 }
        distance_weight_heavy: { type: number, minimum: 0.5, maximum: 3, multipleOf: 0.01, default: 1.5, description: 'FMS-156: at least the standard weight.' }
    RuleThresholdRow:
      type: object
      description: A row of thresholds as stored, the fleet's or a depot's (a depot's adds depot_id in the list), with who changed it last.
      required: [speed_limit_kmh, speeding_pings, clear_pings, idle_minutes, route_deviation_m, route_deviation_pings, trip_delay_minutes, trip_delay_urgent_minutes, driver_attendance_exception, trip_overrun_exception, daily_distance_km, weekly_distance_km, distance_weight_light, distance_weight_standard, distance_weight_heavy, updated_by, updated_by_name, updated_at]
      properties:
        speed_limit_kmh: { type: integer, minimum: 20, maximum: 200 }
        speeding_pings: { type: integer, minimum: 1, maximum: 20 }
        clear_pings: { type: integer, minimum: 1, maximum: 20 }
        idle_minutes: { type: integer, minimum: 1, maximum: 120 }
        route_deviation_m: { type: integer, minimum: 100, maximum: 5000 }
        route_deviation_pings: { type: integer, minimum: 1, maximum: 20 }
        trip_delay_minutes: { type: integer, minimum: 5, maximum: 240 }
        trip_delay_urgent_minutes: { type: integer, minimum: 10, maximum: 720 }
        driver_attendance_exception: { type: string, enum: [warn, approve] }
        trip_overrun_exception: { type: string, enum: [warn, approve] }
        daily_distance_km: { type: integer, minimum: 50, maximum: 2000 }
        weekly_distance_km: { type: integer, minimum: 100, maximum: 10000 }
        distance_weight_light: { type: number, minimum: 0.5, maximum: 3 }
        distance_weight_standard: { type: number, minimum: 0.5, maximum: 3 }
        distance_weight_heavy: { type: number, minimum: 0.5, maximum: 3 }
        updated_by: { type: [string, 'null'], format: uuid }
        updated_by_name: { type: [string, 'null'] }
        updated_at: { type: [string, 'null'], format: date-time }
    GeofencePolygon:
      type: object
      description: GeoJSON Polygon of one ring (no holes), [longitude, latitude] pairs, open or closed; 3 to 500 corners.
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, const: Polygon }
        coordinates:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: array
            minItems: 3
            maxItems: 501
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: number }
    GeofenceInput:
      type: object
      additionalProperties: false
      required: [depot_id, name, kind, polygon]
      properties:
        depot_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120, description: Unique per depot among active fences, ignoring case. }
        description: { type: [string, 'null'], maxLength: 500 }
        kind: { type: string, enum: [keep_in, keep_out], description: 'keep_in: its vehicles must stay inside. keep_out: they must not enter.' }
        applies: { type: string, enum: [always, off_trip], default: always, description: 'off_trip: only while the vehicle is on no trip.' }
        polygon: { $ref: '#/components/schemas/GeofencePolygon' }
    GeofencePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        depot_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 500 }
        kind: { type: string, enum: [keep_in, keep_out] }
        applies: { type: string, enum: [always, off_trip] }
        polygon: { $ref: '#/components/schemas/GeofencePolygon' }
    Geofence:
      type: object
      description: A depot's geofence (FMS-90, docs/geofences.md).
      additionalProperties: false
      required: [geofence_id, depot_id, name, description, kind, applies, polygon, area_m2, is_active, version, created_at, updated_at, updated_by, updated_by_name]
      properties:
        geofence_id: { type: string, format: uuid }
        depot_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        kind: { type: string, enum: [keep_in, keep_out] }
        applies: { type: string, enum: [always, off_trip] }
        polygon:
          type: object
          description: The ring as stored, closed.
          required: [type, coordinates]
          properties:
            type: { type: string, const: Polygon }
            coordinates: { type: array, items: { type: array, items: { type: array, items: { type: number } } } }
        area_m2: { type: integer, minimum: 1 }
        is_active: { type: boolean, description: False once removed. }
        version: { type: integer, minimum: 0, description: Also the ETag. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        updated_by: { type: [string, 'null'], format: uuid }
        updated_by_name: { type: [string, 'null'] }
    RuleThresholdList:
      type: object
      required: [fleet, depots]
      properties:
        fleet: { $ref: '#/components/schemas/RuleThresholdRow' }
        depots:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/RuleThresholdRow' }
              - type: object
                required: [depot_id]
                properties:
                  depot_id: { type: string, format: uuid }
    NullablePoint:
      type: [object, 'null']
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }

    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string, format: uuid }

    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 'SCREAMING_SNAKE_CASE, from api-contract §3.6.' }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [reason]
                properties:
                  field: { type: string }
                  reason: { type: string }
                  record_id:
                    type: string
                    format: uuid
                    description: The record the problem is about (the conflicting trip, the open maintenance record).
                  shiftable:
                    type: boolean
                    description: For a trip overlap, whether the other trip can move later to make room (FMS-139).
                  shift_minutes:
                    type: integer
                    description: How many minutes later it would move, when shiftable.
                  period:
                    type: string
                    enum: [day, week]
                    description: For CONFLICT_DRIVER_DISTANCE_LIMIT (FMS-156), the period past its limit.
                  limit_km: { type: number, description: 'FMS-156: the limit.' }
                  total_km: { type: number, description: "FMS-156: the driver's load-weighted km in the period with the trip." }
                  without_trip_km: { type: number, description: 'FMS-156: and without it.' }
                  allowed_transitions:
                    type: array
                    items: { type: string }
                    description: For a refused state change, the states the record can move to from where it is.
        meta:
          type: object
          properties:
            request_id: { type: string, format: uuid }
            timestamp: { type: string, format: date-time }

    PageMeta:
      type: object
      description: The meta of a paged list (api-contract §18).
      required: [page, page_size, total_items, total_pages, request_id]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total_items: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
        request_id: { type: string, format: uuid }

    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90, description: At most 6 decimals. }
        longitude: { type: number, minimum: -180, maximum: 180, description: At most 6 decimals. }

    RouteFields:
      type: object
      description: >
        What a route is made of. Anything else is refused (VALIDATION_FAILED, reason not_writable). Strings are
        trimmed.
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        depot_id: { type: string, format: uuid, description: One of the caller's depots; never null. }
        origin_name: { type: [string, 'null'], maxLength: 255 }
        origin: { oneOf: [{ $ref: '#/components/schemas/Coordinates' }, { type: 'null' }] }
        destination_name: { type: [string, 'null'], maxLength: 255 }
        destination: { oneOf: [{ $ref: '#/components/schemas/Coordinates' }, { type: 'null' }] }
        stops:
          type: array
          maxItems: 25
          description: In travel order. A stop gives both latitude and longitude, or neither.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 1, maxLength: 255 }
              latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
              longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
        distance_km: { type: [number, 'null'], minimum: 0, maximum: 100000, description: Entered by hand; at most 3 decimals. }
        estimated_duration_seconds: { type: [integer, 'null'], minimum: 0, maximum: 2592000 }

    Route:
      type: object
      description: A reusable route (FMS-83). A retired route (is_active false) stays readable for the trips that used it.
      required: [id, name, depot_id, origin_name, origin, destination_name, destination, stops, distance_km, estimated_duration_seconds, is_active, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        depot_id: { type: string, format: uuid }
        origin_name: { type: [string, 'null'] }
        origin: { oneOf: [{ $ref: '#/components/schemas/Coordinates' }, { type: 'null' }] }
        destination_name: { type: [string, 'null'] }
        destination: { oneOf: [{ $ref: '#/components/schemas/Coordinates' }, { type: 'null' }] }
        stops:
          type: array
          items:
            type: object
            required: [name, latitude, longitude]
            properties:
              name: { type: string }
              latitude: { type: [number, 'null'] }
              longitude: { type: [number, 'null'] }
        distance_km: { type: [number, 'null'] }
        estimated_duration_seconds: { type: [integer, 'null'] }
        is_active: { type: boolean }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DvirInput:
      type: object
      additionalProperties: false
      required: [vehicle_id, type, items]
      properties:
        vehicle_id: { type: string, format: uuid, description: A live vehicle in the caller's depots. }
        trip_id: { type: string, format: uuid, description: A trip the caller may see; if it has a vehicle, this one. }
        driver_id: { type: string, format: uuid, description: Required for staff; a driver must leave it out. }
        type: { type: string, enum: [pre_trip, post_trip, routine, other] }
        items:
          type: array
          minItems: 1
          maxItems: 100
          description: The checklist; each name once (case-insensitively).
          items:
            type: object
            additionalProperties: false
            required: [name, passed]
            properties:
              name: { type: string, minLength: 1, maxLength: 100 }
              passed: { type: boolean, description: False is a defect. }
              notes: { type: [string, 'null'], maxLength: 1000 }
        issues_found: { type: boolean, description: The driver's own answer; any failed item forces it true. }
        submitted_at: { type: string, format: date-time, description: 'When the driver pressed submit. Default now; not in the future (5 minutes of clock drift allowed), not over 30 days ago.' }

    DvirReport:
      type: object
      description: A vehicle inspection (FMS-36).
      required: [id, vehicle_id, driver_id, trip_id, type, status, items, defects, issues_found, submitted_at, created_at]
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        trip_id: { type: [string, 'null'], format: uuid }
        type: { type: string, enum: [pre_trip, post_trip, routine, other] }
        status: { type: string, enum: [submitted, reviewed, requires_action, closed] }
        items:
          type: array
          items:
            type: object
            required: [name, passed, notes]
            properties:
              name: { type: string }
              passed: { type: boolean }
              notes: { type: [string, 'null'] }
        defects:
          type: array
          description: The failed items.
          items:
            type: object
            required: [name, notes]
            properties:
              name: { type: string }
              notes: { type: [string, 'null'] }
        issues_found: { type: boolean }
        submitted_at: { type: string, format: date-time, description: Earlier than created_at when it came from the offline queue. }
        created_at: { type: string, format: date-time }

    UserProfile:
      type: object
      description: The signed-in user's profile.
      required: [id, email, full_name, phone, status, depot_id, last_login_at, photo_url]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        phone: { type: [string, 'null'] }
        status: { type: string, enum: [active, inactive, suspended, locked] }
        depot_id: { type: [string, 'null'], format: uuid, description: The home depot. }
        last_login_at: { type: [string, 'null'], format: date-time }
        photo_url: { type: [string, 'null'], description: 'The photo (docs/photos.md), or null: the screens show the initials.' }

    CurrentUser:
      type: object
      description: Who is signed in, with what the roles allow.
      required: [user, roles, permissions]
      properties:
        user: { $ref: '#/components/schemas/UserProfile' }
        roles: { type: array, items: { type: string }, description: Role names. }
        permissions: { type: array, items: { type: string }, description: 'Every permission code the roles grant, e.g. vehicle:read.' }

    User:
      type: object
      description: A user account (FMS-78).
      required: [id, email, full_name, phone, depot_id, status, roles, has_password, last_login_at, photo_url, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        phone: { type: [string, 'null'] }
        depot_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [active, inactive, suspended, locked] }
        roles: { type: array, items: { type: string } }
        has_password: { type: boolean, description: False until a password is set; such an account signs in only after its setup link. }
        last_login_at: { type: [string, 'null'], format: date-time }
        photo_url: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Role:
      type: object
      required: [name, description, permissions]
      properties:
        name: { type: string, example: dispatcher }
        description: { type: [string, 'null'] }
        permissions: { type: array, items: { type: string } }

    PasswordLink:
      type: object
      description: A one-time link to set a password, shown once to the administrator who issued it.
      required: [token, purpose, expires_at]
      properties:
        token: { type: string, description: 256 random bits; POST /auth/password takes it. Stored only as a hash. }
        purpose: { type: string, enum: [setup, reset], description: 'setup: the account has no password yet (72 hours); reset: it has one (1 hour).' }
        expires_at: { type: string, format: date-time }

    DepotFields:
      type: object
      description: The writable fields of a depot. Anything else is refused (not_writable). is_active changes only through DELETE and reactivate.
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        location: { type: string, minLength: 1, maxLength: 255, description: 'A display location, e.g. Addis Ababa.' }
        code: { type: [string, 'null'], maxLength: 50, pattern: '^[A-Za-z0-9][A-Za-z0-9-]*$', description: Stored trimmed and in upper case (e.g. ADD-01); unique. }
        address: { type: [string, 'null'], maxLength: 1000 }
        city: { type: [string, 'null'], maxLength: 120 }
        country: { type: [string, 'null'], maxLength: 120 }
        timezone: { type: [string, 'null'], example: Africa/Addis_Ababa, description: An IANA time zone. }
        latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
        longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
        capacity: { type: [integer, 'null'], minimum: 0, maximum: 100000, description: Vehicles the yard holds. }
        work_starts_at: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '08:00', description: 'When the depot''s day starts (Addis Ababa).' }
        late_after_minutes: { type: integer, minimum: 0, maximum: 240, description: A check-in later than work_starts_at plus this is late (FMS-141). }

    Depot:
      type: object
      description: A depot (FMS-20).
      required: [id, name, code, location, address, city, country, timezone, latitude, longitude, capacity, work_starts_at, late_after_minutes, is_active, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: [string, 'null'] }
        location: { type: string }
        address: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        country: { type: [string, 'null'] }
        timezone: { type: [string, 'null'] }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        capacity: { type: [integer, 'null'] }
        work_starts_at: { type: string }
        late_after_minutes: { type: integer }
        is_active: { type: boolean, description: False once deleted (soft). }
        version: { type: integer, description: Bumped on every change; also the ETag. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VehicleFields:
      type: object
      description: >
        The writable fields of a vehicle. status, maintenance_flag and health_score are set by their own workflows and
        are refused here (not_writable), like any unknown field.
      properties:
        registration_number: { type: string, minLength: 1, maxLength: 50, description: Stored trimmed and in upper case; unique. }
        vin: { type: [string, 'null'], pattern: '^[A-HJ-NPR-Z0-9]{17}$', description: '17 characters: digits and capitals except I, O and Q.' }
        make: { type: string, minLength: 1, maxLength: 100 }
        model: { type: string, minLength: 1, maxLength: 100 }
        year: { type: [integer, 'null'], minimum: 1900 }
        vehicle_type: { type: string, enum: [car, suv, van, truck, bus, motorcycle, other] }
        fuel_type: { type: string, enum: [petrol, diesel, hybrid, electric, cng, lpg, other] }
        fuel_efficiency_ml_per_km: { type: [integer, 'null'], minimum: 1, maximum: 100000, description: Whole millilitres per km. Required unless the vehicle is electric. }
        depot_id: { type: string, format: uuid }
        odometer_km: { type: number, minimum: 0, description: At most one decimal. }
        payload_capacity_kg: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 100000, description: 'What it carries, kg, two decimals (FMS-153): a trip''s cargo is never more.' }
        body: { type: [string, 'null'], enum: [passenger, dry_cargo, tanker, special, null], description: 'What it carries, for the driver licence check (SE-198).' }
        seats: { type: [integer, 'null'], minimum: 0, maximum: 120, description: Passenger seats, the driver not counted. }
        gross_weight_kg: { type: [integer, 'null'], minimum: 1, maximum: 100000, description: Gross vehicle weight, kg. }

    VehicleTrip:
      type: object
      description: The trip a vehicle or driver is on now.
      required: [id, status, origin, destination, scheduled_start]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [assigned, en_route] }
        origin: { type: [string, 'null'] }
        destination: { type: [string, 'null'] }
        scheduled_start: { type: [string, 'null'], format: date-time }

    Vehicle:
      type: object
      description: A vehicle (FMS-16, api-contract §16.1).
      required: [id, registration_number, vin, make, model, year, vehicle_type, fuel_type, fuel_efficiency_ml_per_km, status, maintenance_flag, health_score, health_score_updated_at, depot_id, odometer_km, current_trip, version, photo_url, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        registration_number: { type: string }
        vin: { type: [string, 'null'] }
        make: { type: string }
        model: { type: string }
        year: { type: [integer, 'null'] }
        vehicle_type: { type: string, enum: [car, suv, van, truck, bus, motorcycle, other] }
        fuel_type: { type: string, enum: [petrol, diesel, hybrid, electric, cng, lpg, other] }
        fuel_efficiency_ml_per_km: { type: [integer, 'null'] }
        payload_capacity_kg: { type: [number, 'null'], description: What it carries, kg (FMS-153); null while nobody has said. }
        body: { type: [string, 'null'], enum: [passenger, dry_cargo, tanker, special, null] }
        seats: { type: [integer, 'null'] }
        gross_weight_kg: { type: [integer, 'null'] }
        status: { $ref: '#/components/schemas/VehicleStatusValue' }
        maintenance_flag: { type: boolean, description: Set while work on the vehicle is open; a flagged vehicle cannot be dispatched. }
        health_score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        health_score_updated_at: { type: [string, 'null'], format: date-time }
        depot_id: { type: string, format: uuid }
        odometer_km: { type: number }
        current_trip: { oneOf: [{ $ref: '#/components/schemas/VehicleTrip' }, { type: 'null' }], description: The assigned or en-route trip, en route first. }
        version: { type: integer, description: Bumped on every change; also the ETag. }
        photo_url: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DriverFields:
      type: object
      description: >
        The writable fields of a driver. The name, email and phone belong to the user account and change through user
        administration. Anything else is refused (not_writable).
      properties:
        license_number: { type: string, minLength: 1, maxLength: 100, description: Stored normalised; unique. }
        license_categories:
          type: array
          description: Ethiopian licence classes held (SE-198, docs/driving-licences.md). Stored without duplicates in this order; an empty array clears them. A vehicle is allowed when a class covers its body, seats and gross weight.
          items: { type: string, enum: [motorcycle, automobile, taxi_1, taxi_2, public_1, public_2, dry_cargo_1, dry_cargo_2, dry_cargo_3, liquid_cargo_1, liquid_cargo_2, special] }
        license_expiry: { type: string, format: date }
        hire_date: { type: [string, 'null'], format: date, description: Not in the future. }
        emergency_phone: { type: [string, 'null'], pattern: '^\+?[0-9][0-9 ()-]{5,29}$' }
        depot_id: { type: string, format: uuid, description: The home depot. }

    Driver:
      type: object
      description: A driver (FMS-19, api-contract §6.3).
      required: [id, user_id, full_name, photo_url, email, phone, depot_id, license_number, license_categories, license_expiry, license_status, hire_date, emergency_phone, status, current_trip, attendance_today, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid, description: The user account. }
        full_name: { type: string }
        photo_url: { type: [string, 'null'] }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        depot_id: { type: [string, 'null'], format: uuid }
        license_number: { type: string }
        license_categories: { type: array, items: { type: string } }
        license_expiry: { type: string, format: date }
        license_status: { type: string, enum: [valid, expiring_soon, expired], description: From the expiry and today's date in Addis Ababa; expiring_soon within 30 days. }
        hire_date: { type: [string, 'null'], format: date }
        emergency_phone: { type: [string, 'null'] }
        status: { type: string, enum: [active, retired] }
        current_trip: { oneOf: [{ $ref: '#/components/schemas/VehicleTrip' }, { type: 'null' }] }
        attendance_today: { type: [string, 'null'], enum: [present, absent, on_leave, late, sick, other, null], description: "Today's attendance in Addis Ababa, or null if not recorded." }
        version: { type: integer, description: Bumped on every change; also the ETag. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RosterEntry:
      type: object
      description: One driver on a day's roster (FMS-21).
      required: [driver_id, full_name, email, depot_id, license_status, date, attendance]
      properties:
        driver_id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: string, format: email }
        depot_id: { type: [string, 'null'], format: uuid }
        license_status: { type: string, enum: [valid, expiring_soon, expired] }
        date: { type: string, format: date }
        attendance:
          description: Their record for the day, or null if not marked yet.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, status, notes, check_in_at, check_in_method, check_out_at, check_out_method, logged_by, logged_by_name, created_at, updated_at]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [present, absent, on_leave, late, sick, other] }
                notes: { type: [string, 'null'] }
                check_in_at: { type: [string, 'null'], format: date-time }
                check_in_method: { type: [string, 'null'], enum: [qr, manual, null] }
                check_out_at: { type: [string, 'null'], format: date-time }
                check_out_method: { type: [string, 'null'], enum: [qr, manual, null] }
                logged_by: { type: string, format: uuid }
                logged_by_name: { type: string }
                created_at: { type: string, format: date-time }
                updated_at: { type: string, format: date-time }

    DocumentType:
      type: string
      enum: [registration, licence, insurance, maintenance_invoice, inspection_evidence, incident_photo, dvir_attachment, fuel_receipt, other]

    Document:
      type: object
      description: A file attached to a vehicle or a driver (FMS-25). JPEG, PNG or PDF, at most 10 MB.
      required: [id, owner_type, owner_id, document_type, original_filename, content_type, size_bytes, sha256, expires_on, retain_until, uploaded_by, uploaded_at]
      properties:
        id: { type: string, format: uuid }
        owner_type: { type: string, enum: [vehicle, driver] }
        owner_id: { type: string, format: uuid }
        document_type: { $ref: '#/components/schemas/DocumentType' }
        original_filename: { type: [string, 'null'] }
        content_type: { type: string, enum: [image/jpeg, image/png, application/pdf], description: Read from the file's first bytes. }
        size_bytes: { type: integer }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        expires_on: { type: [string, 'null'], format: date, description: The document's own expiry. }
        retain_until: { type: [string, 'null'], format: date, description: Keep the file at least until then. }
        uploaded_by: { type: string, format: uuid }
        uploaded_at: { type: string, format: date-time }

    DocumentWithUrl:
      description: A document with a signed link to its bytes.
      allOf:
        - $ref: '#/components/schemas/Document'
        - type: object
          required: [url, url_expires_at]
          properties:
            url: { type: string, description: 'GET /documents/{document_id}/content with its signature; works without a session.' }
            url_expires_at: { type: string, format: date-time }

    MaintenanceStatus:
      type: string
      enum: [scheduled, open, in_progress, completed, cancelled]

    MaintenanceType:
      type: string
      enum: [preventive, corrective, predictive, inspection, other]

    MaintenancePartLine:
      type: object
      required: [part_id, part_number, name, quantity, unit_cost_cents, line_cost_cents]
      properties:
        part_id: { type: string, format: uuid }
        part_number: { type: string }
        name: { type: string }
        quantity: { type: integer }
        unit_cost_cents: { type: integer, description: Whole cents. }
        line_cost_cents: { type: integer, description: quantity times unit_cost_cents. }

    MaintenanceRecord:
      type: object
      description: One piece of repair or service work on a vehicle (FMS-22, api-contract §10.1).
      required: [id, vehicle_id, registration_number, maintenance_type, description, status, priority, scheduled_at, started_at, completed_at, odometer_km, labour_hours, total_cost_cents, parts_cost_cents, workshop, notes, completed_by, service_program, warranty_claim, parts, failures, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        registration_number: { type: string }
        maintenance_type: { $ref: '#/components/schemas/MaintenanceType' }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/MaintenanceStatus' }
        priority: { type: string, enum: [low, normal, high, critical] }
        scheduled_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        odometer_km: { type: [number, 'null'] }
        labour_hours: { type: [number, 'null'] }
        total_cost_cents: { type: integer, description: Whole cents (ETB), never a fraction. }
        parts_cost_cents: { type: integer, description: The parts below, added up. }
        workshop: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        completed_by: { type: [string, 'null'], format: uuid }
        service_program:
          description: The preventive service program this work carries out (FMS-129); completing it starts the program's count again.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
        warranty_claim:
          description: 'The warranty claim (FMS-133); null: no warranty covered it.'
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WarrantyClaim'
        parts: { type: array, items: { $ref: '#/components/schemas/MaintenancePartLine' } }
        failures: { type: array, items: { $ref: '#/components/schemas/FailureEvent' }, description: What failed (FMS-125), oldest first. }
        version: { type: integer, description: Bumped on every change; also the ETag. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MaintenanceWarning:
      description: Something the caller should know that did not stop the write (meta.warnings).
      oneOf:
        - type: object
          description: More of the part was used than the stock record held; stock is now 0 and shortfall were not on record.
          required: [warning, part_id, part_number, stock_quantity, shortfall]
          properties:
            warning: { const: LOW_STOCK }
            part_id: { type: string, format: uuid }
            part_number: { type: string }
            stock_quantity: { type: integer }
            shortfall: { type: integer }
        - type: object
          description: The total cost entered is below the parts' cost.
          required: [warning, total_cost_cents, parts_cost_cents]
          properties:
            warning: { const: COST_BELOW_PARTS }
            total_cost_cents: { type: integer }
            parts_cost_cents: { type: integer }

    MaintenanceEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/MaintenanceRecord' }
        meta:
          type: object
          required: [request_id]
          properties:
            request_id: { type: string, format: uuid }
            warnings:
              type: array
              items: { $ref: '#/components/schemas/MaintenanceWarning' }

    MaintenanceCreate:
      type: object
      additionalProperties: false
      required: [vehicle_id, description, labour_hours, total_cost_cents]
      properties:
        vehicle_id: { type: string, format: uuid }
        description: { type: string, minLength: 1, maxLength: 2000 }
        labour_hours: { type: number, minimum: 0, maximum: 999999, description: At most two decimals. }
        total_cost_cents: { type: integer, minimum: 0, maximum: 2147483647, description: Whole cents. }
        parts:
          type: array
          maxItems: 50
          description: Each part once, with its total quantity.
          items:
            type: object
            additionalProperties: false
            required: [part_id, quantity, unit_cost_cents]
            properties:
              part_id: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 10000 }
              unit_cost_cents: { type: integer, minimum: 0, maximum: 2147483647 }
        maintenance_type: { $ref: '#/components/schemas/MaintenanceType' }
        status: { type: string, enum: [scheduled, open, in_progress] }
        priority: { type: string, enum: [low, normal, high, critical] }
        scheduled_at: { type: [string, 'null'], format: date-time }
        odometer_km: { type: [number, 'null'], minimum: 0, description: At most one decimal. }
        workshop: { type: [string, 'null'], maxLength: 255 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        failures:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/FailureInput' }
        service_program_id: { type: [string, 'null'], format: uuid }

    MaintenanceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: The fields to change. completed_at completes the work.
      properties:
        description: { type: string, minLength: 1, maxLength: 2000 }
        labour_hours: { type: number, minimum: 0, maximum: 999999 }
        total_cost_cents: { type: integer, minimum: 0, maximum: 2147483647 }
        maintenance_type: { $ref: '#/components/schemas/MaintenanceType' }
        status: { $ref: '#/components/schemas/MaintenanceStatus' }
        priority: { type: string, enum: [low, normal, high, critical] }
        scheduled_at: { type: [string, 'null'], format: date-time }
        odometer_km: { type: [number, 'null'], minimum: 0 }
        workshop: { type: [string, 'null'], maxLength: 255 }
        notes: { type: [string, 'null'], maxLength: 4000 }
        completed_at: { type: string, format: date-time }
        service_program_id: { type: [string, 'null'], format: uuid }

    InventoryPartFields:
      type: object
      description: "The writable fields of a spare part. Stock is not here: it moves through adjust and through repairs."
      properties:
        part_number: { type: string, minLength: 1, maxLength: 100, description: Stored trimmed and in upper case; unique. }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, 'null'], maxLength: 2000 }
        depot_id: { type: [string, 'null'], format: uuid, description: The depot holding the stock; null for stock shared by every depot (fleet-wide roles only). }
        unit_cost_cents: { type: [integer, 'null'], minimum: 0, maximum: 2147483647, description: Whole cents. }
        reorder_threshold: { type: integer, minimum: 0, maximum: 1000000 }
        service_item:
          type: [string, 'null']
          enum: [engine_oil, air_filter, fuel_filter, coolant, brake_pads, brake_fluid, clutch_fluid, tyres, battery, gearbox_oil, belts, null]
          description: What the part renews (FMS-52); the predictive model reads each item's last change from repairs that used it.

    InventoryPart:
      type: object
      description: A spare part and its stock (FMS-23).
      required: [id, part_number, name, description, depot_id, unit_cost_cents, stock_quantity, reorder_threshold, below_reorder, stock_status, service_item, is_active, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        part_number: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        depot_id: { type: [string, 'null'], format: uuid }
        unit_cost_cents: { type: [integer, 'null'] }
        stock_quantity: { type: integer }
        reorder_threshold: { type: integer, description: Reorder when stock is at or below this. }
        below_reorder: { type: boolean }
        stock_status: { type: string, enum: [out, low, ok] }
        service_item: { type: [string, 'null'] }
        is_active: { type: boolean }
        version: { type: integer, description: Bumped on every change; also the ETag. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    InventoryMovement:
      type: object
      description: One line of a part's stock ledger.
      required: [id, movement_type, quantity_delta, reference_type, notes, performed_by, occurred_at]
      properties:
        id: { type: string, description: Opaque; the line's own number, not a UUID. }
        movement_type: { type: string, enum: [purchase, consumption, adjustment, transfer_in, transfer_out, return] }
        quantity_delta: { type: integer, description: 'Positive in, negative out.' }
        reference_type: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        performed_by: { type: [string, 'null'] }
        occurred_at: { type: string, format: date-time }

    AuditActor:
      description: Who made the change.
      oneOf:
        - type: object
          required: [type, id, full_name, email]
          properties:
            type: { const: user }
            id: { type: [string, 'null'], format: uuid }
            full_name: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
        - type: object
          description: A scheduled job.
          required: [type]
          properties:
            type: { const: system }
        - type: object
          description: "Not signed in: a failed or throttled login."
          required: [type]
          properties:
            type: { const: anonymous }

    AuditLog:
      type: object
      description: One row of the append-only audit trail (FMS-28).
      required: [id, occurred_at, action, result, actor, entity_type, entity_id, correlation_id, request_source, old_values, new_values, details]
      properties:
        id: { type: string, description: Opaque and unique per row; also a valid cursor (the page after this row). }
        occurred_at: { type: string, format: date-time }
        action: { type: string, example: UPDATE }
        result: { type: [string, 'null'], enum: [success, denied, failed, null], description: Null on rows written before FMS-27. }
        actor: { $ref: '#/components/schemas/AuditActor' }
        entity_type: { type: [string, 'null'], example: fleet.vehicles }
        entity_id: { type: [string, 'null'], format: uuid, description: "The entity's public id, when the row carries one." }
        correlation_id: { type: string, format: uuid, description: The X-Request-Id of the request that made the change. }
        request_source: { type: [object, 'null'], additionalProperties: true, description: 'channel, ip and user_agent (and actor and job for jobs).' }
        old_values: { type: [object, 'null'], additionalProperties: true, description: 'Row values before, without internal numeric ids; money stays in integer cents.' }
        new_values: { type: [object, 'null'], additionalProperties: true }
        details: { type: object, additionalProperties: true }

    HealthReport:
      type: object
      required: [status, checks, timestamp]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        checks:
          type: object
          description: Each dependency by name. A required one is ok or failed; an optional one is ok, degraded or disabled.
          additionalProperties: { type: string, enum: [ok, failed, degraded, disabled] }
        metrics:
          type: object
          description: Numbers for operators (counts and ages, never personal data), by group.
          additionalProperties:
            type: object
            additionalProperties: { type: number }
        timestamp: { type: string, format: date-time }

    TripStatus:
      type: string
      enum: [draft, scheduled, assigned, en_route, completed, cancelled]

    Trip:
      type: object
      required: [id, route_id, depot_id, vehicle_id, driver_id, status, scheduled_start, scheduled_end, stops, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        route_id: { type: [string, 'null'], format: uuid }
        route_name: { type: [string, 'null'] }
        depot_id: { type: [string, 'null'], format: uuid }
        vehicle_id: { type: [string, 'null'], format: uuid }
        driver_id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/TripStatus' }
        origin: { type: [string, 'null'] }
        destination: { type: [string, 'null'] }
        planned_distance_km: { type: [number, 'null'] }
        planned_duration_seconds: { type: [integer, 'null'] }
        scheduled_start: { type: [string, 'null'], format: date-time }
        scheduled_end: { type: [string, 'null'], format: date-time }
        actual_start: { type: [string, 'null'], format: date-time }
        actual_end: { type: [string, 'null'], format: date-time }
        actual_distance_km:
          type: [number, 'null']
          description: How far the trip went (FMS-145), measured when it ended and again while late positions arrived. Null until measured, or when no positions were stored during it.
        actual_distance_source:
          type: [string, 'null']
          enum: [odometer, gps, null]
          description: How the distance was measured, the vehicle's own odometer readings bracketing the trip or the length of its GPS track. Null with no distance, or with one entered before trips were measured (the seed, an import).
        stops:
          type: array
          items: { $ref: '#/components/schemas/TripStop' }
        eta:
          description: The latest arrival estimate while the trip is under way (FMS-86); null otherwise or before the first.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TripEta'
        exception:
          description: An assignment held for approval (FMS-151) while it waits, or once refused; null otherwise.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AssignmentException'
        cargo_weight_kg: { type: [number, 'null'], description: 'What it carries, kg (FMS-153); never above the assigned vehicle''s payload.' }
        cargo_kind: { $ref: '#/components/schemas/CargoKind' }
        job_load:
          type: string
          enum: [light, standard, heavy]
          description: What the job asks of its driver (FMS-153, docs/job-load.md), worked out on every read, never typed.
        job_load_reasons:
          type: array
          description: Why, biggest first; empty for a light job with nothing to count.
          items: { type: string, enum: [long_haul, regional, long_day, long_hours, many_stops, night, near_payload, loaded] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CargoKind:
      type: string
      enum: [general, fragile, hazardous, refrigerated, passengers]
      default: general
      description: What a trip carries (FMS-153). A trip with no cargo recorded is general.

    TripStop:
      type: object
      required: [id, sequence_number, name, status]
      properties:
        id: { type: string, format: uuid }
        sequence_number: { type: integer }
        name: { type: string }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        status:
          type: string
          enum: [planned, arrived, completed, skipped]
          description: arrived when GPS saw the vehicle there (FMS-86); completed when marked done (FMS-95).
        planned_arrival: { type: [string, 'null'], format: date-time }
        actual_arrival:
          type: [string, 'null']
          format: date-time
          description: >
            When the vehicle came within 150 m of the stop while the trip was under way (FMS-86), or, if GPS never
            saw it there, when the stop was marked done (FMS-95).
        eta:
          type: [string, 'null']
          format: date-time
          description: >
            Expected arrival from the vehicle's latest position (FMS-86); null once reached, for a stop
            without coordinates or behind the vehicle, or when the trip is not under way.
        completed_at: { type: [string, 'null'], format: date-time, description: When the stop was marked done (FMS-95). }

    TripLiveState:
      type: object
      description: Where a trip stands now (FMS-95). docs/trip-stops.md.
      required: [trip_id, status, vehicle_id, driver_id, position, next_stop, stops, eta, actual_start, scheduled_end, as_of]
      properties:
        trip_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TripStatus' }
        vehicle_id: { type: [string, 'null'], format: uuid }
        driver_id: { type: [string, 'null'], format: uuid }
        position:
          description: The vehicle's newest position while the trip is under way; null otherwise or before the first.
          oneOf:
            - type: 'null'
            - type: object
              required: [lat, lng, speed_kmh, heading, recorded_at, stale]
              properties:
                lat: { type: number }
                lng: { type: number }
                speed_kmh: { type: [number, 'null'] }
                heading: { type: [number, 'null'] }
                recorded_at: { type: string, format: date-time }
                stale: { type: boolean, description: No position for more than 2 minutes. }
        next_stop:
          description: The first stop not yet reached or done; null when none is left.
          oneOf:
            - type: 'null'
            - type: object
              required: [stop_id, sequence_number, name, eta]
              properties:
                stop_id: { type: string, format: uuid }
                sequence_number: { type: integer }
                name: { type: string }
                eta: { type: [string, 'null'], format: date-time }
        stops:
          type: object
          required: [total, reached, completed]
          properties:
            total: { type: integer }
            reached: { type: integer, description: Stops with an actual arrival (seen by GPS or marked done). }
            completed: { type: integer }
        eta:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TripEta'
        actual_start: { type: [string, 'null'], format: date-time }
        scheduled_end: { type: [string, 'null'], format: date-time }
        as_of: { type: string, format: date-time }

    TripEta:
      type: object
      description: >
        From the vehicle's newest position and the road ahead (routing engine), worked out at most every 30 seconds
        of position time per trip. docs/eta.md.
      required: [arrival_at, remaining_km, remaining_seconds, next_stop, position_at, updated_at]
      properties:
        arrival_at: { type: [string, 'null'], format: date-time, description: At the destination; null when the route has no destination coordinates. }
        remaining_km: { type: [number, 'null'], description: Along the road through the stops ahead to the destination (or the last stop without one). }
        remaining_seconds: { type: [integer, 'null'] }
        next_stop:
          oneOf:
            - type: 'null'
            - type: object
              required: [stop_id, name, eta]
              properties:
                stop_id: { type: string, format: uuid }
                name: { type: string }
                eta: { type: string, format: date-time }
        position_at: { type: string, format: date-time, description: When the vehicle was at the position the estimate is from. }
        updated_at: { type: string, format: date-time }

    RouteOptimisation:
      type: object
      required: [route_id, version, changed, order, stops, original, optimised]
      properties:
        route_id: { type: string, format: uuid }
        version: { type: integer, description: The route version the order was worked out for. }
        changed: { type: boolean, description: False when the saved order is already the shortest found. }
        order:
          type: array
          description: 0-based indexes of the saved stops, in the suggested order.
          items: { type: integer, minimum: 0 }
        stops:
          type: array
          description: The stops in the suggested order.
          items:
            type: object
            required: [name, latitude, longitude]
            properties:
              name: { type: string }
              latitude: { type: [number, 'null'] }
              longitude: { type: [number, 'null'] }
        original: { $ref: '#/components/schemas/RoadLength' }
        optimised: { $ref: '#/components/schemas/RoadLength' }

    RoadLength:
      type: object
      description: Along the road from origin through the stops to destination, in one order.
      required: [distance_km, duration_seconds]
      properties:
        distance_km: { type: number }
        duration_seconds: { type: integer }

    AssignmentWarning:
      oneOf:
        - type: object
          description: A trip of the driver or vehicle still under way runs into this one (FMS-31 overrun rule).
          required: [warning, field, trip_id, expected_end]
          properties:
            warning: { const: PREVIOUS_TRIP_OVERRUN }
            field: { type: string, enum: [driver_id, vehicle_id] }
            trip_id: { type: string, format: uuid }
            expected_end: { type: string, format: date-time }
        - type: object
          description: The driver is marked absent, on leave or sick on the trip's first day (Addis Ababa).
          required: [warning, field, attendance]
          properties:
            warning: { const: DRIVER_ATTENDANCE }
            field: { const: driver_id }
            attendance: { type: string, enum: [absent, on_leave, sick] }

    AssignmentException:
      type: object
      description: An assignment held for a fleet manager's approval (FMS-151, docs/assignment-exceptions.md).
      required: [id, trip_id, status, driver_id, vehicle_id, warnings, reason, requested_by, requested_by_name, requested_at, decided_by, decided_by_name, decided_at, decision_reason]
      properties:
        id: { type: string, format: uuid }
        trip_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, refused, withdrawn] }
        driver_id: { type: string, format: uuid, description: The driver asked for. }
        vehicle_id: { type: string, format: uuid, description: The vehicle asked for. }
        warnings:
          type: array
          description: The warnings held, the ones an approval covers.
          items: { $ref: '#/components/schemas/AssignmentWarning' }
        reason: { type: string, description: Why the dispatcher asks. }
        requested_by: { type: [string, 'null'], format: uuid }
        requested_by_name: { type: [string, 'null'] }
        requested_at: { type: string, format: date-time }
        decided_by: { type: [string, 'null'], format: uuid }
        decided_by_name: { type: [string, 'null'] }
        decided_at: { type: [string, 'null'], format: date-time }
        decision_reason: { type: [string, 'null'], description: Why it was refused, or the approval's note. }

    VehicleStatusValue:
      type: string
      description: inactive is out of service; maintenance is in the workshop; retired is final.
      enum: [active, inactive, maintenance, retired]

    AvailabilityResult:
      type: object
      required: [availability, reasons]
      properties:
        availability: { type: string, enum: [available, unavailable, available_with_warning] }
        reasons:
          type: array
          items:
            type: object
            required: [code, severity]
            properties:
              code:
                type: string
                enum:
                  - vehicle_retired
                  - vehicle_in_maintenance
                  - vehicle_out_of_service
                  - maintenance_flag
                  - vehicle_other_depot
                  - driver_retired
                  - account_not_active
                  - license_expired
                  - driver_other_depot
                  - driver_absent
                  - driver_on_leave
                  - driver_sick
                  - distance_limit
                  - distance_limit_near
                  - assigned_to_overlapping_trip
              severity: { type: string, enum: [block, warning] }
              trip_id: { type: string, format: uuid }
              period: { type: string, enum: [day, week], description: 'FMS-156, distance_limit and distance_limit_near: the period.' }
              limit_km: { type: number, description: 'FMS-156: its limit.' }
              total_km: { type: number, description: "FMS-156: the driver's load-weighted km in it with the trip." }

    Assignment:
      type: object
      required: [trip_id, status, start, end]
      properties:
        trip_id: { type: string, format: uuid }
        status: { type: string, enum: [assigned, en_route] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }

    VehicleStatus:
      type: object
      required: [vehicle_id, registration_number, depot_id, status, maintenance, availability, current_assignment, next_assignment, last_status_change, version, updated_at]
      properties:
        vehicle_id: { type: string, format: uuid }
        registration_number: { type: string }
        depot_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/VehicleStatusValue' }
        maintenance:
          type: object
          required: [flagged, in_workshop, open_record_id]
          properties:
            flagged: { type: boolean }
            in_workshop: { type: boolean }
            open_record_id: { type: [string, 'null'], format: uuid }
        availability:
          allOf:
            - $ref: '#/components/schemas/AvailabilityResult'
            - type: object
              required: [window]
              properties:
                window:
                  type: object
                  required: [start, end]
                  properties:
                    start: { type: string, format: date-time }
                    end: { type: string, format: date-time }
        current_assignment:
          oneOf:
            - $ref: '#/components/schemas/Assignment'
            - type: 'null'
        next_assignment:
          oneOf:
            - $ref: '#/components/schemas/Assignment'
            - type: 'null'
        last_status_change:
          oneOf:
            - type: 'null'
            - type: object
              required: [from_status, to_status, reason, source, maintenance_record_id, changed_at, changed_by]
              properties:
                from_status: { $ref: '#/components/schemas/VehicleStatusValue' }
                to_status: { $ref: '#/components/schemas/VehicleStatusValue' }
                reason: { type: [string, 'null'] }
                source: { type: string, enum: [manual, maintenance] }
                maintenance_record_id: { type: [string, 'null'], format: uuid }
                changed_at: { type: string, format: date-time }
                changed_by: { type: [string, 'null'], format: uuid }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    BoardTrip:
      oneOf:
        - type: 'null'
        - type: object
          description: The trip under way now.
          required: [trip_id, end]
          properties:
            trip_id: { type: string, format: uuid }
            end: { type: string, format: date-time, description: Its scheduled end. }

    DispatchBoard:
      type: object
      required: [depot_id, window, trip_risk, drivers, vehicles]
      properties:
        depot_id: { type: string, format: uuid }
        window:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        trip_risk:
          description: With exclude_trip_id and tracking:read (FMS-155, docs/ml-trip-risk.md), whether the drivers carry the trip risk model's chances, and why not; null otherwise.
          oneOf:
            - type: 'null'
            - { $ref: '#/components/schemas/BoardTripRisk' }
        drivers:
          type: array
          items:
            type: object
            required: [driver_id, full_name, license_categories, vehicle_types, state, attendance, availability, current_trip, trip_risk, distance]
            properties:
              driver_id: { type: string, format: uuid }
              full_name: { type: string }
              license_categories: { type: array, items: { type: string } }
              vehicle_types: { type: array, items: { type: string }, description: The vehicle types the licence covers. }
              state:
                type: string
                description: idle green, near_end amber, en_route red, absent grey (still assignable), unavailable (blocked for the window).
                enum: [idle, near_end, en_route, absent, unavailable]
              attendance: { type: [string, 'null'], enum: [present, absent, late, on_leave, sick, other, null] }
              availability: { $ref: '#/components/schemas/AvailabilityResult' }
              current_trip: { $ref: '#/components/schemas/BoardTrip' }
              trip_risk:
                description: The trip risk model's chances on the trip being staffed (FMS-155), for a driver free for it, once a model is active; null otherwise. Advice, never a block.
                oneOf:
                  - type: 'null'
                  - { $ref: '#/components/schemas/DriverTripRisk' }
              distance:
                description: With exclude_trip_id (FMS-156, docs/driving-distance-limits.md), the driver's load-weighted km in the trip's day and week with it; null otherwise.
                oneOf:
                  - type: 'null'
                  - { $ref: '#/components/schemas/BoardDistance' }
        vehicles:
          type: array
          items:
            type: object
            required: [vehicle_id, registration_number, make, model, vehicle_type, status, state, availability, open_work, current_trip]
            properties:
              vehicle_id: { type: string, format: uuid }
              registration_number: { type: string }
              make: { type: string }
              model: { type: string }
              vehicle_type: { type: string }
              status: { $ref: '#/components/schemas/VehicleStatusValue' }
              state:
                type: string
                description: idle green, flagged red (flag or workshop), en_route grey, unavailable (blocked for the window).
                enum: [idle, flagged, en_route, unavailable]
              availability: { $ref: '#/components/schemas/AvailabilityResult' }
              open_work:
                oneOf:
                  - type: 'null'
                  - type: object
                    description: The open maintenance record behind the flag.
                    required: [id, description, status, priority, opened_at]
                    properties:
                      id: { type: string, format: uuid }
                      description: { type: string }
                      status: { type: string }
                      priority: { type: string }
                      opened_at: { type: string, format: date-time }
              service_due:
                description: Preventive service due or overdue (FMS-129); a warning, never a block.
                oneOf:
                  - type: 'null'
                  - $ref: '#/components/schemas/ServiceDueSummary'
              current_trip: { $ref: '#/components/schemas/BoardTrip' }

    StatusChangeWarning:
      type: object
      description: A trip already assigned to a vehicle taken off the road; it needs another vehicle.
      required: [warning, trip_id, start]
      properties:
        warning: { const: ASSIGNED_TRIP_AFFECTED }
        trip_id: { type: string, format: uuid }
        start: { type: string, format: date-time }

    SyncLog:
      type: object
      required: [id, provider_id, direction, status, trigger, kind, records, external_reference, request_id, started_at, completed_at, error_message]
      properties:
        id: { type: string, format: uuid }
        provider_id: { type: [string, 'null'], format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        status: { type: string, enum: [started, succeeded, failed, partial] }
        trigger: { type: [string, 'null'], enum: [manual, webhook, null] }
        kind: { type: [string, 'null'], description: "A webhook's kind (position, transaction)." }
        records: { type: [integer, 'null'], description: What a sync brought in. }
        external_reference: { type: [string, 'null'], description: "A webhook's event id, a sync's batch." }
        request_id: { type: [string, 'null'] }
        started_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        error_message: { type: [string, 'null'], description: "Our words for the failure (a status, a timeout), never the provider's response." }

    Provider:
      type: object
      required: [id, code, name, provider_type, is_active, status, capabilities, webhook_secret_configured, last_success_at, last_failure_at, last_error, last_sync, last_delivery_at, today, devices, circuit, health]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        provider_type: { type: string, enum: [telematics, notification, mapping, traffic, weather, ev_charging, fuel_card, other] }
        is_active: { type: boolean }
        status:
          type: string
          enum: [operational, degraded, down, unknown, inactive]
          description: >
            down while the circuit is open; degraded while half-open, after a failed health check, or when the last
            failure is newer than the last success.
        capabilities:
          type: object
          required: [sync, webhooks, health_check]
          properties:
            sync: { type: boolean }
            webhooks: { type: boolean }
            health_check: { type: boolean }
        webhook_secret_configured: { type: boolean }
        last_success_at: { type: [string, 'null'], format: date-time }
        last_failure_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
        last_sync:
          oneOf:
            - $ref: '#/components/schemas/SyncLog'
            - type: 'null'
        last_delivery_at: { type: [string, 'null'], format: date-time, description: When its last webhook delivery was stored (FMS-138). }
        today:
          type: object
          description: >
            Webhook traffic since midnight in Addis Ababa (FMS-138): deliveries stored and refused (a bad signature,
            a replay, a body it cannot read), and the positions in stored deliveries that became pings (or were
            already stored) and that were refused (an unlinked device, too old, in the future, imprecise).
          required: [deliveries, deliveries_rejected, positions_accepted, positions_rejected]
          properties:
            deliveries: { type: integer }
            deliveries_rejected: { type: integer }
            positions_accepted: { type: integer }
            positions_rejected: { type: integer }
        devices:
          description: A telematics provider's active devices and the unlinked device ids it has sent; null for other types.
          oneOf:
            - type: 'null'
            - type: object
              required: [linked, unknown]
              properties:
                linked: { type: integer }
                unknown: { type: integer }
        circuit:
          description: >
            This API instance's breaker; null until the instance has called the provider, so always null for a provider
            that only sends webhooks.
          oneOf:
            - type: 'null'
            - type: object
              required: [state, opened_at, retry_at, window, latency_mean_ms]
              properties:
                state: { type: string, enum: [closed, open, half_open] }
                opened_at: { type: [string, 'null'], format: date-time }
                retry_at: { type: [string, 'null'], format: date-time }
                window:
                  type: object
                  description: Counts over the last 60 s.
                  properties:
                    calls: { type: integer }
                    successes: { type: integer }
                    failures: { type: integer }
                    timeouts: { type: integer }
                    rejected: { type: integer }
                latency_mean_ms: { type: integer }
        health:
          oneOf:
            - type: 'null'
            - type: object
              required: [checked_at, healthy, error]
              properties:
                checked_at: { type: string, format: date-time }
                healthy: { type: boolean }
                error: { type: [string, 'null'] }

    GpsDevice:
      type: object
      description: A GPS device in the registry (FMS-138). Never its token or the token's hash.
      required: [id, device_identifier, device_model, provider, credential, vehicle, status, installed_at, removed_at, last_seen_at, last_error]
      properties:
        id: { type: string, format: uuid }
        device_identifier: { type: string }
        device_model: { type: [string, 'null'] }
        provider:
          description: The telematics provider whose webhooks name it; null for a device with its own token.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, code, name]
              properties:
                id: { type: string, format: uuid }
                code: { type: string }
                name: { type: string }
        credential: { type: string, enum: [provider, token], description: 'How it reports: its provider''s signed webhooks, or its own token.' }
        vehicle:
          type: object
          required: [id, registration_number]
          properties:
            id: { type: string, format: uuid }
            registration_number: { type: string }
        status: { type: string, enum: [active, inactive, faulty, removed] }
        installed_at: { type: [string, 'null'], format: date-time }
        removed_at: { type: [string, 'null'], format: date-time }
        last_seen_at: { type: [string, 'null'], format: date-time }
        last_error:
          description: Why its last refused position was refused (too_old, future_timestamp, low_accuracy, vehicle_retired), and when.
          oneOf:
            - type: 'null'
            - type: object
              required: [reason, at]
              properties:
                reason: { type: string }
                at: { type: string, format: date-time }

    UnknownGpsDevice:
      type: object
      required: [provider, device_identifier, first_seen_at, last_seen_at, positions]
      properties:
        provider:
          type: object
          required: [id, code, name]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
        device_identifier: { type: string }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        positions: { type: integer, description: Positions refused for it so far. }

    GpsPoint:
      type: object
      required: [recorded_at, lat, lng, speed_kmh]
      additionalProperties: false
      properties:
        vehicle_id: { type: string, format: uuid, description: Required from a user with tracking:ingest; a device's and a phone's is implied. }
        recorded_at: { type: string, format: date-time, description: With an offset. Not over 2 minutes ahead, not over 7 days old. }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        speed_kmh: { type: number, minimum: 0, maximum: 300, description: Stored as whole km/h, rounded to the nearest. }
        heading: { type: [number, 'null'], minimum: 0, maximum: 360 }
        accuracy_m: { type: [number, 'null'], minimum: 0, description: Over 500 is refused (low_accuracy). }
        altitude_m: { type: [number, 'null'] }
        ignition_on: { type: [boolean, 'null'] }
        odometer_km: { type: [number, 'null'], minimum: 0 }

    TelemetryFlag:
      type: object
      description: A flag of the telemetry rules (FMS-46) or of the geofence and route deviation rules (FMS-90).
      required: [flag_id, vehicle_id, trip_id, flag_type, geofence, severity, status, observed_at, resolved_at, details]
      properties:
        flag_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        trip_id: { type: [string, 'null'], format: uuid, description: The trip the pings were stored with. }
        flag_type: { type: string, enum: [speeding, idling, fuel_variance, route_deviation, geofence_violation, harsh_braking, other] }
        geofence:
          type: [object, 'null']
          description: The fence a geofence_violation is about; null for other flags.
          required: [geofence_id, name]
          properties:
            geofence_id: { type: string, format: uuid }
            name: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        status: { type: string, enum: [open, reviewed, dismissed, resolved], description: The review status; the rules never change it. }
        observed_at: { type: string, format: date-time, description: When the condition began. }
        resolved_at: { type: [string, 'null'], format: date-time, description: When it ended; null while it lasts. }
        details:
          type: object
          description: >
            speed_limit_kmh, speed_kmh and consecutive_pings (speeding) or idle_minutes (idling); kind and
            geofence_name (geofence_violation); distance_m, route_deviation_m and consecutive_pings (route_deviation);
            lat, lng and flagged_at (the ping that crossed the threshold). On closing: end_reason (cleared, moving,
            engine_off, signal_lost; trip_started, trip_ended, geofence_changed, geofence_removed), duration_seconds
            and, for speeding, max_speed_kmh, for route deviation max_distance_m.
          additionalProperties: true

    RoadLine:
      type: object
      description: A GeoJSON LineString, [longitude, latitude] pairs at 5 decimals (FMS-84).
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [LineString] }
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
    TrackPoint:
      type: object
      description: A stored position of a vehicle (FMS-136), as GET /vehicles/{vehicle_id}/tracking returns it.
      required: [recorded_at, lat, lng, speed_kmh, heading, altitude_m, accuracy_m, ignition_on, odometer_km, source, trip_id]
      properties:
        recorded_at: { type: string, format: date-time }
        lat: { type: number }
        lng: { type: number }
        speed_kmh: { type: integer, minimum: 0 }
        heading: { type: [number, 'null'], description: Degrees from north, 0-360. }
        altitude_m: { type: [number, 'null'] }
        accuracy_m: { type: [number, 'null'] }
        ignition_on: { type: [boolean, 'null'], description: Null when the reporter cannot tell (a phone). }
        odometer_km: { type: [number, 'null'] }
        source: { type: string, enum: [device, phone, api, telematics], description: Who reported it. }
        trip_id: { type: [string, 'null'], format: uuid, description: The trip the vehicle was on, if any. }

    VehicleLocation:
      type: object
      required: [vehicle_id, registration_number, vehicle_type, vehicle_status, maintenance_flag, depot_id, position, trip, flags]
      properties:
        vehicle_id: { type: string, format: uuid }
        registration_number: { type: string }
        vehicle_type: { type: string }
        vehicle_status: { type: string, enum: [active, inactive, maintenance] }
        maintenance_flag: { type: boolean }
        depot_id: { type: [string, 'null'], format: uuid }
        position:
          description: The newest position; null for a vehicle on a trip that has not reported yet.
          oneOf:
            - type: 'null'
            - type: object
              required: [lat, lng, speed_kmh, heading, accuracy_m, ignition_on, recorded_at, stopped_since]
              properties:
                lat: { type: number }
                lng: { type: number }
                speed_kmh: { type: integer }
                heading: { type: [number, 'null'] }
                accuracy_m: { type: [number, 'null'] }
                ignition_on: { type: [boolean, 'null'] }
                recorded_at: { type: string, format: date-time }
                stopped_since:
                  type: [string, 'null']
                  format: date-time
                  description: At 0 km/h, the first stopped ping after it last moved (looked back at most 2 hours).
        trip:
          description: The trip under way, or null.
          oneOf:
            - type: 'null'
            - type: object
              required: [trip_id, route_name, origin, destination, started_at, scheduled_end, driver]
              properties:
                trip_id: { type: string, format: uuid }
                route_name: { type: [string, 'null'] }
                origin: { type: [string, 'null'] }
                destination: { type: [string, 'null'] }
                started_at: { type: [string, 'null'], format: date-time }
                scheduled_end: { type: [string, 'null'], format: date-time }
                driver:
                  oneOf:
                    - type: 'null'
                    - type: object
                      required: [driver_id, full_name]
                      properties:
                        driver_id: { type: string, format: uuid }
                        full_name: { type: [string, 'null'] }
                eta:
                  description: The trip's latest arrival estimate (FMS-86); null before the first.
                  oneOf:
                    - type: 'null'
                    - type: object
                      required: [arrival_at, remaining_km, next_stop, updated_at]
                      properties:
                        arrival_at: { type: [string, 'null'], format: date-time }
                        remaining_km: { type: [number, 'null'] }
                        next_stop:
                          oneOf:
                            - type: 'null'
                            - type: object
                              required: [name, eta]
                              properties:
                                name: { type: string }
                                eta: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
        flags:
          description: Open, unresolved telemetry flags (FMS-46), the newest of each type.
          type: array
          items:
            type: object
            required: [flag_type, severity, observed_at]
            properties:
              flag_type: { type: string, enum: [speeding, idling, fuel_variance, route_deviation, geofence_violation, harsh_braking, other] }
              severity: { type: string, enum: [low, medium, high, critical] }
              observed_at: { type: string, format: date-time }

    Notification:
      type: object
      required: [id, type, title, message, alert_id, entity, vehicle_id, driver_id, read, read_at, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, description: "What kind: alert, alert_escalated, or alert_personal (a driver's own notice: their licence expiring, their next vehicle's service; FMS-149)." }
        title: { type: string }
        message: { type: string }
        alert_id: { type: [string, 'null'], format: uuid, description: The alert it is about, if any. }
        entity:
          type: [object, 'null']
          description: What the alert is about, so a screen can link to it.
          required: [type, id]
          properties:
            type: { type: string, description: 'e.g. dvir_report, document, driver, fuel_anomaly, telemetry_flag, incident, vehicle.' }
            id: { type: string, format: uuid }
        vehicle_id: { type: [string, 'null'], format: uuid, description: The vehicle the alert concerns, if any. }
        driver_id: { type: [string, 'null'], format: uuid, description: The driver the alert concerns, if any. }
        read: { type: boolean }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time, description: When it reached the inbox. }

    AlertDelivery:
      type: object
      required: [id, channel, status, type, recipient, attempts, provider, provider_message_id, queued_at, sent_at, failed_at, next_attempt_at, failure_reason, read_at]
      properties:
        id: { type: string, format: uuid }
        channel: { type: string, enum: [in_app, email, sms, push] }
        status: { type: string, enum: [queued, sent, delivered, failed, cancelled] }
        type: { type: string, description: 'alert, alert_escalated or alert_personal (FMS-149).' }
        recipient:
          type: object
          required: [id, name]
          properties:
            id: { type: [string, 'null'], format: uuid }
            name: { type: [string, 'null'] }
        attempts: { type: integer, minimum: 0, maximum: 5 }
        provider: { type: [string, 'null'], description: The code of the provider that took (or last tried) it. }
        provider_message_id: { type: [string, 'null'] }
        queued_at: { type: string, format: date-time }
        sent_at: { type: [string, 'null'], format: date-time }
        failed_at: { type: [string, 'null'], format: date-time }
        next_attempt_at: { type: [string, 'null'], format: date-time, description: While queued, when it is next due. }
        failure_reason: { type: [string, 'null'], description: 'The last failure in our words, e.g. "POST /messages answered 503."; why it was cancelled.' }
        read_at: { type: [string, 'null'], format: date-time, description: in_app only. }

    NotificationChannels:
      type: object
      required: [rules, email, sms, push]
      properties:
        rules:
          type: array
          description: By severity, most severe first; in_app always, the others only while they are on.
          items:
            type: object
            required: [severity, channels]
            properties:
              severity: { type: string, enum: [critical, high, medium, low] }
              channels:
                type: array
                items: { type: string, enum: [in_app, email, sms, push] }
        email:
          type: object
          required: [available, address]
          properties:
            available: { type: boolean }
            address: { type: string }
        sms:
          type: object
          required: [available, phone]
          properties:
            available: { type: boolean }
            phone: { type: [string, 'null'] }
        push:
          type: object
          required: [available, public_key, devices, device_keys]
          properties:
            available: { type: boolean }
            public_key: { type: [string, 'null'], description: The VAPID public key to subscribe with (applicationServerKey). }
            devices: { type: integer, minimum: 0, description: The caller's browsers with push on. }
            device_keys:
              type: array
              description: "Each one's endpoint fingerprint: the first 22 characters of base64url(SHA-256(endpoint)), so a browser can tell whether its own subscription is the caller's."
              items: { type: string }

    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, maxLength: 2048, description: 'An https address of a browser push service.' }
        expirationTime: { type: [number, 'null'], description: Ignored. }
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, minLength: 80, maxLength: 100, description: base64url P-256 public key. }
            auth: { type: string, minLength: 16, maxLength: 32, description: base64url auth secret. }

    Alert:
      type: object
      required: [id, type, severity, priority, status, title, message, depot_id, vehicle_id, driver_id, trip_id, entity_type, entity_id, source,
                 occurrence_count, last_occurred_at, escalation_level, escalated_at, created_at, acknowledged_at, acknowledged_by, resolved_at, resolved_by]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, description: 'vehicle_fault, document_expiring, licence_expiring, fuel_anomaly, unsafe_driving, geofence_violation, maintenance_risk, battery, incident.' }
        severity: { type: string, enum: [low, medium, high, critical] }
        priority: { type: integer, minimum: 1, maximum: 4, description: 1 is critical, 4 is low. }
        status: { type: string, enum: [open, acknowledged, resolved, dismissed] }
        title: { type: string }
        message: { type: [string, 'null'] }
        depot_id: { type: [string, 'null'], format: uuid }
        vehicle_id: { type: [string, 'null'], format: uuid }
        driver_id: { type: [string, 'null'], format: uuid }
        trip_id: { type: [string, 'null'], format: uuid }
        entity_type: { type: [string, 'null'], description: What it is about, e.g. dvir_report, document, driver. }
        entity_id: { type: [string, 'null'], format: uuid }
        source:
          type: object
          required: [module, event_type]
          properties:
            module: { type: string }
            event_type: { type: [string, 'null'] }
        occurrence_count: { type: integer, minimum: 1, description: Repeats of its source within the rule's window. }
        last_occurred_at: { type: string, format: date-time }
        escalation_level: { type: integer, minimum: 0, description: 0 not escalated, 1 fleet managers told, 2 admins told. }
        escalated_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        acknowledged_at: { type: [string, 'null'], format: date-time }
        acknowledged_by: { type: [string, 'null'], format: uuid }
        resolved_at: { type: [string, 'null'], format: date-time }
        resolved_by: { type: [string, 'null'], format: uuid }

    FuelLog:
      type: object
      description: A fill-up (FMS-39). Volume in millilitres, money in cents.
      required: [id, vehicle_id, driver_id, trip_id, fuel_type, quantity_ml, unit_price_cents, total_cost_cents, odometer_km, station_name, latitude, longitude, source, recorded_at, created_at]
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        driver_id: { type: [string, 'null'], format: uuid }
        trip_id: { type: [string, 'null'], format: uuid }
        fuel_type: { type: string, enum: [petrol, diesel, hybrid, electric, cng, lpg, other] }
        quantity_ml: { type: integer }
        unit_price_cents: { type: [integer, 'null'] }
        total_cost_cents: { type: integer }
        odometer_km: { type: [number, 'null'] }
        station_name: { type: [string, 'null'] }
        latitude: { type: [number, 'null'], description: Where it was recorded (FMS-82); null when not sent. }
        longitude: { type: [number, 'null'] }
        source: { type: string, enum: [pump, fuel_card, bulk, manual] }
        recorded_at: { type: string, format: date-time, description: When the fill-up happened (fueled_at, else receipt). }
        created_at: { type: string, format: date-time, description: When the server received it. }

    AttendanceCode:
      type: object
      description: The depot's check-in code now (FMS-141).
      required: [depot_id, depot_name, work_starts_at, late_after_minutes, code, generated_at, issued_at, refresh_at, expires_at]
      properties:
        depot_id: { type: string, format: uuid }
        depot_name: { type: string }
        work_starts_at: { type: string, description: 'HH:MM, Addis Ababa.' }
        late_after_minutes: { type: integer }
        code: { type: string, description: 'FMSA1.<depot id>.<window>.<signature>: what the QR holds.' }
        generated_at: { type: string, format: date-time, description: The server's clock when it answered. }
        issued_at: { type: string, format: date-time, description: When this code's 30-second window began. }
        refresh_at: { type: string, format: date-time, description: When the next code is out. }
        expires_at: { type: string, format: date-time, description: The last moment a scan of it is accepted. }
    Attendance:
      type: object
      description: One driver's record for one day (FMS-21), with check-in and check-out (FMS-141).
      required: [id, driver_id, date, status, notes, check_in_at, check_in_method, check_out_at, check_out_method, logged_by, logged_by_name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        date: { type: string, format: date, description: The calendar day in Addis Ababa. }
        status: { type: string, enum: [present, absent, on_leave, late, sick, other] }
        notes: { type: [string, 'null'] }
        check_in_at: { type: [string, 'null'], format: date-time }
        check_in_method: { type: [string, 'null'], enum: [qr, manual, null], description: 'qr: scanned at the depot; manual: entered by staff.' }
        check_out_at: { type: [string, 'null'], format: date-time }
        check_out_method: { type: [string, 'null'], enum: [qr, manual, null] }
        logged_by: { type: string, format: uuid, description: Whoever recorded it last. }
        logged_by_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AnalyticsMeta:
      type: object
      required: [request_id, from, to, days, computed_at, stale, data_freshness]
      properties:
        request_id: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: integer }
        computed_at: { type: [string, 'null'], format: date-time, description: "The cache's last refresh." }
        stale: { type: boolean, description: 'True when the last refresh is more than 25 hours old, or the cache was never filled.' }
        data_freshness: { $ref: '#/components/schemas/DataFreshness' }
    Report:
      type: object
      description: A monthly report (FMS-91) as a table. Each row has a value for every column's key.
      required: [report, title, month, period, depot, columns, rows, totals, generated_at]
      properties:
        report: { type: string, enum: [fuel, maintenance, cost, trips, drivers] }
        title: { type: string }
        month: { type: string, description: YYYY-MM. }
        period:
          type: object
          description: The month as instants, from inclusive, to exclusive; up to now for the current month.
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        depot:
          description: The depot chosen; null for every depot in the caller's scope.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name, code]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                code: { type: string }
        columns:
          type: array
          items:
            type: object
            required: [key, label, kind]
            properties:
              key: { type: string }
              label: { type: string }
              kind:
                type: string
                enum: [text, count, litres, etb, km, l_per_100km, pct, hours, datetime]
                description: >
                  How the values are kept: litres in ml, etb in cents, km in metres, l_per_100km in ml per km, hours in
                  minutes, pct a whole percentage, datetime an ISO instant.
        rows:
          type: array
          items: { type: object, additionalProperties: { type: [string, number, 'null'] } }
        totals:
          description: Sums and overall ratios; null when there are no rows.
          oneOf:
            - type: 'null'
            - { type: object, additionalProperties: { type: [string, number, 'null'] } }
        generated_at: { type: string, format: date-time }

    DriverScoreWeights:
      type: object
      description: How much each part counts in the driver performance score (FMS-146); the score divides by their sum.
      required: [punctuality, safety, incidents, dvir]
      properties:
        punctuality: { type: integer, minimum: 0, maximum: 100 }
        safety: { type: integer, minimum: 0, maximum: 100 }
        incidents: { type: integer, minimum: 0, maximum: 100 }
        dvir: { type: integer, minimum: 0, maximum: 100 }

    DataFreshness:
      type: object
      description: Which database answered a reporting read, and how far behind the primary it was (FMS-94, docs/read-replica.md).
      required: [source, lag_seconds, as_of]
      properties:
        source: { type: string, enum: [replica, primary], description: The primary when the replica is not configured, down, or too far behind. }
        lag_seconds: { type: integer, minimum: 0, description: How far the data may be behind the primary; 0 from the primary. }
        as_of: { type: string, format: date-time, description: The data is at least this current. }

    FuelReconciliation:
      type: object
      description: One vehicle's period (FMS-41). Integers; distance in km to 3 decimals.
      required: [vehicle_id, registration_number, depot_id, depot_name, fuel_type, fuel_efficiency_ml_per_km, distance_km, trips, fuel_logs, expected_ml, actual_ml, variance_ml, variance_pct, total_cost_cents, status, reason, anomaly_id]
      properties:
        vehicle_id: { type: string, format: uuid }
        registration_number: { type: string, description: Named here; a finance clerk may not read vehicles (FMS-42). }
        depot_id: { type: string, format: uuid }
        depot_name: { type: string }
        fuel_type: { type: string, enum: [petrol, diesel, hybrid, electric, cng, lpg, other] }
        fuel_efficiency_ml_per_km: { type: [integer, 'null'], description: The vehicle's rating. }
        distance_km: { type: number, description: Completed trips' actual distance, actual_end in the period. }
        trips: { type: integer }
        fuel_logs: { type: integer }
        expected_ml: { type: [integer, 'null'], description: 'distance x rating; null when not judged.' }
        actual_ml: { type: integer, description: Fuel logged, recorded_at in the period. }
        variance_ml: { type: [integer, 'null'] }
        variance_pct: { type: [integer, 'null'], description: '(actual - expected) / expected, whole percent.' }
        total_cost_cents: { type: integer }
        status: { type: string, enum: [above, below, within, not_judged] }
        reason: { type: [string, 'null'], enum: [electric, no_efficiency, too_little_distance, null], description: Why not judged. }
        anomaly_id: { type: [string, 'null'], format: uuid, description: The anomaly the monthly job raised for exactly this period. }

    DataExport:
      type: object
      description: A person's own data (FMS-104). Ids are public; nothing internal or secret.
      required: [generated_at, account, driver, trips, fuel_logs, incident_reports, location_history]
      properties:
        generated_at: { type: string, format: date-time }
        account:
          type: object
          required: [id, email, full_name, phone, status, roles, last_login_at, created_at]
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            full_name: { type: string }
            phone: { type: [string, 'null'] }
            status: { type: string }
            roles: { type: array, items: { type: string } }
            last_login_at: { type: [string, 'null'], format: date-time }
            created_at: { type: string, format: date-time }
        driver:
          type: [object, 'null']
          description: The driver record with `vehicle_assignments`, `attendance` and `inspections`; null for someone who is not a driver.
          additionalProperties: true
          properties:
            id: { type: string, format: uuid }
            license_number: { type: string }
            license_expiry: { type: string }
            license_categories: { type: array, items: { type: string } }
            hire_date: { type: [string, 'null'] }
            emergency_phone: { type: [string, 'null'] }
            vehicle_assignments: { type: array, items: { type: object, additionalProperties: true } }
            attendance: { type: array, items: { type: object, additionalProperties: true } }
            inspections: { type: array, items: { type: object, additionalProperties: true } }
        trips: { type: array, items: { type: object, additionalProperties: true } }
        fuel_logs: { type: array, items: { type: object, additionalProperties: true } }
        incident_reports: { type: array, items: { type: object, additionalProperties: true } }
        location_history:
          type: object
          required: [retention_days, truncated, points]
          properties:
            retention_days: { type: integer, description: How far back GPS history is kept. }
            truncated: { type: boolean, description: True when there were more than 50,000 points and the oldest were left out. }
            points:
              type: array
              items:
                type: object
                required: [trip_id, recorded_at, lat, lng, speed_kmh]
                properties:
                  trip_id: { type: [string, 'null'], format: uuid }
                  recorded_at: { type: string, format: date-time }
                  lat: { type: number }
                  lng: { type: number }
                  speed_kmh: { type: integer }

    FuelAnomaly:
      type: object
      description: A derived finding about a vehicle's fuel (FMS-41 reconciliation, FMS-82 per fill-up). Integers; distance in km.
      required: [id, vehicle_id, registration_number, depot_id, depot_name, fuel_log_id, anomaly_type, severity, status, period_from, period_to, distance_km, expected_ml, actual_ml, deviation_pct, details, detected_at, reviewed_by, reviewed_by_name, reviewed_at, notes]
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        registration_number: { type: string }
        depot_id: { type: string, format: uuid }
        depot_name: { type: string }
        fuel_log_id: { type: [string, 'null'], format: uuid, description: The fill-up a per-event rule flagged; null for a month. }
        anomaly_type: { type: string, description: 'consumption_above_expected, consumption_below_expected, or a per-fill-up rule (FMS-82): tank_capacity_exceeded, refuel_interval_too_short, price_per_litre_out_of_range, fill_up_away_from_vehicle.' }
        severity: { type: string, enum: [low, medium, high, critical] }
        status: { type: string, enum: [open, reviewed, dismissed, resolved] }
        period_from: { type: [string, 'null'], format: date-time }
        period_to: { type: [string, 'null'], format: date-time, description: Exclusive. }
        distance_km: { type: [number, 'null'] }
        expected_ml: { type: [integer, 'null'] }
        actual_ml: { type: [integer, 'null'] }
        deviation_pct: { type: [integer, 'null'] }
        details: { type: [object, 'null'], additionalProperties: true, description: 'The figures a per-fill-up rule judged on (tank and fill, distance and fuel needed, price and band, distance from the vehicle); null for a month.' }
        detected_at: { type: string, format: date-time }
        reviewed_by: { type: [string, 'null'], format: uuid, description: Who closed it. }
        reviewed_by_name: { type: [string, 'null'] }
        reviewed_at: { type: [string, 'null'], format: date-time }
        notes: { type: [string, 'null'] }

    FuelSummary:
      type: object
      description: A vehicle's fuel over a period (FMS-41). Integers; distance in km to 3 decimals.
      required: [vehicle_id, from, to, fuel_logs, actual_ml, total_cost_cents, trips, distance_km, rated_efficiency_ml_per_km, actual_efficiency_ml_per_km, expected_ml, variance_ml, variance_pct, status, reason, cost_per_km_cents, average_price_cents_per_litre, open_anomalies, threshold_pct]
      properties:
        vehicle_id: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time, description: Exclusive. }
        fuel_logs: { type: integer }
        actual_ml: { type: integer }
        total_cost_cents: { type: integer }
        trips: { type: integer }
        distance_km: { type: number }
        rated_efficiency_ml_per_km: { type: [integer, 'null'] }
        actual_efficiency_ml_per_km: { type: [integer, 'null'], description: ml logged per km driven; null without distance. }
        expected_ml: { type: [integer, 'null'] }
        variance_ml: { type: [integer, 'null'] }
        variance_pct: { type: [integer, 'null'] }
        status: { type: string, enum: [above, below, within, not_judged] }
        reason: { type: [string, 'null'], enum: [electric, no_efficiency, too_little_distance, null] }
        cost_per_km_cents: { type: [integer, 'null'] }
        average_price_cents_per_litre: { type: [integer, 'null'] }
        open_anomalies: { type: integer }
        threshold_pct: { type: integer }

    Incident:
      type: object
      required: [id, incident_type, severity, status, description, vehicle_id, driver_id, trip_id, depot_id, reported_by, latitude, longitude, occurred_at, created_at, assigned_to, notes, resolved_at, resolved_by, updated_at]
      properties:
        id: { type: string, format: uuid }
        incident_type: { type: string, description: 'accident, breakdown, tyre, theft, vandalism, injury, road_hazard, other.' }
        severity: { type: string, enum: [low, medium, high, critical] }
        status: { type: string, enum: [open, investigating, resolved, closed] }
        description: { type: string }
        vehicle_id: { type: [string, 'null'], format: uuid }
        driver_id: { type: [string, 'null'], format: uuid }
        trip_id: { type: [string, 'null'], format: uuid }
        depot_id: { type: [string, 'null'], format: uuid, description: "The vehicle's depot, or the reporter's." }
        reported_by: { type: string, format: uuid, description: The user who reported it. }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        assigned_to:
          description: Who is dealing with it (FMS-89).
          oneOf:
            - type: 'null'
            - type: object
              required: [id, full_name]
              properties:
                id: { type: string, format: uuid }
                full_name: { type: string }
        notes: { type: [string, 'null'], description: What was found and done. }
        resolved_at: { type: [string, 'null'], format: date-time, description: When it was resolved or closed; null while active. }
        resolved_by: { type: [string, 'null'], format: uuid }
        updated_at: { type: string, format: date-time }

    IncidentUpdate:
      type: object
      description: At least one field (FMS-89).
      additionalProperties: false
      minProperties: 1
      properties:
        status: { type: string, enum: [open, investigating, resolved, closed] }
        assigned_to: { type: [string, 'null'], format: uuid, description: "A user's public id; null unassigns." }
        notes: { type: [string, 'null'], maxLength: 4000, description: Blank or null clears them. }

    CommandCenterOverview:
      type: object
      required: [depot_id, generated_at, vehicles, drivers, trips, alerts, incidents]
      properties:
        depot_id: { type: [string, 'null'], format: uuid, description: The depot shown; null for every depot in scope. }
        generated_at: { type: string, format: date-time }
        vehicles:
          type: object
          description: Every vehicle but retired ones. available is in service, not flagged and not on a trip.
          properties:
            total: { type: integer }
            on_trip: { type: integer }
            available: { type: integer }
            in_maintenance: { type: integer }
            inactive: { type: integer }
            flagged: { type: integer }
            health:
              type: object
              properties:
                at_risk: { type: integer }
                watch: { type: integer }
                healthy: { type: integer }
                stale: { type: integer }
                unscored: { type: integer }
            health_watch:
              type: array
              description: Vehicles at risk or to watch, lowest score first.
              items:
                type: object
                properties:
                  vehicle_id: { type: string, format: uuid }
                  registration_number: { type: string }
                  health_score: { type: integer }
                  band: { type: string, enum: [at_risk, watch] }
        drivers:
          type: [object, 'null']
          description: Null without driver:read.
          properties:
            total: { type: integer }
            on_trip: { type: integer }
            available: { type: integer }
            absent: { type: integer, description: 'Marked absent, on leave or sick today.' }
            licence_expired: { type: integer }
        trips:
          type: [object, 'null']
          description: Null without trip:read.
          properties:
            today: { type: object, description: "Trips scheduled to start today (Addis Ababa), by status.", additionalProperties: { type: integer } }
            under_way: { type: integer }
            overdue: { type: integer, description: Under way past their scheduled end. }
        alerts:
          type: [object, 'null']
          description: Null without alert:read. Active is open or acknowledged; unacknowledged is open.
          properties:
            active: { type: integer }
            unacknowledged: { type: integer }
            by_severity: { $ref: '#/components/schemas/SeverityCounts' }
            items: { type: array, description: "Most severe first, then newest; each with the vehicle's registration_number.", items: { type: object } }
        incidents:
          type: [object, 'null']
          description: Null without incident:read. Active is open or investigating.
          properties:
            active: { type: integer }
            by_status: { type: object, properties: { open: { type: integer }, investigating: { type: integer } } }
            by_severity: { $ref: '#/components/schemas/SeverityCounts' }
            items: { type: array, description: "Incident fields plus registration_number and driver_name.", items: { type: object } }

    SeverityCounts:
      type: object
      properties:
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }

    IncidentEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Incident' }
        meta:
          type: object
          required: [created, request_id]
          properties:
            created: { type: boolean }
            request_id: { type: string, format: uuid }

    FailureComponent:
      type: string
      enum: [engine, cooling, brakes, tyres, transmission, electrical, suspension, steering, fuel_system, exhaust, body, other]

    FailureInput:
      type: object
      description: What failed on a repair (FMS-125). The catalogues are in docs/maintenance.md.
      additionalProperties: false
      required: [component, failure_mode, unplanned]
      properties:
        component: { $ref: '#/components/schemas/FailureComponent' }
        failure_mode: { type: string, enum: [wear, leak, overheating, electrical_fault, breakage, puncture, other] }
        unplanned: { type: boolean, description: 'A breakdown or a fault found in service; false: found at planned work.' }
        detected_by: { type: string, enum: [driver_report, dvir, technician, telematics, breakdown], default: technician }
        occurred_at: { type: string, format: date-time, description: "Default the repair's opening; not in the future (5 minutes of clock drift allowed)." }
        odometer_km: { type: [number, 'null'], minimum: 0, description: "Default the repair's odometer." }
        incident_id: { type: [string, 'null'], format: uuid, description: 'The incident that reported it: about the same vehicle.' }
        notes: { type: [string, 'null'], maxLength: 2000 }

    FailureEvent:
      type: object
      description: A recorded failure (FMS-125). Never edited.
      required: [id, vehicle_id, registration_number, maintenance_record_id, incident_id, component, failure_mode, unplanned, detected_by, occurred_at, odometer_km, notes, recorded_by, created_at]
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        registration_number: { type: string }
        maintenance_record_id: { type: [string, 'null'], format: uuid, description: The repair that found it. }
        incident_id: { type: [string, 'null'], format: uuid, description: The incident that reported it. }
        component: { $ref: '#/components/schemas/FailureComponent' }
        failure_mode: { type: string, enum: [wear, leak, overheating, electrical_fault, breakage, puncture, other] }
        unplanned: { type: boolean }
        detected_by: { type: string, enum: [driver_report, dvir, technician, telematics, breakdown] }
        occurred_at: { type: string, format: date-time, description: When it failed. }
        odometer_km: { type: [number, 'null'] }
        notes: { type: [string, 'null'] }
        recorded_by: { type: [string, 'null'], format: uuid, description: The user who recorded it. }
        created_at: { type: string, format: date-time }

    ServiceItem:
      type: object
      description: When a wearing part or fluid was last changed on a vehicle (FMS-52).
      required: [service_item, last_changed_at, maintenance_record_id, odometer_km, part_number]
      properties:
        service_item: { type: string, enum: [engine_oil, air_filter, fuel_filter, coolant, brake_pads, brake_fluid, clutch_fluid, tyres, battery, gearbox_oil, belts] }
        last_changed_at: { type: [string, 'null'], format: date-time, description: The completed_at of the repair; null when never changed in the system. }
        maintenance_record_id: { type: [string, 'null'], format: uuid }
        odometer_km: { type: [number, 'null'], description: "The repair's odometer, if it was entered." }
        part_number: { type: [string, 'null'], description: The part that renewed it. }

    ServiceProgramCreate:
      type: object
      description: A preventive service program (FMS-129). At least one interval; whichever comes first.
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        depot_id: { type: [string, 'null'], format: uuid, description: 'Null: fleet-wide.' }
        vehicle_type: { type: [string, 'null'], enum: [car, suv, van, truck, bus, motorcycle, other, null] }
        fuel_type: { type: [string, 'null'], enum: [petrol, diesel, hybrid, electric, cng, lpg, other, null] }
        make: { type: [string, 'null'], maxLength: 100 }
        model: { type: [string, 'null'], maxLength: 100, description: Needs make. }
        interval_km: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        lead_km: { type: [integer, 'null'], minimum: 0, description: 'Below interval_km. Left out, a tenth of it.' }
        interval_days: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
        lead_days: { type: [integer, 'null'], minimum: 0 }
        interval_engine_hours: { type: [integer, 'null'], minimum: 1, maximum: 100000 }
        lead_engine_hours: { type: [integer, 'null'], minimum: 0 }
        tasks:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 200 }

    ServiceProgramUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        depot_id: { type: [string, 'null'], format: uuid, description: 'Null: fleet-wide.' }
        vehicle_type: { type: [string, 'null'], enum: [car, suv, van, truck, bus, motorcycle, other, null] }
        fuel_type: { type: [string, 'null'], enum: [petrol, diesel, hybrid, electric, cng, lpg, other, null] }
        make: { type: [string, 'null'], maxLength: 100 }
        model: { type: [string, 'null'], maxLength: 100, description: Needs make. }
        interval_km: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        lead_km: { type: [integer, 'null'], minimum: 0, description: 'Below interval_km. Left out, a tenth of it.' }
        interval_days: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
        lead_days: { type: [integer, 'null'], minimum: 0 }
        interval_engine_hours: { type: [integer, 'null'], minimum: 1, maximum: 100000 }
        lead_engine_hours: { type: [integer, 'null'], minimum: 0 }
        tasks:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 200 }
        is_active: { type: boolean, description: false retires the program; true restores it. }

    ServiceProgram:
      type: object
      required: [id, name, description, depot_id, vehicle_type, fuel_type, make, model, interval_km, lead_km, interval_days, lead_days,
                 interval_engine_hours, lead_engine_hours, tasks, is_active, vehicles, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 2000 }
        depot_id: { type: [string, 'null'], format: uuid, description: 'Null: fleet-wide.' }
        vehicle_type: { type: [string, 'null'], enum: [car, suv, van, truck, bus, motorcycle, other, null] }
        fuel_type: { type: [string, 'null'], enum: [petrol, diesel, hybrid, electric, cng, lpg, other, null] }
        make: { type: [string, 'null'], maxLength: 100 }
        model: { type: [string, 'null'], maxLength: 100, description: Needs make. }
        interval_km: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        lead_km: { type: [integer, 'null'], minimum: 0, description: 'Below interval_km. Left out, a tenth of it.' }
        interval_days: { type: [integer, 'null'], minimum: 1, maximum: 3650 }
        lead_days: { type: [integer, 'null'], minimum: 0 }
        interval_engine_hours: { type: [integer, 'null'], minimum: 1, maximum: 100000 }
        lead_engine_hours: { type: [integer, 'null'], minimum: 0 }
        tasks:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 200 }
        is_active: { type: boolean }
        vehicles:
          type: object
          description: The caller's vehicles the program covers, by status, as last computed.
          required: [total, upcoming, due, overdue]
          properties:
            total: { type: integer }
            upcoming: { type: integer }
            due: { type: integer }
            overdue: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WarrantyComponent:
      type: [string, 'null']
      description: 'A component of the failure catalogue (FMS-125); null: the whole vehicle.'
      enum: [engine, cooling, brakes, tyres, transmission, electrical, suspension, steering, fuel_system, exhaust, body, other, null]

    Warranty:
      type: object
      description: A vehicle's warranty (FMS-133, docs/warranties-recalls.md).
      required: [id, vehicle_id, registration_number, component, provider, coverage, starts_on, ends_on, ends_km, terms, is_active, status,
                 days_left, km_left, claims, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        registration_number: { type: string }
        component: { $ref: '#/components/schemas/WarrantyComponent' }
        provider: { type: string }
        coverage: { type: [string, 'null'], description: What it covers, as the provider words it. }
        starts_on: { type: string, format: date }
        ends_on: { type: [string, 'null'], format: date, description: 'The last day of cover (Addis Ababa).' }
        ends_km: { type: [number, 'null'], description: The odometer reading at which cover ends. }
        terms: { type: [string, 'null'] }
        is_active: { type: boolean, description: 'False: voided.' }
        status:
          type: string
          enum: [active, expiring, expired, not_started, void]
          description: Today. expiring is within the expiry_warning_days setting (30) of ends_on; expired is past ends_on, or the odometer past ends_km.
        days_left: { type: [integer, 'null'], description: 'Days to ends_on (negative once past); null without one.' }
        km_left: { type: [number, 'null'], description: "Kilometres to ends_km from the vehicle's odometer now; null without one." }
        claims:
          type: object
          description: The repairs claimed under it, by claim status, and what approved claims recovered (cents, ETB).
          required: [claimable, submitted, approved, rejected, recovered_cents]
          properties:
            claimable: { type: integer }
            submitted: { type: integer }
            approved: { type: integer }
            rejected: { type: integer }
            recovered_cents: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WarrantyCreate:
      type: object
      additionalProperties: false
      required: [vehicle_id, provider, starts_on]
      description: An end date, an end odometer, or both.
      properties:
        vehicle_id: { type: string, format: uuid }
        component: { $ref: '#/components/schemas/WarrantyComponent' }
        provider: { type: string, minLength: 1, maxLength: 255 }
        coverage: { type: [string, 'null'], maxLength: 2000 }
        starts_on: { type: string, format: date }
        ends_on: { type: [string, 'null'], format: date }
        ends_km: { type: [number, 'null'], exclusiveMinimum: 0 }
        terms: { type: [string, 'null'], maxLength: 5000 }

    WarrantyUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        component: { $ref: '#/components/schemas/WarrantyComponent' }
        provider: { type: string, minLength: 1, maxLength: 255 }
        coverage: { type: [string, 'null'], maxLength: 2000 }
        starts_on: { type: string, format: date }
        ends_on: { type: [string, 'null'], format: date }
        ends_km: { type: [number, 'null'], exclusiveMinimum: 0 }
        terms: { type: [string, 'null'], maxLength: 5000 }
        is_active: { type: boolean }

    WarrantyClaim:
      type: object
      description: >
        The warranty claim on a repair (FMS-133): a repair that found a failure a warranty of its vehicle covered
        on its work day (completed, else started, else entered) and within its end odometer.
      required: [warranty_id, provider, component, status, amount_cents, reference, ends_km, km_checked, updated_at, updated_by]
      properties:
        warranty_id: { type: string, format: uuid }
        provider: { type: string }
        component: { $ref: '#/components/schemas/WarrantyComponent' }
        status: { type: string, enum: [claimable, submitted, approved, rejected] }
        amount_cents: { type: [integer, 'null'], description: Recovered, in whole cents (ETB); on an approved claim. }
        reference: { type: [string, 'null'], description: "The provider's claim reference." }
        ends_km: { type: [number, 'null'], description: "The warranty's end odometer; null: it ends by date only." }
        km_checked:
          type: boolean
          description: >
            False: the warranty has an end odometer and the repair none, so the distance is not checked yet.
            Submitting the claim then needs `odometer_km`.
        updated_at: { type: [string, 'null'], format: date-time, description: When the claim last moved; null while only claimable. }
        updated_by: { type: [string, 'null'], format: uuid }

    WarrantyClaimUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [submitted, approved, rejected] }
        amount_cents: { type: [integer, 'null'], minimum: 0, description: 'Required with approved; only then.' }
        reference: { type: [string, 'null'], maxLength: 100 }
        odometer_km:
          type: number
          minimum: 0
          description: >
            The odometer at the repair, for one that has none whose warranty ends at a reading (`km_checked: false`).
            Recorded on the repair (audited) and the repair judged again, before the claim moves; kept even when it
            puts the repair past the limit (then `409`, `over_km_limit`). On a repair with a reading: `400`,
            `odometer_recorded`.

    Recall:
      type: object
      description: A manufacturer's recall campaign (FMS-133).
      required: [id, campaign_code, make, model, year_from, year_to, description, remedy, issued_on, vehicles, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        campaign_code: { type: string }
        make: { type: string }
        model: { type: string }
        year_from: { type: integer }
        year_to: { type: integer }
        description: { type: string }
        remedy: { type: [string, 'null'] }
        issued_on: { type: [string, 'null'], format: date }
        vehicles:
          type: object
          description: "The caller's vehicles under it, by status."
          required: [total, open, scheduled, completed]
          properties:
            total: { type: integer }
            open: { type: integer }
            scheduled: { type: integer }
            completed: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RecallCreate:
      type: object
      additionalProperties: false
      required: [campaign_code, make, model, year_from, year_to, description]
      properties:
        campaign_code: { type: string, minLength: 1, maxLength: 50 }
        make: { type: string, minLength: 1, maxLength: 100 }
        model: { type: string, minLength: 1, maxLength: 100 }
        year_from: { type: integer, minimum: 1900, maximum: 2100 }
        year_to: { type: integer, minimum: 1900, maximum: 2100, description: Not before year_from. }
        description: { type: string, minLength: 1, maxLength: 5000 }
        remedy: { type: [string, 'null'], maxLength: 5000 }
        issued_on: { type: [string, 'null'], format: date }

    RecallUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        campaign_code: { type: string, minLength: 1, maxLength: 50 }
        make: { type: string, minLength: 1, maxLength: 100 }
        model: { type: string, minLength: 1, maxLength: 100 }
        year_from: { type: integer, minimum: 1900, maximum: 2100 }
        year_to: { type: integer, minimum: 1900, maximum: 2100 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        remedy: { type: [string, 'null'], maxLength: 5000 }
        issued_on: { type: [string, 'null'], format: date }

    RecallVehicle:
      type: object
      description: One vehicle a recall applies to, and its recall work.
      required: [recall_id, campaign_code, description, remedy, vehicle_id, registration_number, status, maintenance_record_id, completed_at, notes, matched_at, updated_at]
      properties:
        recall_id: { type: string, format: uuid }
        campaign_code: { type: string }
        description: { type: string }
        remedy: { type: [string, 'null'] }
        vehicle_id: { type: string, format: uuid }
        registration_number: { type: string }
        status: { type: string, enum: [open, scheduled, completed] }
        maintenance_record_id: { type: [string, 'null'], format: uuid, description: The work order that carries out the remedy. }
        completed_at: { type: [string, 'null'], format: date-time }
        notes: { type: [string, 'null'] }
        matched_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RecallVehicleUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { type: string, enum: [open, scheduled, completed] }
        maintenance_record_id: { type: [string, 'null'], format: uuid }
        completed_at: { type: string, format: date-time, description: 'With completed; default the work order''s completion, else now.' }
        notes: { type: [string, 'null'], maxLength: 2000 }

    ServiceDue:
      type: object
      description: One vehicle's service under one program (FMS-129, docs/service-programs.md).
      required: [vehicle_id, registration_number, depot_id, program, status, due_by, last_service, since, next_due, readings, remaining,
                 open_record, status_changed_at, computed_at]
      properties:
        vehicle_id: { type: string, format: uuid }
        registration_number: { type: string }
        depot_id: { type: string, format: uuid }
        program:
          type: object
          required: [id, name, tasks]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            tasks: { type: array, items: { type: string } }
        status: { type: string, enum: [upcoming, due, overdue], description: 'due: within a lead window; overdue: past an interval.' }
        due_by: { type: array, items: { type: string, enum: [km, days, engine_hours] }, description: The measures at that status. }
        last_service:
          description: The completed repair the count starts from; null when none is on record (it runs from the vehicle's first reading).
          oneOf:
            - type: 'null'
            - type: object
              required: [maintenance_record_id, completed_at]
              properties:
                maintenance_record_id: { type: string, format: uuid }
                completed_at: { type: string, format: date-time }
        since:
          type: object
          required: [at, odometer_km, engine_hours]
          properties:
            at: { type: string, format: date-time }
            odometer_km: { type: number }
            engine_hours: { type: [number, 'null'] }
        next_due:
          type: object
          required: [odometer_km, at, engine_hours]
          properties:
            odometer_km: { type: [number, 'null'] }
            at: { type: [string, 'null'], format: date-time }
            engine_hours: { type: [number, 'null'], description: Null when the program does not count hours or the vehicle has no readings. }
        readings:
          type: object
          required: [odometer_km, engine_hours]
          properties:
            odometer_km: { type: number }
            engine_hours: { type: [number, 'null'] }
        remaining:
          type: object
          description: How far until it falls due; negative when overdue. Days are whole days from now.
          required: [km, days, engine_hours]
          properties:
            km: { type: [number, 'null'] }
            days: { type: [integer, 'null'] }
            engine_hours: { type: [number, 'null'] }
        open_record:
          description: Open preventive work booked for the program on the vehicle.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, status, scheduled_at]
              properties:
                id: { type: string, format: uuid }
                status: { type: string }
                scheduled_at: { type: [string, 'null'], format: date-time }
        status_changed_at: { type: string, format: date-time }
        computed_at: { type: string, format: date-time }

    ServiceDueSummary:
      type: object
      description: A vehicle's programs due or overdue, for the dispatch board (FMS-129).
      required: [status, programs]
      properties:
        status: { type: string, enum: [due, overdue] }
        programs:
          type: array
          items:
            type: object
            required: [program_id, name, status, due_by]
            properties:
              program_id: { type: string, format: uuid }
              name: { type: string }
              status: { type: string, enum: [due, overdue] }
              due_by: { type: array, items: { type: string, enum: [km, days, engine_hours] } }

    MaintenanceRisk:
      type: object
      description: A vehicle's latest prediction (FMS-55, FMS-56). Score fields are null for a vehicle never scored.
      required: [vehicle_id, prediction_id, health_score, risk_level, failure_probability, prediction_horizon_days, factors, model_name, model_version, as_of, scored_at, stale, feedback]
      properties:
        vehicle_id: { type: string, format: uuid }
        prediction_id: { type: [string, 'null'], format: uuid, description: "The id that feedback on the prediction takes (POST /maintenance-predictions/{prediction_id}/feedback)." }
        health_score: { type: [integer, 'null'], minimum: 0, maximum: 100, description: 'round((1 - failure_probability) * 100)' }
        risk_level: { type: [string, 'null'], enum: [low, medium, high, null], description: 'low at 75 and up, high at 40 and below.' }
        failure_probability: { type: [number, 'null'], minimum: 0, maximum: 1, description: The chance of an unplanned failure within the horizon. }
        prediction_horizon_days: { type: [integer, 'null'], example: 30 }
        factors:
          type: array
          maxItems: 3
          description: The inputs raising this vehicle's risk most, largest first. Empty for a healthy or unscored vehicle.
          items:
            type: object
            required: [feature, value, unit]
            properties:
              feature: { type: string, example: days_since_last_service, description: An input of feature_spec.json. }
              value: { type: [number, 'null'], example: 100, description: "The vehicle's value when scored." }
              unit: { type: [string, 'null'], example: d }
        model_name: { type: [string, 'null'], example: predictive-maintenance }
        model_version: { type: [string, 'null'], example: pm-2026.10 }
        as_of: { type: [string, 'null'], format: date-time, description: The scoring time the inputs were computed as of (the start of the day, Addis Ababa). }
        scored_at: { type: [string, 'null'], format: date-time }
        stale: { type: boolean, description: Scored more than 25 hours ago. }
        feedback:
          oneOf: [{ $ref: '#/components/schemas/PredictionFeedback' }, { type: 'null' }]
          description: What a technician found when they inspected the vehicle for this prediction (FMS-128), or null. Last night's feedback is about last night's score, not this one.

    PredictionOutcome:
      type: string
      enum: [confirmed_issue, no_issue_found, already_fixed, not_inspected]
      description: >
        confirmed_issue: the inspection found what the model feared. no_issue_found: nothing wrong.
        already_fixed: it was a real problem, repaired before the inspection. not_inspected: nobody looked.

    PredictionFeedback:
      type: object
      description: What a technician found on a flagged vehicle (FMS-128). One per prediction; never deleted.
      required: [id, prediction_id, outcome, component, failure_event_id, comment, recorded_by, created_at, updated_at, editable_until, can_edit]
      properties:
        id: { type: string, format: uuid }
        prediction_id: { type: string, format: uuid }
        outcome: { $ref: '#/components/schemas/PredictionOutcome' }
        component: { type: [string, 'null'], enum: [engine, cooling, brakes, tyres, transmission, electrical, suspension, steering, fuel_system, exhaust, body, other, null], description: What was found; confirmed issues only. }
        failure_event_id: { type: [string, 'null'], format: uuid, description: The failure record (FMS-125) the confirmed issue led to. }
        comment: { type: [string, 'null'] }
        recorded_by: { type: [string, 'null'], format: uuid, description: The user who gave it. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        editable_until: { type: string, format: date-time, description: 7 days after created_at. }
        can_edit: { type: boolean, description: The caller is the author and editable_until has not passed. }

    MlModelFeedback:
      type: object
      description: >
        How a model version's high-risk predictions fared (FMS-128). precision is confirmed_issue / reviewed, where
        reviewed = confirmed_issue + no_issue_found + already_fixed: not_inspected judges nothing, and already_fixed
        cannot be confirmed by an inspection, so it counts against.
      required: [high_risk_predictions, with_feedback, confirmed_issue, no_issue_found, already_fixed, not_inspected, reviewed, precision, by_month]
      properties:
        high_risk_predictions: { type: integer, description: Scored predictions of this version at risk level high. }
        with_feedback: { type: integer }
        confirmed_issue: { type: integer }
        no_issue_found: { type: integer }
        already_fixed: { type: integer }
        not_inspected: { type: integer }
        reviewed: { type: integer }
        precision: { type: [number, 'null'], minimum: 0, maximum: 1, description: 'Three decimals; null when nothing is reviewed yet.' }
        by_month:
          type: array
          description: Newest first; the last 12 months, only months with a judgement; the month feedback was given in (Addis Ababa).
          items:
            type: object
            required: [month, reviewed, confirmed_issue, precision]
            properties:
              month: { type: string, pattern: '^\d{4}-\d{2}$', example: 2026-10 }
              reviewed: { type: integer }
              confirmed_issue: { type: integer }
              precision: { type: [number, 'null'] }

    BoardDistancePeriod:
      type: object
      required: [period, limit_km, without_km, with_km, left_km]
      properties:
        period: { type: string, enum: [day, week] }
        limit_km: { type: number }
        without_km: { type: number, description: Load-weighted km of the driver's other trips starting in the period. }
        with_km: { type: number, description: With the trip being staffed. }
        left_km: { type: number, description: Left of the limit with the trip; negative when over. }
    BoardDistance:
      type: object
      description: Where a driver stands against the driving distance limits on the trip being staffed (FMS-156).
      required: [trip_km, day, week, over, near]
      properties:
        trip_km: { type: number, description: "The trip's own load-weighted km." }
        day: { $ref: '#/components/schemas/BoardDistancePeriod' }
        week: { $ref: '#/components/schemas/BoardDistancePeriod' }
        over:
          description: The period the trip takes past its limit, the day first; the assignment is refused.
          oneOf:
            - type: 'null'
            - { $ref: '#/components/schemas/BoardDistancePeriod' }
        near:
          description: Otherwise, a period at 80% of its limit or more; a warning.
          oneOf:
            - type: 'null'
            - { $ref: '#/components/schemas/BoardDistancePeriod' }
    BoardTripRisk:
      type: object
      description: "Whether the board carries the trip risk model's chances (FMS-155). ok: the active model's (demonstration when trained on generated trips). not_enough_trips: no usable model and fewer than the minimum trips to train one. off: no usable model (reason). unavailable: the ML service failed."
      required: [status, reason, model_version, demonstration, trips, drivers, minimum]
      properties:
        status: { type: string, enum: [ok, not_enough_trips, off, unavailable] }
        reason: { type: [string, 'null'], enum: [service_off, no_model, unavailable, feature_spec_mismatch, artefact_mismatch, not_active, null] }
        model_version: { type: [string, 'null'], example: tr-2026.11 }
        demonstration: { type: boolean }
        trips: { type: integer, description: Completed, measured trips there are to train on. }
        drivers: { type: integer, description: Drivers of those trips. }
        minimum:
          type: object
          required: [trips, drivers]
          properties:
            trips: { type: integer, example: 2000 }
            drivers: { type: integer, example: 20 }

    DriverTripRisk:
      type: object
      required: [late_probability, safety_event_probability, factors]
      properties:
        late_probability: { type: number, minimum: 0, maximum: 1, description: The chance the trip ends more than its depot's delay margin late. }
        safety_event_probability: { type: number, minimum: 0, maximum: 1, description: The chance of a speeding flag or an accident during it. }
        factors:
          type: object
          description: The inputs that raise each chance most, at most two each, with the value the model was given.
          required: [late, safety_event]
          properties:
            late: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/TripRiskFactor' } }
            safety_event: { type: array, maxItems: 2, items: { $ref: '#/components/schemas/TripRiskFactor' } }

    TripRiskFactor:
      type: object
      required: [feature, value]
      properties:
        feature: { type: string, description: 'An input of trip_risk_spec.json, e.g. hours_driven_24h.' }
        value: { type: number }

    MlModel:
      type: object
      description: A registered predictive maintenance model version (FMS-127). Written once when first seen; only its status changes.
      required: [id, name, version, status, algorithm, features, feature_spec_version, feature_spec_hash, features_match, demonstration, metrics, training_data, trained_at, artefact_sha256, first_seen_at, activated_at, activated_by, retired_at, feedback]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: predictive-maintenance }
        version: { type: string, example: pm-2026.10 }
        status: { type: string, enum: [registered, active, retired], description: 'registered: seen, not allowed to score; active: the one that scores (at most one per name); retired: replaced.' }
        algorithm: { type: string }
        features: { type: array, items: { type: string }, description: "The model's inputs, in the order it takes them." }
        feature_spec_version: { type: integer }
        feature_spec_hash: { type: string, pattern: '^[0-9a-f]{64}$', description: 'SHA-256 of the canonical feature definitions it was trained on (feature_spec.json).' }
        features_match: { type: boolean, description: "Whether feature_spec_hash is the core's: false, it can never score." }
        demonstration: { type: boolean, description: 'Trained on generated data (training_data.source generated): a trip risk demonstration (FMS-155), labelled so wherever it shows.' }
        metrics: { type: object, additionalProperties: true, description: 'As the ML service reported them: roc_auc, brier, at_alert_threshold (precision, recall, f1), and more.' }
        training_data: { type: object, additionalProperties: true, description: 'Which data: file and its SHA-256, rows, vehicles, dates, split.' }
        trained_at: { type: string, format: date-time }
        artefact_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        first_seen_at: { type: string, format: date-time, description: 'When the scoring job first saw the ML service serve it.' }
        activated_at: { type: [string, 'null'], format: date-time }
        activated_by: { type: [string, 'null'], format: uuid, description: 'The administrator who last activated it.' }
        retired_at: { type: [string, 'null'], format: date-time }
        feedback: { $ref: '#/components/schemas/MlModelFeedback' }
    DowntimePeriod:
      type: object
      description: One stretch a vehicle was out of service (FMS-131, docs/downtime.md).
      required: [id, vehicle_id, started_at, ended_at, duration_minutes, reason, unplanned, derived_reason, reason_note, reason_set_by, reason_set_at, opened_by, maintenance_record_id, failure_event_id, maintenance_record, failure]
      properties:
        id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time, description: null while the vehicle is still out of service. }
        duration_minutes: { type: integer, description: 'To ended_at, or to now while it lasts.' }
        reason: { type: string, enum: [planned_service, unplanned_repair, breakdown, accident, awaiting_parts, other] }
        unplanned: { type: boolean, description: 'unplanned_repair, breakdown or accident: counted as a failure in MTBF and MTTR.' }
        derived_reason: { type: string, enum: [planned_service, unplanned_repair, breakdown, accident, awaiting_parts, other], description: "What its repair or failure says; reason differs when a staff member set one." }
        reason_note: { type: [string, 'null'] }
        reason_set_by: { type: [string, 'null'], format: uuid, description: The user who set the reason. }
        reason_set_at: { type: [string, 'null'], format: date-time }
        opened_by: { type: string, enum: [status_change, breakdown, registration], description: What began it. }
        maintenance_record_id: { type: [string, 'null'], format: uuid, description: The work order it belongs to. }
        failure_event_id: { type: [string, 'null'], format: uuid, description: The failure behind its reason. }
        maintenance_record:
          type: [object, 'null']
          description: 'The work order, in words (FMS-142); null without one, or for a caller without maintenance:read.'
          required: [id, maintenance_type, status, description]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            maintenance_type: { type: string, enum: [corrective, preventive, inspection, predictive, other] }
            status: { type: string }
            description: { type: [string, 'null'] }
        failure:
          type: [object, 'null']
          description: 'The failure behind its reason (FMS-125), likewise.'
          required: [id, component, failure_mode, detected_by, occurred_at]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            component: { type: string }
            failure_mode: { type: string }
            detected_by: { type: string }
            occurred_at: { type: string, format: date-time }
    DowntimeKpis:
      type: object
      description: A month's downtime KPIs, in whole minutes (FMS-131).
      required: [in_fleet_minutes, uptime_minutes, downtime_minutes, unplanned_downtime_minutes, availability_pct, failures, mtbf_minutes, repairs, mttr_minutes, downtime_by_reason]
      properties:
        in_fleet_minutes: { type: integer }
        uptime_minutes: { type: integer }
        downtime_minutes: { type: integer }
        unplanned_downtime_minutes: { type: integer }
        availability_pct: { type: [number, 'null'], description: 'Up over in the fleet, to a tenth of a percent; null with no time in the fleet.' }
        failures: { type: integer, description: Unplanned periods begun in the month. }
        mtbf_minutes: { type: [integer, 'null'], description: 'Time up per failure; null without one.' }
        repairs: { type: integer, description: Unplanned periods ended in the month. }
        mttr_minutes: { type: [integer, 'null'], description: 'Their whole length per repair; null without one.' }
        downtime_by_reason: { type: object, description: 'Minutes down in the month for each reason: planned_service, unplanned_repair, breakdown, accident, awaiting_parts, other.', additionalProperties: { type: integer } }
    MeterReading:
      type: object
      description: One reading of a vehicle's odometer or engine-hour meter (FMS-126).
      required: [id, meter, value, source, source_ref, recorded_at, suspect, created_at]
      properties:
        id: { type: string, format: uuid }
        meter: { type: string, enum: [odometer, engine_hours] }
        value: { type: number, description: 'km for the odometer, hours for engine hours; one decimal.' }
        source: { type: string, enum: [fuel_log, maintenance, telematics, gps_derived, manual] }
        source_ref: { type: [string, 'null'], description: "The fuel log's or repair's id, the device's id, or the day (YYYY-MM-DD) of an engine-hours reading; null for manual." }
        recorded_at: { type: string, format: date-time, description: When the reading was true. }
        suspect: { type: boolean, description: "Lower than a trusted reading recorded before it: kept, but the vehicle's odometer did not follow it." }
        created_at: { type: string, format: date-time }
