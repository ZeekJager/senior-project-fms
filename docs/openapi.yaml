openapi: 3.1.0
info:
  title: Fleet Management System API
  version: 1.0.0
  description: >
    Machine-readable contract for the endpoints listed here. docs/api-contract.md
    stays the full reference; an endpoint is added here as its card is built, and
    test/integration/openapi.test.ts checks that every operation listed is mounted
    and that every error code named is one the API sends.
    Started with trip assignment (FMS-31), vehicle status and availability (FMS-76) and the
    trip lifecycle commands (FMS-32), and the dispatcher board (FMS-33); the integration gateway's provider
    status, manual sync and signed webhooks (FMS-85); GPS ingestion (FMS-88).
servers:
  - url: /api/v1
security:
  - session: []

tags:
  - name: Trips
  - name: Vehicles
  - name: Dispatch
  - name: Integrations
  - name: Tracking

paths:
  /trips/{trip_id}/assign:
    post:
      tags: [Trips]
      operationId: assignTrip
      summary: Assign a driver and vehicle to a trip (FMS-31)
      description: >
        Needs trip:assign (admin, fleet manager, dispatcher; never drivers). Checks, in order:
        the vehicle and driver are in the caller's depots (400); fleet availability (FMS-76), after
        both rows are share-locked: the vehicle and the driver belong to the trip's depot
        (CONFLICT_DEPOT_MISMATCH), the vehicle is not retired or out of service
        (CONFLICT_INVALID_STATE_TRANSITION) and not flagged or in the workshop (BR-2,
        CONFLICT_VEHICLE_FLAGGED); the driver is eligible (CONFLICT_DRIVER_NOT_ELIGIBLE); BR-1 and
        BR-3 overlaps, touching ends included (CONFLICT_DRIVER_OVERLAP, CONFLICT_VEHICLE_OVERLAP).
        Publishes TripAssigned. Audited.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [driver_id, vehicle_id, version]
              properties:
                driver_id: { type: string, format: uuid }
                vehicle_id: { type: string, format: uuid }
                version:
                  type: integer
                  minimum: 0
                  description: The trip's version as the dispatcher saw it.
      responses:
        '200':
          description: Assigned (or already assigned to the same pair, unchanged).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Trip' }
                  meta:
                    type: object
                    required: [warnings, request_id]
                    properties:
                      warnings:
                        type: array
                        items: { $ref: '#/components/schemas/AssignmentWarning' }
                      request_id: { type: string, format: uuid }
        '400':
          description: VALIDATION_FAILED (a bad body, or a driver or vehicle outside the caller's depots).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            CONFLICT_CONCURRENT_MODIFICATION, CONFLICT_INVALID_STATE_TRANSITION, CONFLICT_DEPOT_MISMATCH,
            CONFLICT_VEHICLE_FLAGGED, CONFLICT_DRIVER_NOT_ELIGIBLE, CONFLICT_DRIVER_OVERLAP or
            CONFLICT_VEHICLE_OVERLAP. A detail's record_id names the conflicting trip or the open
            maintenance record.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /trips/{trip_id}/start:
    post:
      tags: [Trips]
      operationId: startTrip
      summary: Start a trip (FMS-32)
      description: >
        assigned → en_route, actual_start now. Needs trip:execute; a driver only on their own trips.
        The assignment rules are read again: a vehicle flagged, in the workshop, out of service, retired or
        in another depot since, or an expired licence, refuse with the assignment's 409s. Another trip of the
        driver or vehicle still under way (PREVIOUS_TRIP_OVERRUN) and the driver's attendance
        (DRIVER_ATTENDANCE) are warnings. Publishes TripStarted.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '200': { $ref: '#/components/responses/TripMoved' }
        '400':
          description: VALIDATION_FAILED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TripMoveRefused' }

  /trips/{trip_id}/end:
    post:
      tags: [Trips]
      operationId: endTrip
      summary: End a trip (FMS-32)
      description: >
        en_route → completed, actual_end now (never before actual_start); the duration is stored. Needs
        trip:execute; a driver only on their own trips. Publishes TripCompleted.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '200': { $ref: '#/components/responses/TripMoved' }
        '400':
          description: VALIDATION_FAILED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TripMoveRefused' }

  /trips/{trip_id}/status:
    post:
      tags: [Trips]
      operationId: changeTripStatus
      summary: Explicit trip status transition (FMS-32)
      description: >
        en_route is start and completed is end. scheduled (a draft with both times) and cancelled also need
        trip:write, so a driver gets 403 FORBIDDEN_INSUFFICIENT_ROLE. assigned is always 409 (reason
        assign_required): use POST /trips/{trip_id}/assign.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [scheduled, assigned, en_route, completed, cancelled] }
      responses:
        '200': { $ref: '#/components/responses/TripMoved' }
        '400':
          description: VALIDATION_FAILED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TripMoveRefused' }

  /dispatch/availability:
    get:
      tags: [Dispatch]
      operationId: getDispatchBoard
      summary: Dispatcher board (FMS-33)
      description: >
        A depot's drivers and vehicles with their state now (the console's colours) and their availability for
        the trip being staffed. Needs trip:assign. depot_id defaults to the caller's own depot; someone who sees
        several must give one (400 VALIDATION_FAILED, reason required).
      parameters:
        - name: depot_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: The trip's start (an instant, or a date meaning that Addis Ababa day). None means now.
          schema: { type: string }
        - name: to
          in: query
          description: The trip's end. At most 31 days after from.
          schema: { type: string }
        - name: exclude_trip_id
          in: query
          description: The trip being staffed; its own assignment is not a conflict.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The board.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/DispatchBoard' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (depot required or outside your depots) or VALIDATION_INVALID_DATE_RANGE.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /vehicles/{vehicle_id}/status:
    get:
      tags: [Vehicles]
      operationId: getVehicleStatus
      summary: Vehicle status and availability (FMS-76)
      description: >
        Needs vehicle:read; same depot scope as GET /vehicles/{id} (404 outside it). Availability is
        for the window given, or now.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - name: from
          in: query
          description: An instant, or a date meaning that Addis Ababa day.
          schema: { type: string }
        - name: to
          in: query
          description: An instant, or a date meaning the end of that Addis Ababa day. At most 31 days after from.
          schema: { type: string }
      responses:
        '200':
          description: The vehicle's status.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/VehicleStatus' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_INVALID_DATE_RANGE (the window ends before it starts, or covers more than 31 days).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Vehicles]
      operationId: changeVehicleStatus
      summary: Change a vehicle's status, with the reason (FMS-76)
      description: >
        Needs vehicle:write and the depot scope. Audited, kept in the status history, published as
        VehicleStatusChanged. A vehicle on a trip under way cannot be taken off the road; trips
        already assigned ahead come back as warnings.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status: { $ref: '#/components/schemas/VehicleStatusValue' }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Changed (or already in that status, unchanged).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/VehicleStatus' }
                  meta:
                    type: object
                    required: [warnings, request_id]
                    properties:
                      warnings:
                        type: array
                        items: { $ref: '#/components/schemas/StatusChangeWarning' }
                      request_id: { type: string, format: uuid }
        '400':
          description: VALIDATION_FAILED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION (nothing leaves retired), CONFLICT_VEHICLE_IN_USE (on a trip under way; record_id is the trip) or CONFLICT_CONCURRENT_MODIFICATION.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /integrations/providers:
    get:
      tags: [Integrations]
      operationId: listIntegrationProviders
      summary: Provider status (FMS-85)
      description: >
        Every provider with its state: last success and failure (from integration.sync_logs), its circuit breaker
        on this API instance, and what its adapter can do. Settings (configuration) and secrets are never returned.
        Needs integration:read. With check=true, each active provider's health check runs first (up to 5 s).
      parameters:
        - name: check
          in: query
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
      responses:
        '200':
          description: The providers, by name.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Provider' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /integrations/providers/{provider_id}/sync:
    post:
      tags: [Integrations]
      operationId: syncIntegrationProvider
      summary: Start a provider sync (FMS-85)
      description: >
        Records a started sync log and answers at once; the sync runs after the response and completes the log
        (succeeded, partial or failed). A sync of the provider already running is returned instead, with
        meta.already_running true. Needs integration:execute.
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: The sync log, status started.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/SyncLog' }
                  meta:
                    type: object
                    required: [request_id, already_running]
                    properties:
                      request_id: { type: string, format: uuid }
                      already_running: { type: boolean }
        '400':
          description: VALIDATION_FAILED, reason provider_inactive or sync_not_supported.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: UPSTREAM_UNAVAILABLE. The provider's circuit is open; Retry-After says when a call is let through.
          headers:
            Retry-After:
              description: Seconds.
              schema: { type: integer }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /webhooks/telematics/{provider}:
    post:
      tags: [Integrations]
      operationId: receiveTelematicsWebhook
      summary: Telematics webhook (FMS-85)
      description: >
        A provider's signed delivery for a telematics provider, named by its code. The signature is HMAC-SHA256 of
        "<X-FMS-Timestamp>.<raw body>" with the provider's secret (INTEGRATION_<CODE>_WEBHOOK_SECRET), sent as
        "sha256=<hex>". A timestamp more than 5 minutes from the server clock is refused (a replay). A redelivery
        of the same event id is answered 202 with duplicate true, and nothing is stored twice. The delivery is
        stored as an inbound sync log and announced as IntegrationWebhookReceived for its consumer.
      security:
        - webhookSignature: []
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/WebhookTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "The provider's own format, read by its adapter." }
      responses:
        '202': { $ref: '#/components/responses/WebhookAccepted' }
        '400':
          description: VALIDATION_FAILED (the adapter cannot read the body; details name the field). Recorded as a failed sync log.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/WebhookRefused' }
        '404':
          description: NOT_FOUND (no active telematics provider with this code, or one without a webhook secret or adapter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE (not application/json).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /webhooks/fuel-card/{provider}:
    post:
      tags: [Integrations]
      operationId: receiveFuelCardWebhook
      summary: Fuel-card webhook (FMS-85)
      description: >
        A provider's signed delivery for a fuel_card provider, named by its code. The signature is HMAC-SHA256 of
        "<X-FMS-Timestamp>.<raw body>" with the provider's secret (INTEGRATION_<CODE>_WEBHOOK_SECRET), sent as
        "sha256=<hex>". A timestamp more than 5 minutes from the server clock is refused (a replay). A redelivery
        of the same event id is answered 202 with duplicate true, and nothing is stored twice. The delivery is
        stored as an inbound sync log and announced as IntegrationWebhookReceived for its consumer.
      security:
        - webhookSignature: []
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/WebhookTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "The provider's own format, read by its adapter." }
      responses:
        '202': { $ref: '#/components/responses/WebhookAccepted' }
        '400':
          description: VALIDATION_FAILED (the adapter cannot read the body; details name the field). Recorded as a failed sync log.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/WebhookRefused' }
        '404':
          description: NOT_FOUND (no active fuel_card provider with this code, or one without a webhook secret or adapter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE (not application/json).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /webhooks/ev/{provider}:
    post:
      tags: [Integrations]
      operationId: receiveEvWebhook
      summary: EV charging webhook (FMS-85)
      description: >
        A provider's signed delivery for a ev_charging provider, named by its code. The signature is HMAC-SHA256 of
        "<X-FMS-Timestamp>.<raw body>" with the provider's secret (INTEGRATION_<CODE>_WEBHOOK_SECRET), sent as
        "sha256=<hex>". A timestamp more than 5 minutes from the server clock is refused (a replay). A redelivery
        of the same event id is answered 202 with duplicate true, and nothing is stored twice. The delivery is
        stored as an inbound sync log and announced as IntegrationWebhookReceived for its consumer.
      security:
        - webhookSignature: []
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/WebhookTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "The provider's own format, read by its adapter." }
      responses:
        '202': { $ref: '#/components/responses/WebhookAccepted' }
        '400':
          description: VALIDATION_FAILED (the adapter cannot read the body; details name the field). Recorded as a failed sync log.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/WebhookRefused' }
        '404':
          description: NOT_FOUND (no active ev_charging provider with this code, or one without a webhook secret or adapter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE (not application/json).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /tracking/gps-pings:
    post:
      tags: [Tracking]
      operationId: ingestGpsPings
      summary: Ingest GPS pings (FMS-88)
      description: >
        A batch of positions. A device (bearer token) reports for its own vehicle; a driver's phone (trip:execute)
        for the vehicle of the driver's trip under way; a user with tracking:ingest names the vehicle on each ping.
        Naming any other vehicle refuses the whole batch (403). A ping already stored (same vehicle, same instant) is
        a duplicate and stored once. Readable pings that cannot be used are listed in rejected; the rest are stored.
        Each vehicle's newest position is announced as VehicleLocationUpdated at most once per 5 s.
      security:
        - deviceToken: []
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pings]
              additionalProperties: false
              properties:
                pings:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/GpsPoint' }
      responses:
        '202':
          description: What was stored.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [accepted, duplicates, rejected]
                    properties:
                      accepted: { type: integer }
                      duplicates: { type: integer, description: Pings already stored (a retried batch). }
                      rejected:
                        type: array
                        items:
                          type: object
                          required: [index, reason]
                          properties:
                            index: { type: integer }
                            reason: { type: string, enum: [future_timestamp, too_old, low_accuracy, unknown_vehicle, unknown_device, vehicle_retired] }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (a field out of range or unknown, details name pings.<i>.<field>; a user's ping without vehicle_id).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >
            FORBIDDEN_INSUFFICIENT_ROLE: no tracking:ingest or trip:execute; or a device or phone naming a vehicle that is
            not its own (reason not_your_vehicle); or a phone with no trip under way (no_trip_under_way). Nothing is stored.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: fms_access
      description: The httpOnly access cookie set by POST /auth/login and rotated by POST /auth/refresh.
    deviceToken:
      type: http
      scheme: bearer
      description: A GPS device's token (fmsd_...), issued by npm run device:register; only its SHA-256 is stored.
    webhookSignature:
      type: apiKey
      in: header
      name: X-FMS-Signature
      description: >
        Webhooks only: "sha256=" and the hex HMAC-SHA256 of "<X-FMS-Timestamp>.<raw body>" with the provider's
        shared secret. Compared in constant time; the timestamp must be within 5 minutes of the server clock.

  parameters:
    TripId:
      name: trip_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VehicleId:
      name: vehicle_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The version last read, as an ETag ("3"). A newer version is 409 CONFLICT_CONCURRENT_MODIFICATION.
      schema: { type: string }
    ProviderCode:
      name: provider
      in: path
      required: true
      description: The provider's code (integration.external_providers.code), e.g. mock-telematics.
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
    WebhookTimestamp:
      name: X-FMS-Timestamp
      in: header
      required: true
      description: When the provider signed the delivery, in Unix seconds. Part of the signed text.
      schema: { type: string, pattern: '^[0-9]{1,12}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }

  headers:
    ETag:
      description: The resource's version, quoted ("3").
      schema: { type: string }

  responses:
    TripMoved:
      description: The trip after the move.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { $ref: '#/components/schemas/Trip' }
              meta:
                type: object
                required: [warnings, request_id]
                properties:
                  warnings:
                    type: array
                    items: { $ref: '#/components/schemas/AssignmentWarning' }
                  request_id: { type: string, format: uuid }
    TripMoveRefused:
      description: >
        CONFLICT_INVALID_STATE_TRANSITION (details[].allowed_transitions lists where the trip can go; empty for
        completed and cancelled), CONFLICT_CONCURRENT_MODIFICATION, or on start the assignment's
        CONFLICT_DEPOT_MISMATCH, CONFLICT_VEHICLE_FLAGGED and CONFLICT_DRIVER_NOT_ELIGIBLE.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    WebhookAccepted:
      description: Stored and announced, or a duplicate of a delivery already stored (the same id).
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [id, status, duplicate]
                properties:
                  id: { type: string, format: uuid, description: The inbound sync log. }
                  status: { type: string, enum: [accepted] }
                  duplicate: { type: boolean }
              meta: { $ref: '#/components/schemas/Meta' }
    WebhookRefused:
      description: >
        AUTH_TOKEN_INVALID (signature missing, malformed or not matching; details reason missing_signature,
        malformed_signature or signature_mismatch) or AUTH_TOKEN_EXPIRED (a genuine signature with a timestamp more
        than 5 minutes from the server clock: a replay). Nothing is stored.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthenticated:
      description: AUTH_TOKEN_INVALID (no session, or a bad token) or AUTH_TOKEN_EXPIRED.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: FORBIDDEN_INSUFFICIENT_ROLE (the role lacks the permission).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: NOT_FOUND (missing, or outside the caller's depots).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string, format: uuid }

    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 'SCREAMING_SNAKE_CASE, from api-contract §3.6.' }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                required: [reason]
                properties:
                  field: { type: string }
                  reason: { type: string }
                  record_id:
                    type: string
                    format: uuid
                    description: The record the problem is about (the conflicting trip, the open maintenance record).
                  allowed_transitions:
                    type: array
                    items: { type: string }
                    description: For a refused state change, the states the record can move to from where it is.
        meta:
          type: object
          properties:
            request_id: { type: string, format: uuid }
            timestamp: { type: string, format: date-time }

    TripStatus:
      type: string
      enum: [draft, scheduled, assigned, en_route, completed, cancelled]

    Trip:
      type: object
      required: [id, route_id, depot_id, vehicle_id, driver_id, status, scheduled_start, scheduled_end, stops, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        route_id: { type: [string, 'null'], format: uuid }
        route_name: { type: [string, 'null'] }
        depot_id: { type: [string, 'null'], format: uuid }
        vehicle_id: { type: [string, 'null'], format: uuid }
        driver_id: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/TripStatus' }
        origin: { type: [string, 'null'] }
        destination: { type: [string, 'null'] }
        planned_distance_km: { type: [number, 'null'] }
        planned_duration_seconds: { type: [integer, 'null'] }
        scheduled_start: { type: [string, 'null'], format: date-time }
        scheduled_end: { type: [string, 'null'], format: date-time }
        actual_start: { type: [string, 'null'], format: date-time }
        actual_end: { type: [string, 'null'], format: date-time }
        actual_distance_km: { type: [number, 'null'] }
        stops:
          type: array
          items:
            type: object
            required: [id, sequence_number, name, status]
            properties:
              id: { type: string, format: uuid }
              sequence_number: { type: integer }
              name: { type: string }
              latitude: { type: [number, 'null'] }
              longitude: { type: [number, 'null'] }
              status: { type: string, enum: [planned, arrived, completed, skipped] }
              planned_arrival: { type: [string, 'null'], format: date-time }
              actual_arrival: { type: [string, 'null'], format: date-time }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AssignmentWarning:
      oneOf:
        - type: object
          description: A trip of the driver or vehicle still under way runs into this one (FMS-31 overrun rule).
          required: [warning, field, trip_id, expected_end]
          properties:
            warning: { const: PREVIOUS_TRIP_OVERRUN }
            field: { type: string, enum: [driver_id, vehicle_id] }
            trip_id: { type: string, format: uuid }
            expected_end: { type: string, format: date-time }
        - type: object
          description: The driver is marked absent, on leave or sick on the trip's first day (Addis Ababa).
          required: [warning, field, attendance]
          properties:
            warning: { const: DRIVER_ATTENDANCE }
            field: { const: driver_id }
            attendance: { type: string, enum: [absent, on_leave, sick] }

    VehicleStatusValue:
      type: string
      description: inactive is out of service; maintenance is in the workshop; retired is final.
      enum: [active, inactive, maintenance, retired]

    AvailabilityResult:
      type: object
      required: [availability, reasons]
      properties:
        availability: { type: string, enum: [available, unavailable, available_with_warning] }
        reasons:
          type: array
          items:
            type: object
            required: [code, severity]
            properties:
              code:
                type: string
                enum:
                  - vehicle_retired
                  - vehicle_in_maintenance
                  - vehicle_out_of_service
                  - maintenance_flag
                  - vehicle_other_depot
                  - driver_retired
                  - account_not_active
                  - license_expired
                  - driver_other_depot
                  - driver_absent
                  - driver_on_leave
                  - driver_sick
                  - assigned_to_overlapping_trip
              severity: { type: string, enum: [block, warning] }
              trip_id: { type: string, format: uuid }

    Assignment:
      type: object
      required: [trip_id, status, start, end]
      properties:
        trip_id: { type: string, format: uuid }
        status: { type: string, enum: [assigned, en_route] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }

    VehicleStatus:
      type: object
      required: [vehicle_id, registration_number, depot_id, status, maintenance, availability, current_assignment, next_assignment, last_status_change, version, updated_at]
      properties:
        vehicle_id: { type: string, format: uuid }
        registration_number: { type: string }
        depot_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/VehicleStatusValue' }
        maintenance:
          type: object
          required: [flagged, in_workshop, open_record_id]
          properties:
            flagged: { type: boolean }
            in_workshop: { type: boolean }
            open_record_id: { type: [string, 'null'], format: uuid }
        availability:
          allOf:
            - $ref: '#/components/schemas/AvailabilityResult'
            - type: object
              required: [window]
              properties:
                window:
                  type: object
                  required: [start, end]
                  properties:
                    start: { type: string, format: date-time }
                    end: { type: string, format: date-time }
        current_assignment:
          oneOf:
            - $ref: '#/components/schemas/Assignment'
            - type: 'null'
        next_assignment:
          oneOf:
            - $ref: '#/components/schemas/Assignment'
            - type: 'null'
        last_status_change:
          oneOf:
            - type: 'null'
            - type: object
              required: [from_status, to_status, reason, source, maintenance_record_id, changed_at, changed_by]
              properties:
                from_status: { $ref: '#/components/schemas/VehicleStatusValue' }
                to_status: { $ref: '#/components/schemas/VehicleStatusValue' }
                reason: { type: [string, 'null'] }
                source: { type: string, enum: [manual, maintenance] }
                maintenance_record_id: { type: [string, 'null'], format: uuid }
                changed_at: { type: string, format: date-time }
                changed_by: { type: [string, 'null'], format: uuid }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    BoardTrip:
      oneOf:
        - type: 'null'
        - type: object
          description: The trip under way now.
          required: [trip_id, end]
          properties:
            trip_id: { type: string, format: uuid }
            end: { type: string, format: date-time, description: Its scheduled end. }

    DispatchBoard:
      type: object
      required: [depot_id, window, drivers, vehicles]
      properties:
        depot_id: { type: string, format: uuid }
        window:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        drivers:
          type: array
          items:
            type: object
            required: [driver_id, full_name, license_categories, vehicle_types, state, attendance, availability, current_trip]
            properties:
              driver_id: { type: string, format: uuid }
              full_name: { type: string }
              license_categories: { type: array, items: { type: string } }
              vehicle_types: { type: array, items: { type: string }, description: The vehicle types the licence covers. }
              state:
                type: string
                description: idle green, near_end amber, en_route red, absent grey (still assignable), unavailable (blocked for the window).
                enum: [idle, near_end, en_route, absent, unavailable]
              attendance: { type: [string, 'null'], enum: [present, absent, late, on_leave, sick, other, null] }
              availability: { $ref: '#/components/schemas/AvailabilityResult' }
              current_trip: { $ref: '#/components/schemas/BoardTrip' }
        vehicles:
          type: array
          items:
            type: object
            required: [vehicle_id, registration_number, make, model, vehicle_type, status, state, availability, open_work, current_trip]
            properties:
              vehicle_id: { type: string, format: uuid }
              registration_number: { type: string }
              make: { type: string }
              model: { type: string }
              vehicle_type: { type: string }
              status: { $ref: '#/components/schemas/VehicleStatusValue' }
              state:
                type: string
                description: idle green, flagged red (flag or workshop), en_route grey, unavailable (blocked for the window).
                enum: [idle, flagged, en_route, unavailable]
              availability: { $ref: '#/components/schemas/AvailabilityResult' }
              open_work:
                oneOf:
                  - type: 'null'
                  - type: object
                    description: The open maintenance record behind the flag.
                    required: [id, description, status, priority, opened_at]
                    properties:
                      id: { type: string, format: uuid }
                      description: { type: string }
                      status: { type: string }
                      priority: { type: string }
                      opened_at: { type: string, format: date-time }
              current_trip: { $ref: '#/components/schemas/BoardTrip' }

    StatusChangeWarning:
      type: object
      description: A trip already assigned to a vehicle taken off the road; it needs another vehicle.
      required: [warning, trip_id, start]
      properties:
        warning: { const: ASSIGNED_TRIP_AFFECTED }
        trip_id: { type: string, format: uuid }
        start: { type: string, format: date-time }

    SyncLog:
      type: object
      required: [id, provider_id, direction, status, trigger, kind, records, external_reference, request_id, started_at, completed_at, error_message]
      properties:
        id: { type: string, format: uuid }
        provider_id: { type: [string, 'null'], format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        status: { type: string, enum: [started, succeeded, failed, partial] }
        trigger: { type: [string, 'null'], enum: [manual, webhook, null] }
        kind: { type: [string, 'null'], description: "A webhook's kind (position, transaction)." }
        records: { type: [integer, 'null'], description: What a sync brought in. }
        external_reference: { type: [string, 'null'], description: "A webhook's event id, a sync's batch." }
        request_id: { type: [string, 'null'] }
        started_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        error_message: { type: [string, 'null'], description: "Our words for the failure (a status, a timeout), never the provider's response." }

    Provider:
      type: object
      required: [id, code, name, provider_type, is_active, status, capabilities, webhook_secret_configured, last_success_at, last_failure_at, last_error, last_sync, circuit, health]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        provider_type: { type: string, enum: [telematics, notification, mapping, traffic, weather, ev_charging, fuel_card, other] }
        is_active: { type: boolean }
        status:
          type: string
          enum: [operational, degraded, down, unknown, inactive]
          description: >
            down while the circuit is open; degraded while half-open, after a failed health check, or when the last
            failure is newer than the last success.
        capabilities:
          type: object
          required: [sync, webhooks, health_check]
          properties:
            sync: { type: boolean }
            webhooks: { type: boolean }
            health_check: { type: boolean }
        webhook_secret_configured: { type: boolean }
        last_success_at: { type: [string, 'null'], format: date-time }
        last_failure_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
        last_sync:
          oneOf:
            - $ref: '#/components/schemas/SyncLog'
            - type: 'null'
        circuit:
          description: This API instance's breaker; null until the instance has called the provider.
          oneOf:
            - type: 'null'
            - type: object
              required: [state, opened_at, retry_at, window, latency_mean_ms]
              properties:
                state: { type: string, enum: [closed, open, half_open] }
                opened_at: { type: [string, 'null'], format: date-time }
                retry_at: { type: [string, 'null'], format: date-time }
                window:
                  type: object
                  description: Counts over the last 60 s.
                  properties:
                    calls: { type: integer }
                    successes: { type: integer }
                    failures: { type: integer }
                    timeouts: { type: integer }
                    rejected: { type: integer }
                latency_mean_ms: { type: integer }
        health:
          oneOf:
            - type: 'null'
            - type: object
              required: [checked_at, healthy, error]
              properties:
                checked_at: { type: string, format: date-time }
                healthy: { type: boolean }
                error: { type: [string, 'null'] }

    GpsPoint:
      type: object
      required: [recorded_at, lat, lng, speed_kmh]
      additionalProperties: false
      properties:
        vehicle_id: { type: string, format: uuid, description: Required from a user with tracking:ingest; a device's and a phone's is implied. }
        recorded_at: { type: string, format: date-time, description: With an offset. Not over 2 minutes ahead, not over 7 days old. }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        speed_kmh: { type: number, minimum: 0, maximum: 300, description: Stored as whole km/h, rounded to the nearest. }
        heading: { type: [number, 'null'], minimum: 0, maximum: 360 }
        accuracy_m: { type: [number, 'null'], minimum: 0, description: Over 500 is refused (low_accuracy). }
        altitude_m: { type: [number, 'null'] }
        ignition_on: { type: [boolean, 'null'] }
        odometer_km: { type: [number, 'null'], minimum: 0 }
