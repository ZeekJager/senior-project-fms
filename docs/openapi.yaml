          description: VALIDATION_FAILED (a bad date; to before_from; range_too_long, over 366 days).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/{report}:
    get:
      tags: [Analytics]
      operationId: getReport
      summary: A monthly report, as JSON, CSV or PDF (FMS-91)
      description: >
        One of five monthly reports for an Addis Ababa month and the caller's depots, or one of them: fuel (per
        vehicle filled or driven: fill-ups, litres, cost, km, consumption against rated, cost per km), maintenance
        (per vehicle: repairs completed by type, still open at the month's end, labour, cost), cost (per vehicle: km,
        fuel and repair cost, cost per km), trips (every trip scheduled in the month, with vehicle, driver, times,
        distances and whether it ended on time) and drivers (trips, km, driving time, on-time share, speeding and
        idling flags, incidents). Live from the analytics views on the read replica (docs/reports.md). Values are
        integers in base units (ml, cents, metres, minutes); the CSV and PDF write them in litres, birr, km and
        hours, Addis Ababa time, with a totals row. For a caller who also holds tracking:read, drivers starts with
        rank and gains score (0 to 100, or the reason there is none: "Not enough trips"), in rank order
        (FMS-146, docs/analytics.md); without it, neither column, most trips first. Needs analytics:read; a driver
        sees nothing.
      parameters:
        - name: report
          in: path
          required: true
          schema: { type: string, enum: [fuel, maintenance, cost, trips, drivers] }
        - { name: month, in: query, description: 'An Addis Ababa month, YYYY-MM. Default: this month, up to now.', schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { name: depot_id, in: query, description: 'One of the caller''s depots; an unknown or other depot gives an empty report.', schema: { type: string, format: uuid } }
        - { name: format, in: query, description: 'json (default) for the screen; csv or pdf to download, as an attachment named for the report, month and depot.', schema: { type: string, enum: [json, csv, pdf], default: json } }
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Report' }
                  meta:
                    type: object
                    required: [data_freshness, request_id]
                    properties:
                      data_freshness: { $ref: '#/components/schemas/DataFreshness' }
                      request_id: { type: string }
            text/csv:
              schema: { type: string, description: 'A header row, the rows and a totals row; CRLF; UTF-8 with a byte-order mark.' }
            application/pdf:
              schema: { type: string, format: binary, description: 'Landscape A4, the header repeated on each page, totals on the last.' }
        '400':
          description: VALIDATION_FAILED (month not YYYY-MM or not yet begun, an unknown format, or an unknown query parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /analytics/downtime:
    get:
      tags: [Analytics]
      operationId: getDowntimeAnalytics
      summary: Availability, MTBF and MTTR for a month (FMS-131)
      description: >
        For the fleet, each depot and each vehicle in the caller's scope, worst availability first: time in the
        fleet that month (from registration to retirement), time down, availability (up over in the fleet, to a
        tenth of a percent), failures (unplanned periods begun in the month) and MTBF (time up per failure), repairs
        (unplanned periods ended in the month) and MTTR (their whole length per repair), and downtime by reason.
        Whole minutes. Unplanned is unplanned_repair, breakdown or accident. Live from the downtime periods on the
        read replica, not from analytics_cache (docs/downtime.md). Needs analytics:read.
      parameters:
        - { name: month, in: query, description: 'An Addis Ababa month, YYYY-MM. Default: this month, up to now.', schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { name: depot_id, in: query, description: 'One of the caller''s depots; an unknown or other depot gives nothing.', schema: { type: string, format: uuid } }
        - { name: vehicle_id, in: query, description: 'One vehicle; one outside the scope gives nothing.', schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The month's KPIs.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [month, fleet, depots, vehicles]
                    properties:
                      month: { type: string, description: YYYY-MM. }
                      fleet:
                        allOf:
                          - $ref: '#/components/schemas/DowntimeKpis'
                          - { type: object, properties: { vehicles: { type: integer, description: Vehicles in the fleet that month. } } }
                      depots:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/DowntimeKpis'
                            - type: object
                              properties:
                                depot_id: { type: string, format: uuid }
                                depot_name: { type: string }
                                vehicles: { type: integer }
                      vehicles:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/DowntimeKpis'
                            - type: object
                              properties:
                                vehicle_id: { type: string, format: uuid }
                                registration_number: { type: string }
                                depot_id: { type: string, format: uuid }
                                depot_name: { type: string }
                                status: { type: string, enum: [active, inactive, maintenance, retired] }
                  meta:
                    type: object
                    required: [request_id, month, from, to, data_freshness]
                    properties:
                      request_id: { type: string, format: uuid }
                      month: { type: string }
                      from: { type: string, format: date-time, description: The month's first midnight in Addis Ababa. }
                      to: { type: string, format: date-time, description: The next month's first midnight, or now for this month. }
                      data_freshness: { $ref: '#/components/schemas/DataFreshness' }
        '400':
          description: VALIDATION_FAILED (month invalid_format, or future_month for a month not yet begun).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /analytics/health-trend:
    get:
      tags: [Analytics]
      operationId: getHealthTrend
      summary: The fleet-wide health score trend (FMS-150)
      description: >
        Each Addis Ababa day of the range, oldest first: the mean health score of the caller's vehicles (or the
        chosen depot's) as the nightly batch stored it (FMS-55), to one decimal, how many were scored, and the share
        of them in the high-risk band (risk_level high, a score of 40 or less), in whole percent. A vehicle scored
        twice in a day counts once, by its later score. A day with no scoring run has every figure null: a gap, not
        a zero. Read from the stored scores on the read replica; nothing is scored on request
        (docs/vehicle-health.md). Needs analytics:read and prediction:read.
      parameters:
        - { name: from, in: query, description: 'An Addis Ababa day. Default: 89 days before to.', schema: { type: string, format: date } }
        - { name: to, in: query, description: 'An Addis Ababa day. Default and latest: today.', schema: { type: string, format: date } }
        - { name: depot_id, in: query, description: 'One of the caller''s depots; an unknown or other depot gives only gaps.', schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One entry per day.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [days]
                    properties:
                      days:
                        type: array
                        items:
                          type: object
                          required: [date, vehicles_scored, mean_health_score, high_risk_pct]
                          properties:
                            date: { type: string, format: date }
                            vehicles_scored: { type: [integer, 'null'] }
                            mean_health_score: { type: [number, 'null'], minimum: 0, maximum: 100 }
                            high_risk_pct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
                  meta:
                    type: object
                    required: [request_id, from, to, days, data_freshness]
                    properties:
                      request_id: { type: string, format: uuid }
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      days: { type: integer }
                      data_freshness: { $ref: '#/components/schemas/DataFreshness' }
        '400':
          description: VALIDATION_FAILED (to before_from, or range_too_long past 366 days).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /analytics/driver-ranking:
    get:
      tags: [Analytics]
      operationId: getDriverRanking
      summary: Drivers ranked by their monthly performance score (FMS-146)
      description: >
        Every driver of the caller's depots (or the one chosen) scored for an Addis Ababa month, highest first, a
        tie ranked by the higher punctuality; drivers equal in both share a rank (1, 2, 2, 4). The score, 0 to 100,
        is the weighted mean of punctuality (on-time share), safety (speeding and idling per 100 km), incidents
        (accidents per 100 km) and DVIR completion (trips with the driver's pre-trip inspection), with the weights of
        the driver_score_weight_* settings; a driver with fewer than min_trips completed trips has no score and is
        counted in unscored (docs/analytics.md). Live from the analytics views on the read replica. Behavioural data:
        needs analytics:read and tracking:read; a driver never sees it.
      parameters:
        - { name: month, in: query, description: 'An Addis Ababa month, YYYY-MM. Default: this month, up to now.', schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { name: depot_id, in: query, description: 'One of the caller''s depots; an unknown or other depot gives nothing.', schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The ranking.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [month, period, depot, weights, drivers, unscored, min_trips, generated_at]
                    properties:
                      month: { type: string, description: YYYY-MM. }
                      period:
                        type: object
                        properties:
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                      depot:
                        type: [object, 'null']
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                          code: { type: string }
                      weights: { $ref: '#/components/schemas/DriverScoreWeights' }
                      drivers:
                        type: array
                        items:
                          type: object
                          required: [driver_id, name, depot, rank, score, components, trips_completed]
                          properties:
                            driver_id: { type: string, format: uuid }
                            name: { type: string }
                            depot: { type: string }
                            rank: { type: integer, minimum: 1 }
                            score: { type: integer, minimum: 0, maximum: 100 }
                            components:
                              type: object
                              description: Each part, 0 to 100; null when it could not be judged (no timed trip, under 10 km).
                              properties:
                                punctuality: { type: [integer, 'null'] }
                                safety: { type: [integer, 'null'] }
                                incidents: { type: [integer, 'null'] }
                                dvir: { type: [integer, 'null'] }
                            trips_completed: { type: integer }
                      unscored: { type: integer, description: Drivers active in the month with no score. }
                      min_trips: { type: integer, description: The completed trips a score needs (3). }
                      generated_at: { type: string, format: date-time }
                  meta:
                    type: object
                    required: [data_freshness, request_id]
                    properties:
                      data_freshness: { $ref: '#/components/schemas/DataFreshness' }
                      request_id: { type: string }
        '400':
          description: VALIDATION_FAILED (month invalid_format, or future_month for a month not yet begun).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /analytics/my-performance:
    get:
      tags: [Analytics]
      operationId: getMyPerformance
      summary: The signed-in driver's own performance score (FMS-146)
      description: >
        The caller's own score for an Addis Ababa month, 0 to 100, and each part with what it was worked out from:
        never another driver's, and no rank. A month with fewer than min_trips completed trips has no score
        (reason not_enough_trips), though its parts are given. Needs trip:execute; 404 for a caller who is not a
        driver.
      parameters:
        - { name: month, in: query, description: 'An Addis Ababa month, YYYY-MM. Default: this month, up to now.', schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: The driver's month.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [month, period, score, reason, min_trips, trips_completed, distance_m, components, generated_at]
                    properties:
                      month: { type: string }
                      period:
                        type: object
                        properties:
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                      score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
                      reason: { type: [string, 'null'], enum: [not_enough_trips, nothing_to_judge, null] }
                      min_trips: { type: integer }
                      trips_completed: { type: integer }
                      distance_m: { type: integer }
                      components:
                        type: object
                        description: Each part's score (0 to 100, null when not judged), its weight, and what it came from.
                        properties:
                          punctuality:
                            type: object
                            properties: { score: { type: [integer, 'null'] }, weight: { type: integer }, trips_timed: { type: integer }, trips_on_time: { type: integer } }
                          safety:
                            type: object
                            properties: { score: { type: [integer, 'null'] }, weight: { type: integer }, speeding: { type: integer }, idling: { type: integer } }
                          incidents:
                            type: object
                            properties: { score: { type: [integer, 'null'] }, weight: { type: integer }, accidents: { type: integer } }
                          dvir:
                            type: object
                            properties: { score: { type: [integer, 'null'] }, weight: { type: integer }, trips_inspected: { type: integer } }
                      generated_at: { type: string, format: date-time }
                  meta:
                    type: object
                    required: [data_freshness, request_id]
                    properties:
                      data_freshness: { $ref: '#/components/schemas/DataFreshness' }
                      request_id: { type: string }
        '400':
          description: VALIDATION_FAILED (month invalid_format or future_month).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vehicles/{vehicle_id}/fuel-summary:
    get:
      tags: [Fuel]
      operationId: getVehicleFuelSummary
      summary: A vehicle's fuel over a period (FMS-41)
      description: >
        The fuel logged and its cost, the completed trips' distance, the rated and the actual efficiency, the
        variance against what the distance needed (as GET /fuel-reconciliation judges it), cost per km, average price
        per litre and the vehicle's open fuel anomalies. The period defaults to the 30 days to now. Needs fuel:read,
        in the caller's depot scope: a vehicle outside it, an id that is not a UUID, and any vehicle for a driver
        (its totals include other drivers' fill-ups) are 404.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - { name: from, in: query, description: 'An instant, or a date (from the start of that Addis Ababa day).', schema: { type: string } }
        - { name: to, in: query, description: 'An instant, or a date (up to the end of that Addis Ababa day).', schema: { type: string } }
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/FuelSummary' }
                  meta:
                    type: object
                    required: [request_id, data_freshness]
                    properties:
                      request_id: { type: string, format: uuid }
                      data_freshness: { $ref: '#/components/schemas/DataFreshness' }
        '400':
          description: VALIDATION_FAILED (a bad date; to before_from; period_too_long).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /incidents:
    post:
      tags: [Incidents]
      operationId: reportIncident
      summary: Report an incident (FMS-38)
      description: >
        The reporter is the caller. Defaults: incident_type other, occurred_at now. A critical incident sets
        the vehicle's maintenance flag in the same transaction and becomes an alert (FMS-92); every one
        publishes IncidentReported. A driver reports as themselves; staff may name a driver (the trip's by
        default). A replay after the Idempotency-Key expired (same reporter, occurred_at and description)
        answers 200 with the original and meta.created false. docs/incidents.md.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [description, severity]
              properties:
                description: { type: string, minLength: 1, maxLength: 2000, description: Trimmed. }
                severity: { type: string, enum: [low, medium, high, critical] }
                incident_type: { type: string, enum: [accident, breakdown, tyre, theft, vandalism, injury, road_hazard, other], default: other }
                vehicle_id: { type: string, format: uuid, description: A live vehicle in the caller's depots. Optional. }
                trip_id: { type: string, format: uuid, description: A trip the caller may see; if it has a vehicle, this one. }
                driver_id: { type: string, format: uuid, description: Staff only; a driver is always themselves. }
                latitude: { type: number, minimum: -90, maximum: 90, description: With longitude, or neither. }
                longitude: { type: number, minimum: -180, maximum: 180 }
                occurred_at: { type: string, format: date-time, description: 'Default now; not in the future (5 minutes of clock drift allowed), not over 30 days ago.' }
      responses:
        '201':
          description: Reported. Location names the incident.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentEnvelope' }
        '200':
          description: The same report was already on file (a late offline replay); meta.created is false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentEnvelope' }
        '400':
          description: >
            VALIDATION_FAILED (a missing description or severity, a field that is not writable, a half location,
            occurred_at in_future or too_old, a vehicle or trip references_missing_record, vehicle_retired,
            trip_vehicle_mismatch, a driver_id from a driver) or VALIDATION_INVALID_ENUM.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: CONFLICT_IDEMPOTENCY_KEY_REUSED or CONFLICT_IDEMPOTENCY_IN_PROGRESS.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    get:
      tags: [Incidents]
      operationId: listIncidents
      summary: Search incidents (FMS-38)
      description: >
        Newest first (occurred_at). A driver sees only the incidents they reported; staff, their depots'
        (an incident no depot owns is seen by those who see every depot).
      parameters:
        - { name: status, in: query, description: 'Comma-separated: open, investigating, resolved, closed.', schema: { type: string } }
        - { name: severity, in: query, description: 'Comma-separated: low, medium, high, critical.', schema: { type: string } }
        - { name: incident_type, in: query, description: 'Comma-separated incident types.', schema: { type: string } }
        - { name: vehicle_id, in: query, schema: { type: string, format: uuid } }
        - { name: driver_id, in: query, description: "The driver involved (FMS-148): the driver's record. Not the reporter. Still within the caller's depots.", schema: { type: string, format: uuid } }
        - { name: from, in: query, description: 'An instant, or a date (from the start of that Addis Ababa day).', schema: { type: string } }
        - { name: to, in: query, description: 'An instant, or a date (up to the end of that Addis Ababa day).', schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of incidents.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Incident' }
                  meta:
                    type: object
                    required: [request_id, page, page_size, total_items, total_pages]
                    properties:
                      request_id: { type: string, format: uuid }
                      page: { type: integer }
                      page_size: { type: integer }
                      total_items: { type: integer }
                      total_pages: { type: integer }
        '400':
          description: VALIDATION_FAILED or VALIDATION_INVALID_ENUM (an unknown status, severity or type; an unknown parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /incidents/{incident_id}:
    get:
      tags: [Incidents]
      operationId: getIncident
      summary: Incident detail (FMS-38)
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: The incident.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Incident' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND (no such incident, or not yours to see).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    patch:
      tags: [Incidents]
      operationId: updateIncident
      summary: Handle an incident (FMS-89)
      description: >
        incident:manage (admin, fleet manager, dispatcher, depot admin; not drivers, who report with incident:write),
        in the caller's depots. Status moves open to investigating, resolved or closed; investigating to resolved or
        closed; resolved back to investigating or to closed; closed is final (409 incident_closed). Resolving or
        closing needs notes, given now or kept from before. The assignee is an active user who holds incident:manage
        and sees the incident's depot. Row-locked; one audited UPDATE; publishes IncidentUpdated (incident.updated on
        the socket, never the notes). A request that changes nothing writes and publishes nothing.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentUpdate' }
      responses:
        '200':
          description: The incident as it is now.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Incident' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: >
            VALIDATION_FAILED: empty_update, an unknown field (not_writable), notes required to resolve or close
            (field notes, reason required), or an assignee who cannot handle this depot's incidents (field
            assigned_to, references_missing_record).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND (no such incident, or outside your depots).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION (reason incident_closed, or incident_<status> for a move the status does not allow).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /maintenance-records/{record_id}/failures:
    post:
      tags: [Maintenance]
      operationId: recordFailure
      summary: Record what failed on a repair (FMS-125)
      description: >
        One failure the repair found: a component and failure mode from the catalogues (docs/maintenance.md),
        whether it was unplanned, and how it was detected. On open or completed work (a failure can be added to
        a finished repair later), never cancelled work. Defaults: detected_by technician, occurred_at the
        repair's opening, odometer_km the repair's. Failures can also be sent as `failures` on
        POST /maintenance-records and POST /maintenance-records/{record_id}/complete; a corrective repair is
        completed only with at least one (400 failure_required). Publishes FailureRecorded on the vehicle's
        aggregate. Needs maintenance:write, in the caller's depots. Audited; a failure is never edited.
      parameters:
        - $ref: '#/components/parameters/MaintenanceRecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FailureInput' }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/FailureEvent' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: >
            VALIDATION_FAILED (a component, failure_mode or detected_by outside the catalogue, no unplanned, an
            unknown field, occurred_at in_future, an incident_id that references_missing_record or is about
            another vehicle: incident_other_vehicle).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND (no such repair, or outside your depots).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION (the repair was cancelled).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /failure-events:
    get:
      tags: [Maintenance]
      operationId: listFailureEvents
      summary: Search recorded failures (FMS-125)
      description: >
        Newest first (occurred_at), in the caller's depots: the fleet's failure history, and the predictive
        model's labels (FMS-52). Needs maintenance:read.
      parameters:
        - { name: vehicle_id, in: query, schema: { type: string, format: uuid } }
        - { name: component, in: query, schema: { $ref: '#/components/schemas/FailureComponent' } }
        - { name: unplanned, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: from, in: query, description: 'An instant, or a date (from the start of that Addis Ababa day).', schema: { type: string } }
        - { name: to, in: query, description: 'An instant, or a date (up to the end of that Addis Ababa day).', schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of failures.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FailureEvent' }
                  meta:
                    type: object
                    required: [request_id, page, page_size, total_items, total_pages]
                    properties:
                      request_id: { type: string, format: uuid }
                      page: { type: integer }
                      page_size: { type: integer }
                      total_items: { type: integer }
                      total_pages: { type: integer }
        '400':
          description: VALIDATION_FAILED (an unknown component, a bad date, an unknown parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /vehicles/{vehicle_id}/service-items:
    get:
      tags: [Maintenance]
      operationId: listVehicleServiceItems
      summary: When each wearing part and fluid was last changed (FMS-52)
      description: >
        Every service item, in a fixed order, with the vehicle's latest completed repair that used a stocked part
        renewing it (inventory_parts.service_item). An item never changed in the system has nulls. Open or cancelled
        work does not count. The predictive model's part history reads this (docs/ml-dataset.md). Needs
        maintenance:read, in the caller's depot scope; a vehicle outside it, or an id that is not a UUID, is a 404.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: The items.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    minItems: 11
                    maxItems: 11
                    items: { $ref: '#/components/schemas/ServiceItem' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /service-programs:
    get:
      tags: [Maintenance]
      operationId: listServicePrograms
      summary: Preventive service programs (FMS-129)
      description: >
        By name. A depot-scoped caller sees the fleet-wide programs and their depot's. Each counts the caller's
        vehicles it covers by status, as last computed. Needs maintenance:read (docs/service-programs.md).
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, retired, all], default: active } }
        - { name: depot_id, in: query, description: "That depot's programs and the fleet-wide ones.", schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of programs.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceProgram' }
                  meta:
                    type: object
                    required: [request_id, page, page_size, total_items, total_pages]
                    properties:
                      request_id: { type: string, format: uuid }
                      page: { type: integer }
                      page_size: { type: integer }
                      total_items: { type: integer }
                      total_pages: { type: integer }
        '400':
          description: VALIDATION_FAILED (a depot outside the scope, an unknown parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Maintenance]
      operationId: createServiceProgram
      summary: Define a preventive service program (FMS-129)
      description: >
        Needs service-program:write (admin, fleet manager, depot admin). depot_id left out is the caller's depot,
        or fleet-wide for one who sees every depot; only such a caller may make a fleet-wide one (403
        fleet_wide_not_allowed). Its vehicles are computed on the same transaction.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ServiceProgramCreate' } } }
      responses:
        '201':
          description: The program.
          headers:
            ETag: { schema: { type: string } }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ServiceProgram' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: 'VALIDATION_FAILED: interval_required, not_below_interval, interval_missing, make required with a model, duplicate_task, a depot outside the scope.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: CONFLICT_DUPLICATE (an active program of that name already applies to the depot).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /service-programs/{program_id}:
    get:
      tags: [Maintenance]
      operationId: getServiceProgram
      summary: A preventive service program (FMS-129)
      description: Needs maintenance:read. Another depot's program is a 404.
      parameters:
        - $ref: '#/components/parameters/ServiceProgramId'
      responses:
        '200':
          description: The program.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ServiceProgram' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Maintenance]
      operationId: updateServiceProgram
      summary: Change, retire or restore a preventive service program (FMS-129)
      description: >
        The fields sent; is_active false retires it (its vehicles are no longer due under it), true restores it.
        An interval changed keeps its lead window while it still fits. Its vehicles are computed again on the
        same transaction. A fleet-wide program is changed only by a caller who sees every depot. If-Match optional.
      parameters:
        - $ref: '#/components/parameters/ServiceProgramId'
        - { name: If-Match, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ServiceProgramUpdate' } } }
      responses:
        '200':
          description: The program.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ServiceProgram' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED, as on create; empty_update.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_DUPLICATE (the name), or CONFLICT_CONCURRENT_MODIFICATION (a stale If-Match).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /service-due:
    get:
      tags: [Maintenance]
      operationId: listServiceDue
      summary: Vehicles' preventive service due (FMS-129)
      description: >
        Each vehicle under each active program covering it, in the caller's depots, most urgent first (then the
        longest at its status). Due and overdue by default. Needs vehicle:read.
      parameters:
        - { name: status, in: query, description: 'Comma-separated: upcoming, due, overdue. Default due,overdue.', schema: { type: string } }
        - { name: vehicle_id, in: query, schema: { type: string, format: uuid } }
        - { name: program_id, in: query, schema: { type: string, format: uuid } }
        - { name: depot_id, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of service due.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceDue' }
                  meta:
                    type: object
                    required: [request_id, page, page_size, total_items, total_pages]
                    properties:
                      request_id: { type: string, format: uuid }
                      page: { type: integer }
                      page_size: { type: integer }
                      total_items: { type: integer }
                      total_pages: { type: integer }
        '400':
          description: VALIDATION_FAILED (an unknown status, a depot outside the scope).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /vehicles/{vehicle_id}/service-due:
    get:
      tags: [Maintenance]
      operationId: listVehicleServiceDue
      summary: One vehicle's preventive service due (FMS-129)
      description: Every active program covering the vehicle, most urgent first. Needs vehicle:read, in the caller's depot scope.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: The vehicle's service due.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ServiceDue' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vehicles/{vehicle_id}/maintenance-risk:
    get:
      tags: [Maintenance]
      operationId: getVehicleMaintenanceRisk
      summary: A vehicle's latest health score and what drives it (FMS-56)
      description: >
        The vehicle's latest prediction from the nightly scoring (FMS-55, docs/ml-scoring.md): health score, risk
        level, failure probability within 30 days, and up to 3 factors (the inputs raising its risk most, largest
        first) with the vehicle's value when scored. Never a new model call. A vehicle never scored has null score
        fields and no factors. stale is true when the score is more than 25 hours old. Needs prediction:read
        (not dispatchers or drivers: they see health_score on the vehicle only), in the caller's depot scope; a
        vehicle outside it, or an id that is not a UUID, is a 404.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: The vehicle's maintenance risk.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/MaintenanceRisk' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /warranties:
    get:
      tags: [Maintenance]
      operationId: listWarranties
      summary: Vehicles' warranties (FMS-133)
      description: >
        The warranties of the caller's vehicles: live ones first, then by end date, the soonest first. Voided
        ones only with include_void=true. Needs maintenance:read (docs/warranties-recalls.md).
      parameters:
        - { name: vehicle_id, in: query, description: "One vehicle's; another depot's vehicle gives an empty page.", schema: { type: string, format: uuid } }
        - { name: include_void, in: query, schema: { type: string, enum: ['true', 'false'], default: 'false' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of warranties.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Warranty' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: VALIDATION_FAILED (an unknown parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Maintenance]
      operationId: createWarranty
      summary: Record a vehicle's warranty (FMS-133)
      description: >
        On the whole vehicle (component null or left out) or one component of the failure catalogue, from a
        start date to an end date, an end odometer or both, whichever comes first. The vehicle's repairs whose
        claim is not yet sent are judged against it at once, on the same transaction. Needs maintenance:write,
        the vehicle in the caller's depots. Audited.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WarrantyCreate' } } }
      responses:
        '201':
          description: The warranty.
          headers:
            ETag: { schema: { type: string } }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Warranty' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: >
            VALIDATION_FAILED (end_required: neither ends_on nor ends_km; references_missing_record: a vehicle
            outside the caller's depots), or VALIDATION_INVALID_DATE_RANGE (before_starts_on).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /warranties/{warranty_id}:
    get:
      tags: [Maintenance]
      operationId: getWarranty
      summary: A warranty (FMS-133)
      description: Needs maintenance:read. Another depot's vehicle's warranty is a 404.
      parameters:
        - $ref: '#/components/parameters/WarrantyId'
      responses:
        '200':
          description: The warranty.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Warranty' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Maintenance]
      operationId: updateWarranty
      summary: Change or void a warranty (FMS-133)
      description: >
        The fields sent; is_active false voids it (entered by mistake, or cancelled). The vehicle's repairs
        whose claim is not yet sent are judged again; a submitted, approved or rejected claim is left as it is.
        Needs maintenance:write. If-Match optional. Audited.
      parameters:
        - $ref: '#/components/parameters/WarrantyId'
        - { name: If-Match, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WarrantyUpdate' } } }
      responses:
        '200':
          description: The warranty.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Warranty' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: As on create; empty_update.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_CONCURRENT_MODIFICATION (a stale If-Match).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /maintenance-records/{record_id}/warranty-claim:
    patch:
      tags: [Maintenance]
      operationId: updateWarrantyClaim
      summary: Move a repair's warranty claim (FMS-133)
      description: >
        claimable to submitted; submitted to approved (amount_cents, the amount recovered, required) or
        rejected; rejected to submitted again. Approved is final. Needs maintenance:write. Audited.
      parameters:
        - $ref: '#/components/parameters/MaintenanceRecordId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WarrantyClaimUpdate' } } }
      responses:
        '200':
          description: The claim.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/WarrantyClaim' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: 'VALIDATION_FAILED: amount_cents required with approved, only_when_approved otherwise.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION (not_claimable, or invalid_transition with allowed_transitions).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /maintenance/{record_id}/warranty-claim:
    patch:
      tags: [Maintenance]
      operationId: updateWarrantyClaimAlias
      summary: Move a repair's warranty claim (FMS-133; the /maintenance alias)
      description: The same as PATCH /maintenance-records/{record_id}/warranty-claim.
      parameters:
        - $ref: '#/components/parameters/MaintenanceRecordId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WarrantyClaimUpdate' } } }
      responses:
        '200':
          description: The claim.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/WarrantyClaim' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: As on /maintenance-records.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: As on /maintenance-records.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /recalls:
    get:
      tags: [Maintenance]
      operationId: listRecalls
      summary: Manufacturer recalls (FMS-133)
      description: Newest first. Each counts the caller's vehicles under it by status. Needs maintenance:read.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of recalls.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Recall' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: VALIDATION_FAILED (an unknown parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Maintenance]
      operationId: createRecall
      summary: Issue a manufacturer recall (FMS-133)
      description: >
        A campaign for a make, model and model years (both ends included). Every vehicle in service of that make
        and model (ignoring case) with a model year in the range is listed as open, on the same transaction; a
        vehicle without a model year is not. Publishes RecallIssued and a VehicleRecallOpened per vehicle (an
        alert for its depot). Needs maintenance:write and a caller who sees every depot (403
        fleet_wide_not_allowed). Audited.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecallCreate' } } }
      responses:
        '201':
          description: The recall.
          headers:
            ETag: { schema: { type: string } }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Recall' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED, or VALIDATION_INVALID_DATE_RANGE (before_year_from).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: CONFLICT_DUPLICATE (a recall with that campaign code, ignoring case).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /recalls/{recall_id}:
    get:
      tags: [Maintenance]
      operationId: getRecall
      summary: A manufacturer recall (FMS-133)
      description: Needs maintenance:read. Its counts are of the caller's vehicles.
      parameters:
        - $ref: '#/components/parameters/RecallId'
      responses:
        '200':
          description: The recall.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Recall' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Maintenance]
      operationId: updateRecall
      summary: Change a manufacturer recall (FMS-133)
      description: >
        The fields sent. A change of make, model or years lists the vehicles it now applies to (VehicleRecallOpened
        each) and drops those it no longer does that are still open with no work order. Needs maintenance:write
        and a caller who sees every depot. If-Match optional. Audited.
      parameters:
        - $ref: '#/components/parameters/RecallId'
        - { name: If-Match, in: header, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecallUpdate' } } }
      responses:
        '200':
          description: The recall.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Recall' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: As on create; empty_update.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_DUPLICATE (the campaign code), or CONFLICT_CONCURRENT_MODIFICATION (a stale If-Match).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /recalls/{recall_id}/vehicles:
    get:
      tags: [Maintenance]
      operationId: listRecallVehicles
      summary: The vehicles under a recall (FMS-133)
      description: Those in the caller's depots, open first, then scheduled, then completed. Needs maintenance:read.
      parameters:
        - $ref: '#/components/parameters/RecallId'
        - { name: status, in: query, description: 'Comma-separated: open, scheduled, completed. Default all.', schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of the recall's vehicles.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RecallVehicle' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: VALIDATION_FAILED (an unknown status).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /recalls/{recall_id}/vehicles/{vehicle_id}:
    patch:
      tags: [Maintenance]
      operationId: updateRecallVehicle
      summary: Schedule or complete a vehicle's recall work (FMS-133)
      description: >
        maintenance_record_id links the work order that carries out the remedy (the vehicle's own, not
        cancelled): the work is scheduled, or completed at once when that work order is. Completing the work
        order completes it; cancelling it puts it back to open. status completed with no work order completes it
        by hand (completed_at, default now); open unlinks the work order. Completed is final (409). Publishes
        VehicleRecallCompleted on completion. Needs maintenance:write, the vehicle in the caller's depots. Audited.
      parameters:
        - $ref: '#/components/parameters/RecallId'
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecallVehicleUpdate' } } }
      responses:
        '200':
          description: The vehicle's recall work.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/RecallVehicle' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: 'VALIDATION_FAILED: maintenance_record_id required to schedule, or not the vehicle''s; completed_at in_future; empty_update.'
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION (recall_completed).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /vehicles/{vehicle_id}/recalls:
    get:
      tags: [Maintenance]
      operationId: listVehicleRecalls
      summary: One vehicle's recalls (FMS-133)
      description: Every recall the vehicle is under, open first. Needs maintenance:read, the vehicle in the caller's depots.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: The vehicle's recalls.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RecallVehicle' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /maintenance-predictions/{prediction_id}/feedback:
    post:
      tags: [Maintenance]
      operationId: recordPredictionFeedback
      summary: Say what an inspection of a flagged vehicle found (FMS-128)
      description: >
        A technician records the outcome of inspecting the vehicle a prediction flagged: confirmed_issue,
        no_issue_found, already_fixed or not_inspected. A confirmed issue may name the component found and the
        failure record (FMS-125) it led to (the same vehicle's; the component defaults to the failure's and may
        not contradict it); the other outcomes carry neither. One feedback per prediction. The prediction must be
        on a vehicle in the caller's depots (anything else, an unscored row included, is a 404) and may be a
        superseded one. Needs prediction:read and maintenance:write (technicians, depot admins, fleet managers,
        admins). Publishes PredictionFeedbackRecorded. Audited. The confirmed share of a model version's
        high-risk predictions is on GET /ml-models.
      parameters:
        - $ref: '#/components/parameters/PredictionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome]
              properties:
                outcome: { $ref: '#/components/schemas/PredictionOutcome' }
                component: { type: [string, 'null'], enum: [engine, cooling, brakes, tyres, transmission, electrical, suspension, steering, fuel_system, exhaust, body, other, null], description: Only for a confirmed issue. }
                failure_event_id: { type: [string, 'null'], format: uuid, description: The failure record the issue led to; only for a confirmed issue. }
                comment: { type: [string, 'null'], maxLength: 1000, description: Trimmed. }
      responses:
        '201':
          description: Recorded. Location names the feedback.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/PredictionFeedback' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: >
            VALIDATION_FAILED (a field that is not writable; component or failure_event_id only_for_confirmed_issue;
            failure_event_id references_missing_record or failure_other_vehicle; component_mismatch) or
            VALIDATION_INVALID_ENUM (an unknown outcome or component).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_DUPLICATE (reason already_recorded; record_id is the feedback already given, by anyone).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    patch:
      tags: [Maintenance]
      operationId: editPredictionFeedback
      summary: Change feedback you gave, within 7 days (FMS-128)
      description: >
        Only the technician who gave the feedback, and only for 7 days after they gave it. Send the fields to
        change, at least one; null clears a component, a failure link or a comment. Changing the outcome to
        anything but a confirmed issue drops the component and the failure link. A request that changes nothing
        writes and publishes nothing. Needs prediction:read and maintenance:write. Publishes
        PredictionFeedbackRecorded with edited true. Audited.
      parameters:
        - $ref: '#/components/parameters/PredictionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                outcome: { $ref: '#/components/schemas/PredictionOutcome' }
                component: { type: [string, 'null'], enum: [engine, cooling, brakes, tyres, transmission, electrical, suspension, steering, fuel_system, exhaust, body, other, null] }
                failure_event_id: { type: [string, 'null'], format: uuid }
                comment: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: The feedback after the change.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/PredictionFeedback' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: As POST, or VALIDATION_FAILED reason empty_update.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: FORBIDDEN_INSUFFICIENT_ROLE (the role lacks the permission, or reason not_author).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: NOT_FOUND (no such prediction in the caller's depots, or it has no feedback yet).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION, reason edit_window_closed (more than 7 days since it was given).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /ml-models:
    get:
      tags: [Maintenance]
      operationId: listMlModels
      summary: The model registry (FMS-127)
      description: >
        Every predictive maintenance model version the ML service has served, newest first by when the scoring job
        first saw it, with its inputs, the SHA-256 of the feature spec it was trained on, metrics, training data and
        artefact checksum. features_match false means its inputs are not the ones the core computes: it can never
        score. feedback is how its high-risk predictions fared when technicians inspected the vehicles (FMS-128).
        Registration is the scoring job's alone (docs/ml-model-registry.md). Needs prediction:read.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [registered, active, retired] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of models.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MlModel' }
                  meta:
                    type: object
                    required: [request_id, page, page_size, total_items, total_pages]
                    properties:
                      request_id: { type: string, format: uuid }
                      page: { type: integer }
                      page_size: { type: integer }
                      total_items: { type: integer }
                      total_pages: { type: integer }
        '400':
          description: VALIDATION_FAILED (an unknown status, an unknown parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /ml-models/{model_id}:
    get:
      tags: [Maintenance]
      operationId: getMlModel
      summary: One registered model (FMS-127)
      description: The model behind a prediction's model_name and model_version. Needs prediction:read; an unknown id, or one that is not a UUID, is a 404.
      parameters:
        - $ref: '#/components/parameters/MlModelId'
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/MlModel' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ml-models/{model_id}/activate:
    post:
      tags: [Maintenance]
      operationId: activateMlModel
      summary: Let a registered model score (FMS-127)
      description: >
        Makes the model the active one of its name, so the nightly scoring scores with it while the ML service
        serves it, and retires the model that was active. Activating the active model changes nothing; a retired
        model may be activated again (a rollback). A model whose feature spec hash is not the core's is refused.
        Each change is audited. Needs ml-model:activate (administrators).
      parameters:
        - $ref: '#/components/parameters/MlModelId'
      responses:
        '200':
          description: The model, now active.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/MlModel' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION, reason feature_spec_mismatch (trained on other inputs than the core computes).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: The caller's in-app inbox (FMS-48)
      description: >
        The caller's own in-app notifications, newest first; nobody else's, whatever the role. Needs notification:read,
        which every role holds. The inbox is the last 30 days: older notifications are not listed or counted.
        meta.unread_count is the whole inbox's, whatever the filter. docs/alerts.md.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [all, unread, read], default: all } }
        - { name: type, in: query, description: 'Comma-separated notification types, e.g. alert,alert_escalated.', schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of the caller's notifications.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta:
                    type: object
                    required: [request_id, page, page_size, total_items, total_pages, unread_count]
                    properties:
                      request_id: { type: string, format: uuid }
                      page: { type: integer }
                      page_size: { type: integer }
                      total_items: { type: integer }
                      total_pages: { type: integer }
                      unread_count: { type: integer, minimum: 0 }
        '400':
          description: VALIDATION_FAILED (an unknown status, a bad type, an unknown parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: readAllNotifications
      summary: Mark all of the caller's notifications read (FMS-48)
      description: >
        Marks the caller's unread in-app notifications read; nobody else's. With none unread it changes nothing.
        Safe to repeat. Takes no body.
      responses:
        '200':
          description: How many it marked.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [updated]
                    properties:
                      updated: { type: integer, minimum: 0 }
                  meta:
                    type: object
                    required: [request_id, unread_count]
                    properties:
                      request_id: { type: string, format: uuid }
                      unread_count: { type: integer, enum: [0] }
        '400':
          description: VALIDATION_FAILED (a body was sent).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notifications/channels:
    get:
      tags: [Notifications]
      operationId: getNotificationChannels
      summary: Which alerts reach the caller on which channel (FMS-93)
      description: >
        The channel rules by severity, limited to the channels that are on (a channel is on when an active
        notification provider delivers it), and where the caller is reached: their own email address and phone
        number, and how many browsers they turned push on in. For the settings screen.
      responses:
        '200':
          description: The rules and the caller's channels.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/NotificationChannels' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notifications/push/subscriptions:
    post:
      tags: [Notifications]
      operationId: subscribeToPush
      summary: Turn push on for this browser (FMS-93)
      description: >
        Saves the browser's Web Push subscription (`PushSubscription.toJSON()`) for the caller. The endpoint must be
        an https address of a browser push service. A browser has one owner: if another account had this endpoint, it
        moves to the caller. 201 when new, 200 when it was already saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionInput' }
      responses:
        '200':
          description: Already saved for the caller.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [id, created_at]
                    properties:
                      id: { type: string, format: uuid }
                      created_at: { type: string, format: date-time }
                  meta: { $ref: '#/components/schemas/Meta' }
        '201':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [id, created_at]
                    properties:
                      id: { type: string, format: uuid }
                      created_at: { type: string, format: date-time }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (not a subscription, keys of the wrong size, or an endpoint that is not a push service's https address; reason not_https, unknown_push_service, credentials_in_url, not_a_url).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: UPSTREAM_UNAVAILABLE (push is not set up on this server).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /notifications/push/unsubscribe:
    post:
      tags: [Notifications]
      operationId: unsubscribeFromPush
      summary: Turn push off for this browser (FMS-93)
      description: Removes the caller's subscription with this endpoint; another account's is left alone. Safe to repeat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [endpoint]
              properties:
                endpoint: { type: string, maxLength: 2048 }
      responses:
        '200':
          description: How many it removed (0 or 1).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [removed]
                    properties:
                      removed: { type: integer, minimum: 0 }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notifications/push/test:
    post:
      tags: [Notifications]
      operationId: testPush
      summary: Send a test push to each of the caller's browsers (FMS-93)
      description: Sends now, not through the queue, and reports how many the push services took. Takes no body.
      responses:
        '200':
          description: The caller's devices and how many took the push.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [devices, sent, failed]
                    properties:
                      devices: { type: integer, minimum: 0 }
                      sent: { type: integer, minimum: 0 }
                      failed: { type: integer, minimum: 0 }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (a body was sent).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: UPSTREAM_UNAVAILABLE (push is not set up on this server).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /notifications/{notification_id}/read:
    patch:
      tags: [Notifications]
      operationId: readNotification
      summary: Mark one notification read (FMS-48)
      description: >
        Marks one of the caller's notifications read. One already read answers 200 unchanged and writes nothing, so
        it is safe to repeat. Takes no body.
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: The notification, and the caller's unread count after it.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Notification' }
                  meta:
                    type: object
                    required: [request_id, unread_count]
                    properties:
                      request_id: { type: string, format: uuid }
                      unread_count: { type: integer, minimum: 0 }
        '400':
          description: VALIDATION_FAILED (a body was sent).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND (no such notification, or it is someone else's; the answer is the same for both).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /settings:
    get:
      tags: [Settings]
      operationId: listSettings
      summary: Every setting's value, default and range (FMS-80)
      description: >
        The thresholds an administrator tunes without a code change. Any signed-in user reads them: screens draw
        their lines from them (the health score's alert line).
      responses:
        '200':
          description: Every setting, in a fixed order.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Setting' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Settings]
      operationId: updateSettings
      summary: Change settings (FMS-80)
      description: >
        One or more settings, each a whole number within its range, or null to go back to the default (sending
        the default does the same). All are checked before any is written, and written in one transaction, each
        an audited change. Takes effect within a minute. The four driver_score_weight_* (FMS-146) may each be 0 but
        not all of them (all_zero). Needs settings:write (admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                fuel_variance_threshold_pct: { type: [integer, 'null'], minimum: 1, maximum: 100 }
                health_alert_below: { type: [integer, 'null'], minimum: 50, maximum: 84 }
                expiry_warning_days: { type: [integer, 'null'], minimum: 8, maximum: 180 }
                driver_score_weight_punctuality: { type: [integer, 'null'], minimum: 0, maximum: 100, description: 'Default 35.' }
                driver_score_weight_safety: { type: [integer, 'null'], minimum: 0, maximum: 100, description: 'Default 35.' }
                driver_score_weight_incidents: { type: [integer, 'null'], minimum: 0, maximum: 100, description: 'Default 20.' }
                driver_score_weight_dvir: { type: [integer, 'null'], minimum: 0, maximum: 100, description: 'Default 10.' }
      responses:
        '200':
          description: Every setting, after the change.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Setting' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (out_of_range per field, an unknown key, a fraction, an empty body).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /settings/telemetry-rules:
    get:
      tags: [Settings]
      operationId: getRuleThresholds
      summary: The speeding, idling and route deviation thresholds (FMS-46, FMS-80, FMS-90)
      description: The fleet's, and each depot's that replace them for its vehicles. Any signed-in user.
      responses:
        '200':
          description: The thresholds.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/RuleThresholdList' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /settings/telemetry-rules/fleet:
    put:
      tags: [Settings]
      operationId: setFleetRuleThresholds
      summary: Set the fleet's speeding, idling and route deviation thresholds (FMS-80, FMS-90)
      description: The four speeding and idling values, and route deviation's if they change; audited; the rules use them within a minute. Needs settings:write (admin).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RuleThresholds' } } }
      responses:
        '200':
          description: Every threshold row, after the change.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/RuleThresholdList' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (a value out of range or missing).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /settings/telemetry-rules/depots/{depot_id}:
    parameters:
      - { name: depot_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Settings]
      operationId: setDepotRuleThresholds
      summary: Set a depot's own speeding, idling and route deviation thresholds (FMS-80, FMS-90)
      description: Creates or replaces the depot's row, which replaces the fleet's for its vehicles; audited. Needs settings:write (admin).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RuleThresholds' } } }
      responses:
        '200':
          description: Every threshold row, after the change.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/RuleThresholdList' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (a value out of range or missing).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Settings]
      operationId: removeDepotRuleThresholds
      summary: Put a depot back on the fleet's thresholds (FMS-80)
      description: Deletes the depot's own row (the audit keeps it). Needs settings:write (admin).
      responses:
        '204': { description: The depot follows the fleet's thresholds again. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND (an unknown or deactivated depot, or one without its own thresholds).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /auth/me/photo:
    put:
      tags: [Photos]
      operationId: setOwnPhoto
      summary: Set your own photo
      description: >
        Any signed-in user, every role. Replaces the previous one. Audited (photo.updated).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'JPEG, PNG or WebP (by its bytes), 2 MB at most.' }
      responses:
        '200':
          description: The photo's new URL.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/PhotoUrl' }
                  meta: { type: object, properties: { request_id: { type: string, format: uuid } } }
        '400':
          description: VALIDATION_FAILED (no file part, or a malformed body).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413':
          description: PAYLOAD_TOO_LARGE, over 2 MB.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE, not a JPEG, PNG or WebP image.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      tags: [Photos]
      operationId: removeOwnPhoto
      summary: Remove your own photo
      responses:
        '204':
          description: Removed (or there was none); the screens show the placeholder.
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /users/{user_id}/photo:
    get:
      tags: [Photos]
      operationId: getUserPhoto
      summary: A user's photo
      description: >
        The caller's own, or anyone's for a caller with users:read or driver:read; 404 otherwise, as for no photo.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: v, in: query, description: The photo's version, from photo_url; any value serves the current photo., schema: { type: string } }
      responses:
        '200':
          description: The image, cached privately for a day (its URL changes with the photo).
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Photos]
      operationId: setUserPhoto
      summary: Set a user's photo
      description: >
        Needs users:write (admin). Audited as the admin's.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'JPEG, PNG or WebP (by its bytes), 2 MB at most.' }
      responses:
        '200':
          description: The photo's new URL.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/PhotoUrl' }
                  meta: { type: object, properties: { request_id: { type: string, format: uuid } } }
        '400':
          description: VALIDATION_FAILED (no file part, or a malformed body).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: PAYLOAD_TOO_LARGE, over 2 MB.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE, not a JPEG, PNG or WebP image.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      tags: [Photos]
      operationId: removeUserPhoto
      summary: Remove a user's photo
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Removed (or there was none); the screens show the placeholder.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

