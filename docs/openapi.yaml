                  data:
                    type: object
                    required: [open, raised, by_type, acknowledged, mean_minutes_to_acknowledge, daily]
                    properties:
                      open: { type: object, description: 'Open and acknowledged now: low, medium, high, critical, total.' }
                      raised: { type: object, description: 'Raised in the range: low, medium, high, critical, total.' }
                      by_type: { type: array, items: { type: object, properties: { alert_type: { type: string }, count: { type: integer } } } }
                      acknowledged: { type: integer }
                      mean_minutes_to_acknowledge: { type: [integer, 'null'] }
                      daily: { type: array, items: { type: object, properties: { date: { type: string, format: date }, raised: { type: integer } } } }
                  meta: { $ref: '#/components/schemas/AnalyticsMeta' }
