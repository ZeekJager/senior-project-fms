  /inventory:
    get:
      tags: [Inventory]
      operationId: listInventoryParts
      summary: Spare parts (FMS-23)
      description: >
        Needs inventory:read (a driver gets 403). The same list as GET /inventory/parts. below_reorder true lists
        parts at or below their reorder threshold; belowReorder is the same filter under the card's name. Stock
        shared by every depot has a null depot_id. api-contract §10.1.
      parameters:
        - { name: depot_id, in: query, schema: { type: string, format: uuid } }
        - { name: below_reorder, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: belowReorder, in: query, description: The card's name for below_reorder., schema: { type: string, enum: ['true', 'false'] } }
        - { name: stock_status, in: query, schema: { type: string, enum: [out, low, ok] } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, all], default: active } }
        - { name: sort_by, in: query, schema: { type: string, enum: [part_number, name, stock_quantity], default: part_number } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of parts.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InventoryPart' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: VALIDATION_FAILED (an unknown parameter or value).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Inventory]
      operationId: createInventoryPart
      summary: Add a spare part (FMS-23)
      description: >
        Needs inventory:write. Part numbers are stored trimmed and in upper case. Opening stock is optional. Only a fleet-wide role can create shared stock (no depot_id); anyone else names a
        depot of theirs. Money is whole cents. Publishes InventoryPartCreated. Audited. Location names the part.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/InventoryPartFields'
                - type: object
                  required: [part_number, name]
                  properties:
                    stock_quantity: { type: integer, minimum: 0, maximum: 1000000, description: Opening stock. }
      responses:
        '201':
          description: Added.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/InventoryPart' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (depot_id references_missing_record; a field that is not writable) or VALIDATION_FLOAT_IN_MONEY_PATH.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: FORBIDDEN_INSUFFICIENT_ROLE (the permission, or shared stock without a fleet-wide role).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: CONFLICT_DUPLICATE (the part number is taken).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /inventory/parts:
    get:
      tags: [Inventory]
      operationId: listInventoryPartsCanonical
      summary: Spare parts (FMS-23)
