openapi: 3.1.0
info:
  title: Fleet Management System API
  version: 1.0.0
  description: >
    The contract of the Fleet Management System API (api-contract §24). Every route the API mounts is described
    here, and CI fails on one that is not (test/integration/openapi.test.ts); that the responses are what this file
    says is checked against the real API (test/integration/contract.test.ts). docs/api-contract.md stays the full
    reference for the rules behind the operations.

    To try it from /api-docs (served outside production): call POST /auth/login first. The session is an HttpOnly
    cookie the browser keeps and sends with the calls that follow; there is no token to paste.

    Writes made with the session cookie must come from this site and send the CSRF token the sign-in set, as an
    X-CSRF-Token header equal to the fms_csrf cookie; otherwise 403 FORBIDDEN_CSRF (api-contract §21, docs/security.md).
    Every call is rate limited by kind of client; over a limit it is 429 RATE_LIMITED with Retry-After (api-contract §20).
    The "Try it out" button on /api-docs sends the token for you.

    The ML service's internal endpoints belong to that service and are not part of this API.
servers:
  - url: /api/v1
security:
  - session: []

tags:
  - name: Trips
  - name: Routes
  - name: Inspections
  - name: Backups
  - name: Photos
  - name: Auth
  - name: Users
  - name: Depots
  - name: Drivers
  - name: Documents
  - name: Inventory
  - name: Audit
  - name: Health
  - name: Vehicles
  - name: Dispatch
  - name: Attendance
  - name: Integrations
  - name: Tracking
  - name: Geofences
  - name: Command center
  - name: Fuel
  - name: Alerts
  - name: Incidents
  - name: Maintenance
  - name: Notifications
  - name: Analytics
  - name: Settings
  - name: System

paths:
  /trips:
    get:
      tags: [Trips]
      operationId: listTrips
      summary: Trip history, newest first (FMS-30)
      description: >
        Needs trip:read. Staff see their depots' trips and a driver only their own. Keyset paging: pass the
        previous page's meta.next_cursor as cursor; next_cursor is null on the last page. A filter that names
        something unknown or outside the caller's scope matches nothing: an empty page, not an error. A date
        in from or to means that Addis Ababa day (UTC+3); `to` covers the whole day. api-contract §7.2.
      parameters:
        - { name: status, in: query, description: 'One status or several, comma-separated: scheduled,assigned.', schema: { type: string } }
        - { name: driver_id, in: query, schema: { type: string, format: uuid } }
        - { name: vehicle_id, in: query, schema: { type: string, format: uuid } }
        - { name: route_id, in: query, schema: { type: string, format: uuid } }
        - { name: depot_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, description: A date or an instant (with offset)., schema: { type: string } }
        - { name: to, in: query, description: 'A date or an instant (with offset); must be after from.', schema: { type: string } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200':
          description: A page of trips.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Trip' }
                  meta:
                    type: object
                    required: [page_size, next_cursor, request_id]
                    properties:
                      page_size: { type: integer }
                      next_cursor: { type: [string, 'null'] }
                      request_id: { type: string, format: uuid }
        '400':
          description: >
            VALIDATION_FAILED (an unknown parameter, a bad status or date, an invalid_cursor) or
            VALIDATION_INVALID_DATE_RANGE (to not after from).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Trips]
      operationId: createTrip
      summary: Create a trip, from a saved route or a one-off route (FMS-30, FMS-139)
      description: >
        Needs trip:write. route_id names an active route in the caller's depots; or route describes a
        one-off trip, saved as a route of its own (is_adhoc) in depot_id (default: a depot-scoped caller's
        own depot). Without scheduled_end the trip ends the route's estimated time after its start. The trip
        starts scheduled, without driver or vehicle, and copies the route's plan. Publishes TripCreated.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scheduled_start]
              description: Exactly one of route_id and route.
              properties:
                route_id: { type: string, format: uuid }
                route:
                  type: object
                  additionalProperties: false
                  required: [origin_name, destination_name]
                  properties:
                    origin_name: { type: string, minLength: 1, maxLength: 120 }
                    origin: { $ref: '#/components/schemas/NullablePoint' }
                    destination_name: { type: string, minLength: 1, maxLength: 120 }
                    destination: { $ref: '#/components/schemas/NullablePoint' }
                    stops:
                      type: array
                      maxItems: 25
                      items:
                        type: object
                        additionalProperties: false
                        required: [name]
                        properties:
                          name: { type: string, minLength: 1, maxLength: 120 }
                          latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
                          longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
                depot_id: { type: string, format: uuid, description: The depot a one-off trip leaves from. }
                scheduled_start: { type: string, format: date-time }
                scheduled_end: { type: string, format: date-time, description: Default the route's estimated time after the start. }
                cargo_weight_kg: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 100000, description: 'What it carries, kg (FMS-153, docs/job-load.md): optional, two decimals.' }
                cargo_kind: { $ref: '#/components/schemas/CargoKind' }
      responses:
        '201':
          description: Created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Trip' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: >
            VALIDATION_FAILED (both or neither of route_id and route; an unknown or retired route; a depot
            outside the caller's; no end and no estimated time) or VALIDATION_INVALID_DATE_RANGE.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /trips/{trip_id}:
    get:
      tags: [Trips]
      operationId: getTrip
      summary: One trip (FMS-30)
      description: Needs trip:read. A trip outside the caller's depots, or another driver's, is 404. The ETag is the version.
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: The trip.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Trip' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Trips]
      operationId: updateTrip
      summary: Reschedule or cancel a trip (FMS-30, FMS-139)
      description: >
        Needs trip:write. Moves an open trip's times, or only the end of one en route; cancels with
        status cancelled. Once assigned or en route a time change needs a reason (kept on TripUpdated) and
        may not overlap the driver's or vehicle's other trips: 409 naming that trip, with shiftable and
        shift_minutes; sent again with shift_following, that trip and any it then runs into move later
        (at most 20), all in one transaction. Publishes TripUpdated (one per moved trip, with
        shifted_by_trip_id) or TripCancelled.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                scheduled_start: { type: string, format: date-time }
                scheduled_end: { type: string, format: date-time }
                status: { const: cancelled }
                reason: { type: string, minLength: 1, maxLength: 500 }
                shift_following:
                  type: boolean
                  description: Move the trips this change runs into later, instead of refusing.
                cargo_weight_kg:
                  type: [number, 'null']
                  exclusiveMinimum: 0
                  maximum: 100000
                  description: >
                    FMS-153, before the trip starts; null clears it. More than the assigned vehicle's payload_capacity_kg
                    is 400 (over_payload).
                cargo_kind: { $ref: '#/components/schemas/CargoKind' }
      responses:
        '200':
          description: Changed. meta.shifted lists the trips moved later to make room.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Trip' }
                  meta:
                    type: object
                    required: [request_id, shifted]
                    properties:
                      request_id: { type: string, format: uuid }
                      shifted:
                        type: array
                        items:
                          type: object
                          required: [trip_id, scheduled_start, scheduled_end]
                          properties:
                            trip_id: { type: string, format: uuid }
                            scheduled_start: { type: string, format: date-time }
                            scheduled_end: { type: string, format: date-time }
        '400':
          description: >
            VALIDATION_FAILED (an empty change; a reason missing; a new start for a trip under way) or
            VALIDATION_INVALID_DATE_RANGE (an end at or before the start, or before an en-route trip's
            actual start).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            CONFLICT_CONCURRENT_MODIFICATION, CONFLICT_INVALID_STATE_TRANSITION (a closed trip, or more than
            20 trips to move), CONFLICT_DRIVER_OVERLAP or CONFLICT_VEHICLE_OVERLAP (record_id, shiftable,
            shift_minutes).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /routes:
    get:
      tags: [Routes]
      operationId: listRoutes
      summary: Routes (FMS-83)
      description: >
        Needs route:read. Depot scope applies: a depot's dispatcher never sees another depot's routes. The
        default list is the active routes (the ones offered for new trips); status retired lists the retired,
        all both. search matches name, origin and destination. api-contract §7.1.
      parameters:
        - { name: depot_id, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, retired, all], default: active } }
        - { name: sort_by, in: query, schema: { type: string, enum: [name, distance_km, updated_at], default: name } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of routes.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Route' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: VALIDATION_FAILED, or VALIDATION_INVALID_ENUM (an unknown status or sort).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Routes]
      operationId: createRoute
      summary: Create a route (FMS-83)
      description: >
        Needs route:write (admin, fleet manager, dispatcher, depot admin). The depot is required and must be one
        of the caller's. Active route names are unique within a depot, case-insensitively. The distance is
        entered by hand until the mapping adapter measures it. Publishes RouteCreated. Audited. Location names
        the route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RouteFields'
                - type: object
                  required: [name, depot_id]
      responses:
        '201':
          description: Created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Route' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: >
            VALIDATION_FAILED (a required field missing; depot_id references_missing_record; a coordinate out of
            range, incomplete_coordinates or too_many_decimals; too many stops).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: CONFLICT_DUPLICATE (the depot already has an active route with this name).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /routes/{route_id}:
    get:
      tags: [Routes]
      operationId: getRoute
      summary: One route (FMS-83)
      description: Needs route:read. A route outside the caller's depots is 404. The ETag is the version.
      parameters:
        - $ref: '#/components/parameters/RouteId'
      responses:
        '200':
          description: The route.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Route' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Routes]
      operationId: updateRoute
      summary: Change or retire a route (FMS-83)
      description: >
        Needs route:write. Send the fields to change, at least one; null clears an origin, a destination, the
        distance or the duration. is_active false retires the route: past trips keep pointing at it, it is no
        longer offered for new ones and its name is free again; bringing it back can collide on the name. A
        request that changes nothing writes and publishes nothing. Send If-Match to refuse a stale write.
        Publishes RouteUpdated with changed_fields. Audited.
      parameters:
        - $ref: '#/components/parameters/RouteId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/RouteFields'
                - type: object
                  minProperties: 1
                  properties:
                    is_active: { type: boolean, description: False retires the route. }
      responses:
        '200':
          description: The route after the change.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Route' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: >
            VALIDATION_FAILED (an empty_update; a field that is not writable, geometry included; a null
            depot_id; the same coordinate rules as creating).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_CONCURRENT_MODIFICATION (a stale If-Match) or CONFLICT_DUPLICATE (the name is taken by an active route).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /dvir-reports:
    post:
      tags: [Inspections]
      operationId: submitDvir
      summary: Submit a vehicle inspection (FMS-36)
      description: >
        Needs dvir:write (drivers, technicians, depot admins, fleet managers, admins). A driver submits their own
        (driver_id is not writable for them); everyone else must name the driver. items is the checklist and a
        failed item is a defect: any defect forces issues_found true, flags the vehicle for maintenance in the same
        transaction and publishes VehicleFaultDetected. submitted_at is when the driver pressed submit, so an
        inspection queued offline keeps its time (not in the future, not over 30 days old). A trip's inspection of
        one type is recorded once: submitting it again answers 200 with the original and meta.created false.
        Publishes nothing else. api-contract §6.4.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DvirInput' }
      responses:
        '201': { $ref: '#/components/responses/DvirRecorded' }
        '200': { $ref: '#/components/responses/DvirRecorded' }
        '400':
          description: >
            VALIDATION_FAILED (vehicle, trip or driver references_missing_record; vehicle_retired;
            trip_vehicle_mismatch; driver required, not_writable or no_driver_profile; submitted_at in_future or
            too_old; a duplicate_item), or VALIDATION_INVALID_ENUM (an unknown type).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: CONFLICT_IDEMPOTENCY_KEY_REUSED or CONFLICT_IDEMPOTENCY_IN_PROGRESS.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /vehicles/{vehicle_id}/dvir-reports:
    get:
      tags: [Inspections]
      operationId: listVehicleDvirReports
      summary: A vehicle's inspection history (FMS-36)
      description: >
        Needs dvir:read. A driver sees only their own reports; a vehicle outside the caller's depots is 404. Newest
        first by submitted_at (sort_order asc for oldest first). A date in from or to means that Addis Ababa day
        (UTC+3).
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - { name: type, in: query, schema: { type: string, enum: [pre_trip, post_trip, routine, other] } }
        - { name: issues_found, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: from, in: query, description: A date or an instant (with offset)., schema: { type: string } }
        - { name: to, in: query, description: A date or an instant (with offset)., schema: { type: string } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of inspection reports.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DvirReport' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: VALIDATION_FAILED, or VALIDATION_INVALID_ENUM (an unknown type).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /fuel-logs/{fuel_log_id}:
    get:
      tags: [Fuel]
      operationId: getFuelLog
      summary: One fuel log (FMS-39)
      description: Needs fuel:read. Another driver's log, or one outside the caller's depots, is 404, the same as a missing one.
      parameters:
        - $ref: '#/components/parameters/FuelLogId'
      responses:
        '200':
          description: The fuel log.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/FuelLog' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trips/{trip_id}/assign:
    post:
      tags: [Trips]
      operationId: assignTrip
      summary: Assign a driver and vehicle to a trip (FMS-31)
      description: >
        Needs trip:assign (admin, fleet manager, dispatcher; never drivers). Checks, in order:
        the vehicle and driver are in the caller's depots (400); fleet availability (FMS-76), after
        both rows are share-locked: the vehicle and the driver belong to the trip's depot
        (CONFLICT_DEPOT_MISMATCH), the vehicle is not retired or out of service
        (CONFLICT_INVALID_STATE_TRANSITION) and not flagged or in the workshop (BR-2,
        CONFLICT_VEHICLE_FLAGGED); the driver is eligible (CONFLICT_DRIVER_NOT_ELIGIBLE); BR-1 and
        BR-3 overlaps, touching ends included (CONFLICT_DRIVER_OVERLAP, CONFLICT_VEHICLE_OVERLAP); FMS-156
        the driver's daily and weekly load-weighted distance limits (CONFLICT_DRIVER_DISTANCE_LIMIT,
        docs/driving-distance-limits.md). Publishes TripAssigned. Audited.
        FMS-151 (docs/assignment-exceptions.md): a warning the trip's depot sets to approve holds the
        assignment. Without exception_reason it is 409 CONFLICT_APPROVAL_REQUIRED naming each held warning;
        with one, 202 with the request (AssignmentExceptionRequested), and the trip unchanged until a fleet
        manager decides. The safety rules above are never held.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [driver_id, vehicle_id, version]
              properties:
                driver_id: { type: string, format: uuid }
                vehicle_id: { type: string, format: uuid }
                version:
                  type: integer
                  minimum: 0
                  description: The trip's version as the dispatcher saw it.
                exception_reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Why, when a warning needs a fleet manager's approval (FMS-151). Ignored otherwise.
      responses:
        '202':
          description: Held for a fleet manager's approval (FMS-151); the trip is unchanged.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/AssignmentException' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '200':
          description: Assigned (or already assigned to the same pair, unchanged).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Trip' }
                  meta:
                    type: object
                    required: [warnings, request_id]
                    properties:
                      warnings:
                        type: array
                        items: { $ref: '#/components/schemas/AssignmentWarning' }
                      request_id: { type: string, format: uuid }
        '400':
          description: VALIDATION_FAILED (a bad body, or a driver or vehicle outside the caller's depots).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            CONFLICT_CONCURRENT_MODIFICATION, CONFLICT_INVALID_STATE_TRANSITION, CONFLICT_DEPOT_MISMATCH,
            CONFLICT_VEHICLE_FLAGGED, CONFLICT_DRIVER_NOT_ELIGIBLE, CONFLICT_DRIVER_OVERLAP or
            CONFLICT_VEHICLE_OVERLAP. A detail's record_id names the conflicting trip or the open
            maintenance record. CONFLICT_DRIVER_DISTANCE_LIMIT (FMS-156): the trip takes the driver past a
            distance limit; the detail has period, limit_km, total_km and without_trip_km. CONFLICT_APPROVAL_REQUIRED (FMS-151): a held warning and no exception_reason;
            each detail names one (driver_absent, driver_on_leave, driver_sick, or previous_trip_overrun with the
            trip under way as record_id).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /assignment-exceptions/{exception_id}/approve:
    post:
      tags: [Trips]
      operationId: approveAssignmentException
      summary: Approve an assignment held for approval (FMS-151)
      description: >
        Needs assignment-exception:approve (admin, fleet manager), in the trip's depot (else 404), and never by the
        one who asked (403 own_request). Every assignment rule is read again now: a safety rule refuses as an
        assignment would, and a held warning the request did not ask about is 409 CONFLICT_APPROVAL_REQUIRED
        (refuse it; the dispatcher asks again). The trip is assigned to the driver and vehicle asked for:
        TripAssigned with exception_id, and AssignmentExceptionDecided. Audited.
      parameters:
        - $ref: '#/components/parameters/ExceptionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/AssignmentExceptionDecision' }
        '400':
          description: VALIDATION_FAILED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            CONFLICT_INVALID_STATE_TRANSITION (already decided: exception_approved, exception_refused,
            exception_withdrawn; or the trip can no longer be assigned), CONFLICT_APPROVAL_REQUIRED, or any
            refusal of POST /trips/{trip_id}/assign.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /assignment-exceptions/{exception_id}/refuse:
    post:
      tags: [Trips]
      operationId: refuseAssignmentException
      summary: Refuse an assignment held for approval (FMS-151)
      description: >
        Needs assignment-exception:approve, in the trip's depot (else 404). The trip stays as it is; the depot's
        dispatchers are told why (AssignmentExceptionDecided, an alert). Audited.
      parameters:
        - $ref: '#/components/parameters/ExceptionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/AssignmentExceptionDecision' }
        '400':
          description: VALIDATION_FAILED (no reason).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION (already decided).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /trips/{trip_id}/start:
    post:
      tags: [Trips]
      operationId: startTrip
      summary: Start a trip (FMS-32)
      description: >
        assigned → en_route, actual_start now. Needs trip:execute; a driver only on their own trips.
        The assignment rules are read again: a vehicle flagged, in the workshop, out of service, retired or
        in another depot since, or an expired licence, refuse with the assignment's 409s. Another trip of the
        driver or vehicle still under way (PREVIOUS_TRIP_OVERRUN) and the driver's attendance
        (DRIVER_ATTENDANCE) are warnings. Publishes TripStarted.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '200': { $ref: '#/components/responses/TripMoved' }
        '400':
          description: VALIDATION_FAILED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TripMoveRefused' }

  /trips/{trip_id}/end:
    post:
      tags: [Trips]
      operationId: endTrip
      summary: End a trip (FMS-32)
      description: >
        en_route → completed, actual_end now (never before actual_start); the duration is stored. Needs
        trip:execute; a driver only on their own trips. Publishes TripCompleted.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '200': { $ref: '#/components/responses/TripMoved' }
        '400':
          description: VALIDATION_FAILED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TripMoveRefused' }

  /trips/{trip_id}/live:
    get:
      tags: [Trips]
      operationId: getTripLive
      summary: Where a trip stands now (FMS-95)
      description: >
        Needs trip:read; a driver only their own trips, staff in their depot scope (another's trip, or an id that is
        not a UUID, is a 404). While the trip is under way: the vehicle's newest position (stale after 2 minutes
        without one), the next stop not yet reached with its estimate, how many stops are reached and completed, and
        the trip's arrival estimate (FMS-86). For a trip not under way the position is null. docs/trip-stops.md.
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: The trip's live state.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/TripLiveState' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trips/{trip_id}/stops/{stop_id}/complete:
    post:
      tags: [Trips]
      operationId: completeTripStop
      summary: Mark a stop done (FMS-95)
      description: >
        The driver (or dispatch) marks a stop of a trip under way done: status completed, completed_at now and who,
        actual_arrival now if GPS had not seen the vehicle there (so the estimate counts it passed), and the note if
        given. Needs trip:execute; a driver only on their own trips. A stop already completed is 200 with
        meta.changed false and nothing written. Audited; publishes TripStopCompleted, which the console receives as
        trip.updated. docs/trip-stops.md.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: stop_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                notes: { type: string, minLength: 1, maxLength: 500, description: What happened at the stop, for dispatch. }
      responses:
        '200':
          description: The stop as it is now.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/TripStop' }
                  meta:
                    type: object
                    required: [request_id, changed]
                    properties:
                      request_id: { type: string }
                      changed: { type: boolean, description: False when the stop was already completed. }
        '400':
          description: VALIDATION_FAILED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION (reason trip_not_under_way) when the trip is not en_route.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /trips/{trip_id}/status:
    post:
      tags: [Trips]
      operationId: changeTripStatus
      summary: Explicit trip status transition (FMS-32)
      description: >
        en_route is start and completed is end. scheduled (a draft with both times) and cancelled also need
        trip:write, so a driver gets 403 FORBIDDEN_INSUFFICIENT_ROLE. assigned is always 409 (reason
        assign_required): use POST /trips/{trip_id}/assign.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [scheduled, assigned, en_route, completed, cancelled] }
      responses:
        '200': { $ref: '#/components/responses/TripMoved' }
        '400':
          description: VALIDATION_FAILED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TripMoveRefused' }

  /attendance/qr:
    get:
      tags: [Attendance]
      operationId: getAttendanceCode
      summary: The depot's check-in code (FMS-141)
      description: >
        The code the depot screen (S-24) shows as a QR, for drivers to scan with the driver app. HMAC-signed, naming
        the depot and a 30-second window: a new one from refresh_at, each accepted until expires_at (60 s after its
        window began). generated_at is the server's clock, so a screen times its refresh from it. Sent with
        Cache-Control no-store. Needs attendance:qr (admin, fleet manager, dispatcher, depot admin; never drivers).
        The caller's own depot unless depot_id names one in their scope; someone without a depot must name one.
      parameters:
        - { name: depot_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The code now, and the depot's start time and grace.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/AttendanceCode' }
                  meta: { type: object, properties: { request_id: { type: string, format: uuid } } }
        '400':
          description: VALIDATION_FAILED (depot_id required for someone without a depot; references_missing_record for one outside the scope).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /attendance/check-in:
    post:
      tags: [Attendance]
      operationId: checkIn
      summary: Check in or out by scanning the depot's code (FMS-141)
      description: >
        A driver's scan (S-25). The first scan of the day checks them in with the time, present, or late after the
        depot's work_starts_at plus late_after_minutes (Addis Ababa); a record made by hand without a time is
        checked in by it. The next scan, at least 10 minutes later, checks them out. Only the driver's own depot's
        code, and only while it is valid. Audited and published as AttendanceRecorded. Needs attendance:check-in
        (drivers); someone without a driver profile is 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, maxLength: 200, description: The text read from the QR. }
      responses:
        '200':
          description: What the scan did, and the day's record.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [action, attendance]
                    properties:
                      action: { type: string, enum: [checked_in, checked_out] }
                      attendance: { $ref: '#/components/schemas/Attendance' }
                  meta: { type: object, properties: { request_id: { type: string, format: uuid } } }
        '400':
          description: VALIDATION_FAILED on code (invalid, not a code this server signed; expired; other_depot, not the driver's own depot's).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: FORBIDDEN_INSUFFICIENT_ROLE (no attendance:check-in, or no driver profile).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: CONFLICT_ATTENDANCE_DUPLICATE (just_checked_in, a scan within 10 minutes of checking in; already_checked_out), or CONFLICT_INVALID_STATE_TRANSITION for a retired driver.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /dispatch/availability:
    get:
      tags: [Dispatch]
      operationId: getDispatchBoard
      summary: Dispatcher board (FMS-33)
      description: >
        A depot's drivers and vehicles with their state now (the console's colours) and their availability for
        the trip being staffed. Needs trip:assign. depot_id defaults to the caller's own depot; someone who sees
        several must give one (400 VALIDATION_FAILED, reason required).
      parameters:
        - name: depot_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: The trip's start (an instant, or a date meaning that Addis Ababa day). None means now.
          schema: { type: string }
        - name: to
          in: query
          description: The trip's end. At most 31 days after from.
          schema: { type: string }
        - name: exclude_trip_id
          in: query
          description: The trip being staffed; its own assignment is not a conflict.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The board.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/DispatchBoard' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (depot required or outside your depots) or VALIDATION_INVALID_DATE_RANGE.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /vehicles/{vehicle_id}/status:
    get:
      tags: [Vehicles]
      operationId: getVehicleStatus
      summary: Vehicle status and availability (FMS-76)
      description: >
        Needs vehicle:read; same depot scope as GET /vehicles/{id} (404 outside it). Availability is
        for the window given, or now.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - name: from
          in: query
          description: An instant, or a date meaning that Addis Ababa day.
          schema: { type: string }
        - name: to
          in: query
          description: An instant, or a date meaning the end of that Addis Ababa day. At most 31 days after from.
          schema: { type: string }
      responses:
        '200':
          description: The vehicle's status.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/VehicleStatus' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_INVALID_DATE_RANGE (the window ends before it starts, or covers more than 31 days).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Vehicles]
      operationId: changeVehicleStatus
      summary: Change a vehicle's status, with the reason (FMS-76)
      description: >
        Needs vehicle:write and the depot scope. Audited, kept in the status history, published as
        VehicleStatusChanged. A vehicle on a trip under way cannot be taken off the road; trips
        already assigned ahead come back as warnings.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status: { $ref: '#/components/schemas/VehicleStatusValue' }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Changed (or already in that status, unchanged).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/VehicleStatus' }
                  meta:
                    type: object
                    required: [warnings, request_id]
                    properties:
                      warnings:
                        type: array
                        items: { $ref: '#/components/schemas/StatusChangeWarning' }
                      request_id: { type: string, format: uuid }
        '400':
          description: VALIDATION_FAILED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION (nothing leaves retired), CONFLICT_VEHICLE_IN_USE (on a trip under way; record_id is the trip) or CONFLICT_CONCURRENT_MODIFICATION.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /vehicles/{vehicle_id}/meter-readings:
    get:
      tags: [Vehicles]
      operationId: listVehicleMeterReadings
      summary: A vehicle's odometer and engine-hour history (FMS-126)
      description: >
        Every reading with its source (fuel log, completed repair, device or telematics provider, the nightly
        engine-hours job, manual), newest first by when it was true. A reading lower than a trusted earlier one is
        kept with suspect true; the vehicle's odometer does not follow it (docs/meter-readings.md). Needs
        vehicle:read, in the caller's depot scope; a vehicle outside it, or an id that is not a UUID, is a 404.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - { name: meter, in: query, schema: { type: string, enum: [odometer, engine_hours] } }
        - { name: from, in: query, description: 'An instant, or a date (from the start of that Addis Ababa day).', schema: { type: string } }
        - { name: to, in: query, description: 'An instant, or a date (up to the end of that Addis Ababa day).', schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of readings.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MeterReading' }
                  meta:
                    type: object
                    required: [request_id, page, page_size, total_items, total_pages]
                    properties:
                      request_id: { type: string, format: uuid }
                      page: { type: integer }
                      page_size: { type: integer }
                      total_items: { type: integer }
                      total_pages: { type: integer }
        '400':
          description: VALIDATION_FAILED (an unknown meter, a bad date, an unknown parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vehicles/{vehicle_id}/downtime:
    get:
      tags: [Vehicles]
      operationId: listVehicleDowntime
      summary: A vehicle's downtime periods (FMS-131)
      description: >
        Each stretch the vehicle was out of service, newest first: down while in maintenance or out of service, and
        from a breakdown until its repair is completed; overlapping stretches are one period. Each has its reason
        (from its repair or failure, or a staff member's), whether it counts as a failure (unplanned), its work order
        and failure, and its length in minutes (to now while it lasts). Kept by the fleet.downtime projection and
        rebuilt nightly (docs/downtime.md). Needs vehicle:read, in the caller's depot scope; a vehicle outside it, or
        an id that is not a UUID, is a 404. With from or to, only the periods overlapping that window (a month on
        the availability screen, FMS-142); a to before from is 400 (before_from). Each period names the problem
        behind it, its work order and failure (maintenance_record, failure), only for a caller with
        maintenance:read: null for anyone else.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: from, in: query, description: 'Periods still going on at or after this time (ISO 8601 with offset).', schema: { type: string, format: date-time } }
        - { name: to, in: query, description: 'Periods begun before this time.', schema: { type: string, format: date-time } }
      responses:
        '200':
          description: A page of periods.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DowntimePeriod' }
                  meta:
                    type: object
                    required: [request_id, page, page_size, total_items, total_pages]
                    properties:
                      request_id: { type: string, format: uuid }
                      page: { type: integer }
                      page_size: { type: integer }
                      total_items: { type: integer }
                      total_pages: { type: integer }
        '400':
          description: VALIDATION_FAILED (an unknown parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vehicles/{vehicle_id}/downtime/{period_id}:
    patch:
      tags: [Vehicles]
      operationId: setDowntimeReason
      summary: Give a downtime period its reason (FMS-131)
      description: >
        A staff member's reason, with an optional note, replacing the one its repair or failure gives; kept through
        every rebuild. Accident and awaiting parts are only ever set this way. reason null goes back to the derived
        reason and clears the note. Audited, with who set it and when. Needs vehicle:write, in the caller's depot
        scope; a vehicle or period outside it is a 404.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - { name: period_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: [string, 'null'], enum: [planned_service, unplanned_repair, breakdown, accident, awaiting_parts, other, null] }
                note: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: The period with its reason.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/DowntimePeriod' }
                  meta: { type: object, properties: { request_id: { type: string, format: uuid } } }
        '400':
          description: VALIDATION_FAILED (an unknown reason, a note over 500 characters, an unknown field).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /integrations/providers:
    get:
      tags: [Integrations]
      operationId: listIntegrationProviders
      summary: Provider status (FMS-85)
      description: >
        Every provider with its state: last success and failure (from integration.sync_logs), its circuit breaker
        on this API instance, and what its adapter can do. Settings (configuration) and secrets are never returned.
        Needs integration:read. With check=true, each active provider's health check runs first (up to 5 s).
      parameters:
        - name: check
          in: query
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
      responses:
        '200':
          description: The providers, by name.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Provider' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /integrations/providers/{provider_id}/sync:
    post:
      tags: [Integrations]
      operationId: syncIntegrationProvider
      summary: Start a provider sync (FMS-85)
      description: >
        Records a started sync log and answers at once; the sync runs after the response and completes the log
        (succeeded, partial or failed). A sync of the provider already running is returned instead, with
        meta.already_running true. Needs integration:execute.
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: The sync log, status started.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/SyncLog' }
                  meta:
                    type: object
                    required: [request_id, already_running]
                    properties:
                      request_id: { type: string, format: uuid }
                      already_running: { type: boolean }
        '400':
          description: VALIDATION_FAILED, reason provider_inactive or sync_not_supported.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: UPSTREAM_UNAVAILABLE. The provider's circuit is open; Retry-After says when a call is let through.
          headers:
            Retry-After:
              description: Seconds.
              schema: { type: integer }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /integrations/devices:
    get:
      tags: [Integrations]
      operationId: listGpsDevices
      summary: The device registry (FMS-138)
      description: >
        Every GPS device of the vehicles in the caller's depot scope: telematics providers' devices (linked here) and
        devices with their own token (npm run device:register), with when each last reported and why its last
        refused position was refused. Active ones first, then by last seen. Never a token or its hash. Needs
        integration:read (docs/telematics.md).
      parameters:
        - { name: provider_id, in: query, schema: { type: string, format: uuid }, description: One provider's devices. }
        - { name: status, in: query, schema: { type: string, enum: [active, removed, all], default: all } }
      responses:
        '200':
          description: The devices.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GpsDevice' }
                  meta:
                    type: object
                    required: [request_id, total]
                    properties:
                      request_id: { type: string, format: uuid }
                      total: { type: integer }
        '400':
          description: VALIDATION_FAILED (a provider_id that is not a UUID, an unknown status).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Integrations]
      operationId: linkGpsDevice
      summary: Link a provider's device to a vehicle (FMS-138)
      description: >
        From now on the telematics provider's webhook positions naming device_identifier are the vehicle's. The same
        device again moves it (from another vehicle, or back from removed); it keeps its id. A vehicle has one active
        device: another one is refused (409, vehicle_has_device, its id as record_id) unless replace is true, which
        takes that one out of service. Audited. Needs integration:execute; the vehicle in the caller's depot scope.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id, device_identifier, vehicle_id]
              additionalProperties: false
              properties:
                provider_id: { type: string, format: uuid, description: A telematics provider. }
                device_identifier: { type: string, minLength: 1, maxLength: 255, pattern: '^[!-~]+$', description: The provider's id for the device (an IMEI, a serial). }
                vehicle_id: { type: string, format: uuid }
                device_model: { type: [string, 'null'], maxLength: 255 }
                replace: { type: boolean, default: false }
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/GpsDevice' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: >
            VALIDATION_FAILED: on provider_id, references_missing_record or not_telematics; on vehicle_id,
            references_missing_record (none in the caller's scope) or vehicle_retired; a device_identifier with spaces.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >
            CONFLICT_DUPLICATE: on device_identifier, already_exists (another provider's device, or a token device);
            on vehicle_id, vehicle_has_device. Or CONFLICT_IDEMPOTENCY_KEY_REUSED / CONFLICT_IDEMPOTENCY_IN_PROGRESS.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /integrations/devices/unknown:
    get:
      tags: [Integrations]
      operationId: listUnknownGpsDevices
      summary: Device ids providers sent that are linked to no vehicle (FMS-138)
      description: >
        From signed deliveries only, newest first, at most 200 (and 1,000 kept per provider). Linking one removes it.
        Needs integration:read.
      responses:
        '200':
          description: The unknown device ids.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UnknownGpsDevice' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /integrations/devices/{device_id}:
    parameters:
      - { name: device_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Integrations]
      operationId: unlinkGpsDevice
      summary: Unlink a device (FMS-138)
      description: >
        The device is kept as removed, with its pings; its positions are refused from now on (a provider's are listed
        as unknown) and a token device's token stops working. Unlinking it again changes nothing. Audited. Needs
        integration:execute; a device of a vehicle outside the caller's scope, or an id that is not a UUID, is a 404.
      responses:
        '204': { description: Unlinked. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/telematics/{provider}:
    post:
      tags: [Integrations]
      operationId: receiveTelematicsWebhook
      summary: Telematics webhook (FMS-85)
      description: >
        A provider's signed delivery for a telematics provider, named by its code. The signature is HMAC-SHA256 of
        "<X-FMS-Timestamp>.<raw body>" with the provider's secret (INTEGRATION_<CODE>_WEBHOOK_SECRET), sent as
        "sha256=<hex>". A timestamp more than 5 minutes from the server clock is refused (a replay). A redelivery
        of the same event id is answered 202 with duplicate true, and nothing is stored twice. The delivery is
        stored as an inbound sync log and announced as IntegrationWebhookReceived for its consumer.
      security:
        - webhookSignature: []
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/WebhookTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "The provider's own format, read by its adapter." }
      responses:
        '202': { $ref: '#/components/responses/WebhookAccepted' }
        '400':
          description: VALIDATION_FAILED (the adapter cannot read the body; details name the field). Recorded as a failed sync log.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/WebhookRefused' }
        '404':
          description: NOT_FOUND (no active telematics provider with this code, or one without a webhook secret or adapter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE (not application/json).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /webhooks/fuel-card/{provider}:
    post:
      tags: [Integrations]
      operationId: receiveFuelCardWebhook
      summary: Fuel-card webhook (FMS-85)
      description: >
        A provider's signed delivery for a fuel_card provider, named by its code. The signature is HMAC-SHA256 of
        "<X-FMS-Timestamp>.<raw body>" with the provider's secret (INTEGRATION_<CODE>_WEBHOOK_SECRET), sent as
        "sha256=<hex>". A timestamp more than 5 minutes from the server clock is refused (a replay). A redelivery
        of the same event id is answered 202 with duplicate true, and nothing is stored twice. The delivery is
        stored as an inbound sync log and announced as IntegrationWebhookReceived for its consumer.
      security:
        - webhookSignature: []
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/WebhookTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "The provider's own format, read by its adapter." }
      responses:
        '202': { $ref: '#/components/responses/WebhookAccepted' }
        '400':
          description: VALIDATION_FAILED (the adapter cannot read the body; details name the field). Recorded as a failed sync log.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/WebhookRefused' }
        '404':
          description: NOT_FOUND (no active fuel_card provider with this code, or one without a webhook secret or adapter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE (not application/json).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /webhooks/ev/{provider}:
    post:
      tags: [Integrations]
      operationId: receiveEvWebhook
      summary: EV charging webhook (FMS-85)
      description: >
        A provider's signed delivery for a ev_charging provider, named by its code. The signature is HMAC-SHA256 of
        "<X-FMS-Timestamp>.<raw body>" with the provider's secret (INTEGRATION_<CODE>_WEBHOOK_SECRET), sent as
        "sha256=<hex>". A timestamp more than 5 minutes from the server clock is refused (a replay). A redelivery
        of the same event id is answered 202 with duplicate true, and nothing is stored twice. The delivery is
        stored as an inbound sync log and announced as IntegrationWebhookReceived for its consumer.
      security:
        - webhookSignature: []
      parameters:
        - $ref: '#/components/parameters/ProviderCode'
        - $ref: '#/components/parameters/WebhookTimestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "The provider's own format, read by its adapter." }
      responses:
        '202': { $ref: '#/components/responses/WebhookAccepted' }
        '400':
          description: VALIDATION_FAILED (the adapter cannot read the body; details name the field). Recorded as a failed sync log.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/WebhookRefused' }
        '404':
          description: NOT_FOUND (no active ev_charging provider with this code, or one without a webhook secret or adapter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE (not application/json).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /tracking/vehicles/current:
    get:
      tags: [Tracking]
      operationId: getCurrentVehicleLocations
      summary: The live map's snapshot (FMS-45)
      description: >
        The caller's vehicles (depot scope) that are not retired and have a position or a trip under way, by plate:
        each with its newest position, its trip under way with route and driver, and its open telemetry flags.
        depot_id narrows it to one depot; a depot outside the scope gives an empty list. Cached for 5 s per depot
        shown; trip and vehicle events drop it. Positions move on through vehicle.location.updated (docs/live-map.md).
      parameters:
        - name: depot_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The vehicles.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VehicleLocation' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (depot_id not a UUID, or an unknown query parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /command-center/overview:
    get:
      tags: [Command center]
      operationId: getCommandCenterOverview
      summary: What needs attention on the live map (FMS-89)
      description: >
        command:read, depot scope: the caller's depot, or every depot for a fleet-wide user (depot_id narrows it; a
        depot outside the scope is 404). Vehicles by state and health band, the at-risk and watch vehicles' scores,
        drivers on a trip, available, absent today and with an expired licence, the day's trips (Addis Ababa) by
        status with those under way and overdue, and the active alerts and incidents, most severe first (up to 50 of
        each, counted in full). The drivers, trips, alerts and incidents sections need driver:read, trip:read,
        alert:read and incident:read as well, and are null without them. Cached for 5 s per depot shown; alert,
        incident, trip, vehicle and attendance events drop it (docs/live-map.md).
      parameters:
        - name: depot_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/CommandCenterOverview' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (depot_id not a UUID, or an unknown query parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND (depot_id outside the caller's depots).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /tracking/gps-pings:
    post:
      tags: [Tracking]
      operationId: ingestGpsPings
      summary: Ingest GPS pings (FMS-88)
      description: >
        A batch of positions. A device (bearer token) reports for its own vehicle; a driver's phone (trip:execute)
        for the vehicle of a trip the driver drove, each ping in the trip it was recorded in, however late it arrives (FMS-124: a ping in no trip of the driver is refused alone as no_trip_at_time); a user with tracking:ingest names the vehicle on each ping.
        Naming any other vehicle refuses the whole batch (403). A ping already stored (same vehicle, same instant) is
        a duplicate and stored once. Readable pings that cannot be used are listed in rejected; the rest are stored.
        Each vehicle's newest position is announced as VehicleLocationUpdated at most once per 5 s.
      security:
        - deviceToken: []
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pings]
              additionalProperties: false
              properties:
                pings:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/GpsPoint' }
      responses:
        '202':
          description: What was stored.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [accepted, duplicates, rejected]
                    properties:
                      accepted: { type: integer }
                      duplicates: { type: integer, description: Pings already stored (a retried batch). }
                      rejected:
                        type: array
                        items:
                          type: object
                          required: [index, reason]
                          properties:
                            index: { type: integer }
                            reason: { type: string, enum: [future_timestamp, too_old, low_accuracy, unknown_vehicle, unknown_device, vehicle_retired, no_trip_at_time] }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (a field out of range or unknown, details name pings.<i>.<field>; a user's ping without vehicle_id).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: >
            FORBIDDEN_INSUFFICIENT_ROLE: no tracking:ingest or trip:execute; or a device or phone naming a vehicle that is
            not its own (reason not_your_vehicle); or a phone with no trip started in the last 7 days (no_trip_under_way). Nothing is stored.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /vehicles/{vehicle_id}/telemetry-flags:
    get:
      tags: [Tracking]
      operationId: listVehicleTelemetryFlags
      summary: A vehicle's telemetry flags (FMS-46, FMS-90)
      description: >
        The telemetry rules' flags of one vehicle, newest first: speeding and idling (docs/telemetry-rules.md),
        geofence violations and route deviation (docs/geofences.md). Behavioural data: needs
        tracking:read (never drivers), in the caller's depot scope; a vehicle outside it, or an id that is not a
        UUID, is a 404. Names the trip, not the driver.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - name: flag_type
          in: query
          description: One or more, comma-separated.
          schema: { type: string, example: 'speeding,idling' }
        - name: from
          in: query
          description: observed_at at or after this instant.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: observed_at before this instant.
          schema: { type: string, format: date-time }
        - name: ongoing
          in: query
          description: true for flags whose condition lasts (resolved_at null), false for ended ones.
          schema: { type: string, enum: ['true', 'false'] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: The flags.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TelemetryFlag' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (an unknown flag type, a time without offset, limit out of range, to before from, or an unknown query parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /geofences:
    get:
      tags: [Geofences]
      operationId: listGeofences
      summary: The depots' geofences (FMS-90)
      description: >
        Polygons a depot's vehicles must stay inside (keep_in: a yard, an operating area) or out of (keep_out: a
        no-go zone), by depot then name (docs/geofences.md). Needs tracking:read, in the caller's depot scope; a
        depot_id outside it is a 404. Removed fences only with status inactive or all.
      parameters:
        - { name: depot_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, all], default: active } }
      responses:
        '200':
          description: The geofences.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Geofence' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (a depot_id that is not a UUID, an unknown status or query parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Geofences]
      operationId: createGeofence
      summary: Draw a geofence (FMS-90)
      description: >
        Needs geofence:write (admin). The ring is stored closed, rounded to 6 decimals, repeated corners dropped. At
        most 50 active fences per depot; names are unique per depot among active ones. Audited; GeofenceChanged. A
        vehicle already on the wrong side is flagged only once it crosses again.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GeofenceInput' } } }
      responses:
        '201':
          description: Drawn.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Geofence' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: >
            VALIDATION_FAILED: a field missing or unknown; on polygon, too_few_points, too_many_points (over 500),
            out_of_range, self_intersecting, too_small (under 400 m²) or too_large (over 500 km across), or holes; on
            depot_id, geofence_limit (50 active).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_DUPLICATE (the depot has an active fence of that name), CONFLICT_IDEMPOTENCY_KEY_REUSED or CONFLICT_IDEMPOTENCY_IN_PROGRESS.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /geofences/{geofence_id}:
    parameters:
      - { name: geofence_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Geofences]
      operationId: getGeofence
      summary: A geofence (FMS-90)
      description: Needs tracking:read, in the caller's depot scope; outside it, or an id that is not a UUID, is a 404. The ETag is the version.
      responses:
        '200':
          description: The geofence.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Geofence' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Geofences]
      operationId: updateGeofence
      summary: Change a geofence (FMS-90)
      description: >
        Needs geofence:write (admin). The fields to change, at least one; If-Match refuses a stale write. Changing
        its outline, kind, applies or depot closes its open flags (end_reason geofence_changed) and vehicles are
        judged afresh from their next crossing. A removed fence cannot be changed. Audited; GeofenceChanged.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GeofencePatch' } } }
      responses:
        '200':
          description: Changed.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Geofence' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (as on POST, or an empty body).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_CONCURRENT_MODIFICATION (a stale If-Match), CONFLICT_INVALID_STATE_TRANSITION (a removed fence) or CONFLICT_DUPLICATE (the name).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      tags: [Geofences]
      operationId: deleteGeofence
      summary: Remove a geofence (FMS-90)
      description: Soft; needs geofence:write (admin). Its open flags close (end_reason geofence_removed). Removing a removed fence changes nothing. Audited.
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /geofences/{geofence_id}/reactivate:
    parameters:
      - { name: geofence_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Geofences]
      operationId: reactivateGeofence
      summary: Restore a removed geofence (FMS-90)
      description: Needs geofence:write (admin). Back in force, judged from each vehicle's next crossing. An active fence is returned as it is. Audited.
      responses:
        '200':
          description: Restored.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Geofence' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (geofence_limit on depot_id, 50 active).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_DUPLICATE (another active fence of the depot now has its name).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /vehicles/{vehicle_id}/tracking:
    get:
      tags: [Tracking]
      operationId: getVehicleTracking
      summary: A vehicle's GPS history (FMS-136)
      description: >
        The vehicle's stored positions, oldest first, a page at a time: the vehicle page draws a trip's track from
        the points between its actual start and end. Behavioural data: needs tracking:read (never drivers), in the
        caller's depot scope; a vehicle outside it, or an id that is not a UUID, is a 404. Each point names its trip,
        not the driver. One request covers at most 30 days (FMS-95): without `to` it ends now (or 30 days after
        `from`), without `from` it starts 30 days before its end. Every read is audited (tracking.history_read).
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - name: from
          in: query
          description: recorded_at at or after this instant; default 30 days before `to`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: recorded_at at or before this instant; default now, or 30 days after `from` when that is earlier.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - name: cursor
          in: query
          description: meta.next_cursor of the previous page.
          schema: { type: string }
      responses:
        '200':
          description: The points, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TrackPoint' }
                  meta:
                    type: object
                    required: [page_size, next_cursor, request_id]
                    properties:
                      page_size: { type: integer }
                      next_cursor: { type: [string, 'null'], description: The next page's cursor; null on the last page. }
                      request_id: { type: string }
        '400':
          description: >
            VALIDATION_FAILED (a time without offset, limit out of range, a cursor the API did not issue, or an unknown
            query parameter); VALIDATION_INVALID_DATE_RANGE (`to` not after `from`, reason before_from; more than 30
            days, reason range_too_long).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /routes/{route_id}/geometry:
    get:
      tags: [Trips]
      operationId: getRouteGeometry
      summary: The road a route follows (FMS-84)
      description: >
        Measured by the routing engine (OSRM) through the route's origin, stops with coordinates and destination
        when the route is saved, simplified to within 15 m. Null while the route has no road (no ends, the engine
        down or not set up). Needs route:read, in the caller's depot scope; another depot's route, or an id that
        is not a UUID, is a 404. docs/routing.md.
      parameters:
        - name: route_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The road, or null.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/RoadLine'
                      - type: 'null'
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /routes/{route_id}/optimise:
    post:
      tags: [Trips]
      operationId: optimiseRouteStops
      summary: A shorter order of the route's stops (FMS-86)
      description: >
        The order of the saved stops that makes the road from origin to destination shortest: the routing engine's
        distance table (OSRM), nearest neighbour then 2-opt, with the ends fixed. Never longer than the saved order:
        when nothing shorter is found, `changed` is false and the saved order comes back. A suggestion only: nothing
        is saved; the route editor saves it with PATCH /routes/{route_id} (If-Match on `version`). Needs route:write,
        in the caller's depot scope; another depot's route is a 404. docs/eta.md.
      parameters:
        - name: route_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The suggested order, with the road length of both orders.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/RouteOptimisation' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: >
            VALIDATION_FAILED: the route has no origin or destination coordinates (route_without_ends, on origin or
            destination), a stop has none (stop_without_coordinates), or the engine found no road between some of
            them (no_road).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: UPSTREAM_UNAVAILABLE (routing_unavailable) with Retry-After, when no routing engine is set up or it cannot be reached.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: Search alerts (FMS-92)
      description: >
        Alerts of the caller's depots (an alert no depot owns is seen by those who see every depot), newest first or
        most severe first. docs/alerts.md.
      parameters:
        - { name: status, in: query, description: 'Comma-separated: open, acknowledged, resolved, dismissed.', schema: { type: string } }
        - { name: severity, in: query, description: 'Comma-separated: low, medium, high, critical.', schema: { type: string } }
        - { name: type, in: query, description: 'Comma-separated alert types, e.g. vehicle_fault,document_expiring.', schema: { type: string } }
        - { name: vehicle_id, in: query, schema: { type: string, format: uuid } }
        - { name: depot_id, in: query, schema: { type: string, format: uuid } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, priority], default: newest } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of alerts.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }
                  meta:
                    type: object
                    required: [request_id, page, page_size, total_items, total_pages]
                    properties:
                      request_id: { type: string, format: uuid }
                      page: { type: integer }
                      page_size: { type: integer }
                      total_items: { type: integer }
                      total_pages: { type: integer }
        '400':
          description: VALIDATION_FAILED or VALIDATION_INVALID_ENUM (an unknown status, severity or sort; an unknown parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /alerts/{alert_id}:
    get:
      tags: [Alerts]
      operationId: getAlert
      summary: Alert detail (FMS-92)
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: The alert.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Alert' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND (no such alert in your depots).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /alerts/{alert_id}/deliveries:
    get:
      tags: [Alerts]
      operationId: listAlertDeliveries
      summary: Every notification of an alert, with its delivery status (FMS-93)
      description: >
        One row per recipient and channel: the inbox (in_app), and for a critical or high alert the email, SMS and
        push messages (docs/notification-channels.md). Each shows its status (queued, sent, failed, cancelled; in_app
        rows are delivered), attempts, the provider that took it and its message id, and while queued after a failed
        attempt why it failed and when the next is due. Who it was for, never their email address or phone number.
        In the caller's depot scope, like the alert.
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: The alert's notifications, by channel then recipient.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AlertDelivery' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND (no such alert in your depots).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /alerts/{alert_id}/acknowledge:
    post:
      tags: [Alerts]
      operationId: acknowledgeAlert
      summary: Acknowledge an open alert (FMS-92)
      description: Records who and when; the alert no longer escalates. Needs alert:ack.
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                comment: { type: string, maxLength: 1000, description: A note on the alert's history. }
      responses:
        '200':
          description: The alert as it is now.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Alert' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (an unknown field, a comment over 1000 characters).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND (no such alert in your depots).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION, reason alert_<status>.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /alerts/{alert_id}/resolve:
    post:
      tags: [Alerts]
      operationId: resolveAlert
      summary: Resolve an open or acknowledged alert (FMS-92)
      description: Records who and when. A repeat of its source then opens a new alert. Needs alert:resolve.
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                comment: { type: string, maxLength: 1000, description: A note on the alert's history. }
      responses:
        '200':
          description: The alert as it is now.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Alert' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (an unknown field, a comment over 1000 characters).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND (no such alert in your depots).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION, reason alert_<status>.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /fuel-logs:
    get:
      tags: [Fuel]
      operationId: listFuelLogs
      summary: Fuel logs, newest first (FMS-39)
      description: >
        Needs fuel:read. Staff see their depots' logs; a driver lists only their own. Newest first by recorded_at
        (sort_order asc for oldest first). A date in from or to means that Addis Ababa day (UTC+3). A filter
        naming something outside the caller's scope matches nothing. api-contract §9.1.
      parameters:
        - { name: vehicle_id, in: query, schema: { type: string, format: uuid } }
        - { name: driver_id, in: query, schema: { type: string, format: uuid } }
        - { name: trip_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, description: A date or an instant (with offset)., schema: { type: string } }
        - { name: to, in: query, description: A date or an instant (with offset)., schema: { type: string } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of fuel logs.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FuelLog' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: VALIDATION_FAILED (an unknown parameter, a bad date or id).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Fuel]
      operationId: logFuel
      summary: Record a fill-up (FMS-39)
      description: >
        A driver logs for themselves, for a vehicle of their depot; staff may name a driver in their depots, or
        none. fueled_at (FMS-115) is when the fill-up happened: the driver form sends the moment the driver
        pressed submit, so a fill-up queued offline keeps its pump time; without it the log is recorded when
        received. The odometer never goes down with time: it is checked against the vehicle's reading and the
        fuel logs before and after fueled_at. Publishes FuelLogged. api-contract §9.1.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vehicle_id, quantity_ml, total_cost_cents, odometer_km]
              properties:
                vehicle_id: { type: string, format: uuid, description: A live vehicle in the caller's depots. }
                trip_id: { type: string, format: uuid, description: A trip the caller may see; if it has a vehicle, this one. }
                driver_id: { type: string, format: uuid, description: Staff only; a driver is always themselves. }
                fuel_type: { type: string, enum: [petrol, diesel, hybrid, electric, cng, lpg, other], description: "The vehicle's by default; electric is refused." }
                quantity_ml: { type: integer, minimum: 1, maximum: 2000000, description: Whole millilitres. }
                total_cost_cents: { type: integer, minimum: 0, maximum: 100000000, description: Whole cents. }
                unit_price_cents: { type: integer, minimum: 0, maximum: 100000000 }
                odometer_km: { type: number, minimum: 0, description: At most one decimal. }
                station_name: { type: string, minLength: 1, maxLength: 255, description: Trimmed. }
                latitude: { type: number, minimum: -90, maximum: 90, description: 'Where the fill-up was recorded (FMS-82), at most 6 decimals. Give both latitude and longitude or neither; with them the fill-up is checked against where the vehicle GPS had it.' }
                longitude: { type: number, minimum: -180, maximum: 180, description: See latitude. }
                fueled_at: { type: string, format: date-time, description: 'When the fill-up happened (FMS-115). Default now; not in the future (5 minutes of clock drift allowed), not over 30 days ago.' }
      responses:
        '201':
          description: Logged. Location names the log.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/FuelLog' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: >
            VALIDATION_FAILED (a field that is not writable, recorded_at and source included; fueled_at in_future or
            too_old; a value out_of_range; a vehicle, trip or driver references_missing_record; vehicle_retired;
            not_a_liquid_fuel; trip_vehicle_mismatch), VALIDATION_FLOAT_IN_MONEY_PATH (a fraction of a ml or cent)
            or VALIDATION_INVALID_ENUM.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >
            CONFLICT_ODOMETER_REGRESSION (below_last_reading: lower than the vehicle's reading or a log before
            fueled_at; above_later_reading: higher than a log after it), CONFLICT_IDEMPOTENCY_KEY_REUSED or
            CONFLICT_IDEMPOTENCY_IN_PROGRESS.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /fuel-reconciliation:
    get:
      tags: [Fuel]
      operationId: reconcileFuel
      summary: Fuel logged against what the trips needed, by vehicle (FMS-41)
      description: >
        For each vehicle in the caller's depots: the completed trips' distance in the period (by actual_end), the fuel
        it needed at the vehicle's fuel_efficiency_ml_per_km, the fuel logged (by recorded_at) and the variance,
        integers throughout (ml, cents, whole percent, rounded half away from zero). Beyond the fuel_variance_threshold_pct setting (FMS-80)
        (default 20) either way is above or below; electric vehicles, vehicles without a rating and under 100 km of
        trips are not_judged. Furthest from expected first. The period defaults to last calendar month (Addis Ababa);
        at most 366 days. Only reads, from the read replica when it is up (meta.data_freshness); the monthly job writes
        anomalies (docs/fuel-reconciliation.md). Needs both
        analytics:read and fuel:read.
      parameters:
        - { name: from, in: query, description: 'An instant, or a date (from the start of that Addis Ababa day).', schema: { type: string } }
        - { name: to, in: query, description: 'An instant, or a date (up to the end of that Addis Ababa day).', schema: { type: string } }
        - { name: vehicle_id, in: query, schema: { type: string, format: uuid } }
        - { name: depot_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [above, below, within, not_judged] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of vehicles, with the period, the threshold and a summary of every vehicle in it.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FuelReconciliation' }
                  meta:
                    type: object
                    required: [request_id, page, page_size, total_items, total_pages, from, to, threshold_pct, summary, data_freshness]
                    properties:
                      request_id: { type: string, format: uuid }
                      data_freshness: { $ref: '#/components/schemas/DataFreshness' }
                      page: { type: integer }
                      page_size: { type: integer }
                      total_items: { type: integer }
                      total_pages: { type: integer }
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time, description: Exclusive. }
                      threshold_pct: { type: integer }
                      summary:
                        type: object
                        required: [vehicles, judged, above, below, expected_ml, actual_ml, variance_pct, total_cost_cents]
                        properties:
                          vehicles: { type: integer }
                          judged: { type: integer }
                          above: { type: integer }
                          below: { type: integer }
                          expected_ml: { type: integer, description: Over the judged vehicles. }
                          actual_ml: { type: integer, description: Over the judged vehicles. }
                          variance_pct: { type: [integer, 'null'] }
                          total_cost_cents: { type: integer, description: Every vehicle's. }
        '400':
          description: VALIDATION_FAILED (a bad date or status; to before_from; period_too_long; an unknown parameter).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

