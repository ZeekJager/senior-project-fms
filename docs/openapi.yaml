  /system/backups:
    get:
      tags: [Backups]
      operationId: listBackups
      summary: Database backups, newest first (FMS-144)
      description: >
        Every backup the app's runner took, nightly or by Back up now, with its status, size, SHA-256 and who
        started it. meta says whether this server can take one (available), the retention, the last good backup
        and the last restore drill. Needs backup:read (admin).
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: A page of backups.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Backup' } }
                  meta: { $ref: '#/components/schemas/BackupsMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Backups]
      operationId: startBackup
      summary: Back up now (FMS-144)
      description: >
        Queues a manual backup and starts it in the background: the list shows it queued, running, then succeeded
        or failed. One at a time. Audited. Needs backup:write (admin).
      responses:
        '202':
          description: The backup, queued.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Backup' }
                  meta: { type: object, properties: { request_id: { type: string, format: uuid } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: CONFLICT_DUPLICATE (backup_in_progress) while a backup is queued or running.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '503':
          description: UPSTREAM_UNAVAILABLE, the server has no database credentials for pg_dump.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /system/backups/{backup_id}:
    get:
      tags: [Backups]
      operationId: getBackup
      summary: One database backup (FMS-144)
      parameters:
        - { name: backup_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The backup.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Backup' }
                  meta: { type: object, properties: { request_id: { type: string, format: uuid } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /system/backups/{backup_id}/download-link:
    post:
      tags: [Backups]
      operationId: backupDownloadLink
      summary: A short-lived download link for a backup (FMS-144)
      description: >
        A link to the backup's file, signed for the caller and alive 5 minutes. Only a succeeded backup has a
        file. Needs backup:read (admin).
      parameters:
        - { name: backup_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The link and the file's name.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [url, expires_at, filename]
                    properties:
                      url: { type: string }
                      expires_at: { type: string, format: date-time }
                      filename: { type: string }
                  meta: { type: object, properties: { request_id: { type: string, format: uuid } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION, the backup has no file (reason not_succeeded, or expired past retention).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /system/backups/{backup_id}/content:
    get:
      tags: [Backups]
      operationId: downloadBackup
      summary: A backup's file, by its signed link (FMS-144)
      description: >
        Public: the signature, naming the admin it was made for, is the permission. pg_dump's custom format, as an
        attachment, with Cache-Control private, no-store. Audited as backup.downloaded by that admin.
      security: []
      parameters:
        - { name: backup_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: user, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: expires, in: query, required: true, schema: { type: string } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION, the backup has no file.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in (FMS-05)
      description: >
        Checks the email and password and sets the session: an access cookie (fms_access, sent with every call) and a
        refresh cookie (fms_refresh, sent only to /auth). Both are HttpOnly, Secure and SameSite=Strict, so a page
        script never sees a token. Returns the signed-in user with the roles and permissions that decide what the
        screens show. Failed attempts are throttled for an account and address together (429 RATE_LIMITED, with Retry-After).
        Public. api-contract §5.1.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 255, description: Trimmed and lower-cased. }
                password: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '200':
          description: Signed in. Set-Cookie carries fms_access and fms_refresh.
          headers:
            Set-Cookie: { schema: { type: string }, description: fms_access (path /) and fms_refresh (path /api/v1/auth). }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/CurrentUser' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (a missing or malformed field).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401':
          description: AUTH_INVALID_CREDENTIALS. The same answer for an unknown email and a wrong password.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: AUTH_ACCOUNT_DISABLED (the account is inactive, suspended or locked).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '429':
          description: RATE_LIMITED. Too many failed sign-ins; try again after Retry-After seconds.
          headers:
            Retry-After: { schema: { type: integer } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Renew the session (FMS-05)
      description: >
        Trades the refresh cookie for a new access cookie and a new refresh cookie (rotation). A refresh token used
        twice is a theft signal: its whole session family is revoked. A rejected refresh clears both cookies, so the
        browser's session ends; a server error does not. Public: the refresh cookie is the credential.
      security: []
      responses:
        '200':
          description: Renewed. Set-Cookie carries the new fms_access and fms_refresh.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/CurrentUser' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401':
          description: AUTH_TOKEN_INVALID, AUTH_TOKEN_EXPIRED or AUTH_TOKEN_REVOKED (no refresh cookie, an unknown, expired or reused one). The cookies are cleared.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: AUTH_ACCOUNT_DISABLED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out (FMS-05)
      description: >
        Ends the session the refresh cookie belongs to and clears both cookies. Works with only the refresh cookie, so
        a user whose access token has expired can still sign out. Always 204, whether or not there was a session.
      security: []
      responses:
        '204':
          description: Signed out.
          headers:
            Set-Cookie: { schema: { type: string }, description: Both cookies, cleared. }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Who is signed in (FMS-05)
      description: Any signed-in user. The profile, the role names and every permission code the roles grant; the web app shows or hides screens from these.
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/CurrentUser' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/me/data-export:
    get:
      tags: [Auth]
      operationId: exportMyData
      summary: The caller's own data, as a JSON download (FMS-104)
      description: >
        Any signed-in user, and only their own: there is no id to give. The account (never the password hash or
        sessions); for a driver also the licence and phone, vehicle assignments, attendance, inspections, trips, fuel
        logs, incident reports and the GPS points recorded on their trips (the newest 50,000; `truncated` says if there
        were more), which reach back as far as the retention period (`retention_days`). Vehicles and trips appear by
        public id, the vehicle also by plate. Never cached. Every export is audited (`privacy.data_exported`, with
        counts only).
      responses:
        '200':
          description: The data, as an attachment.
          headers:
            Content-Disposition: { schema: { type: string }, description: 'attachment; filename="fms-my-data-YYYY-MM-DD.json".' }
            Cache-Control: { schema: { type: string }, description: no-store. }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/DataExport' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/password:
    post:
      tags: [Auth]
      operationId: setPassword
      summary: Set a password from a one-time link (FMS-78)
      description: >
        Completes an account setup or a reset: the token from the link an administrator issued (POST /users, POST
        /users/{user_id}/password-reset) and the new password. The token is 256 random bits, stored only as a hash,
        and works once: an unknown, used or expired one gets one answer, so the response says nothing about which.
        The password is 12 to 128 characters, not the email or its name part, not one repeated character (NIST SP
        800-63B). Setting it ends every session of the account (a reset after a compromise must throw the intruder
        out). Public: the token is the credential.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 1, maxLength: 200 }
                password: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '204': { description: The password is set. The user can sign in. }
        '400':
          description: >
            VALIDATION_FAILED. details: token invalid_or_expired, or password too_short, too_long, contains_email or
            repeated_character.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: User accounts (FMS-78)
      description: Needs users:read (administrators, fleet managers, compliance officers). Ordered by name.
      parameters:
        - { name: search, in: query, description: Matches the name and the email., schema: { type: string, maxLength: 100 } }
        - { name: role, in: query, schema: { type: string, maxLength: 50 } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, suspended, locked] } }
        - { name: depot_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: VALIDATION_FAILED (an unknown parameter or a bad value).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user account (FMS-78)
      description: >
        Needs users:write (administrators). There is no password: the response's meta.password_setup carries a
        one-time link (72 hours) for the person to set one, shown once and never cached. Roles that see one depot only
        (dispatcher, driver, technician, depot admin, finance clerk) need a home depot. Nobody grants a role carrying
        a permission they lack; only an administrator grants the administrator role. Publishes UserCreated. Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, full_name, roles]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                full_name: { type: string, minLength: 1, maxLength: 255 }
                phone: { type: [string, 'null'], pattern: '^\+?[0-9][0-9 ()-]{5,29}$', description: 'A phone number such as +251 911 234567.' }
                depot_id: { type: [string, 'null'], format: uuid }
                roles:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string, minLength: 1, maxLength: 50 }
      responses:
        '201':
          description: Created. Location names the user.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/User' }
                  meta:
                    type: object
                    required: [password_setup, request_id]
                    properties:
                      password_setup: { $ref: '#/components/schemas/PasswordLink' }
                      request_id: { type: string, format: uuid }
        '400':
          description: >
            VALIDATION_FAILED (a field that is not writable; roles.N references_missing_record or duplicate; depot_id
            required for a depot-scoped role, or references_missing_record).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: FORBIDDEN_INSUFFICIENT_ROLE (the role lacks users:write, or reason escalation for a role carrying permissions the caller lacks).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: CONFLICT_DUPLICATE (reason already_exists on email).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /users/{user_id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: One user account (FMS-78)
      description: Needs users:read. An id that is not a UUID, or unknown, is a 404.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change a user account (FMS-78)
      description: >
        Needs users:write. Send the fields to change, at least one. A status other than active deactivates the account
        and revokes every session it holds. You cannot change your own roles or deactivate yourself, and the last active
        administrator cannot be removed. Publishes UserRoleChanged and UserDeactivated. Audited.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                email: { type: string, format: email, maxLength: 255 }
                full_name: { type: string, minLength: 1, maxLength: 255 }
                phone: { type: [string, 'null'], pattern: '^\+?[0-9][0-9 ()-]{5,29}$' }
                depot_id: { type: [string, 'null'], format: uuid }
                status: { type: string, enum: [active, inactive, suspended, locked] }
                roles:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string, minLength: 1, maxLength: 50 }
      responses:
        '200':
          description: The user after the change.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (an empty_update, or the rules of POST /users).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: FORBIDDEN_INSUFFICIENT_ROLE (the permission, reason escalation, or reason own_roles).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            CONFLICT_DUPLICATE (email already_exists) or CONFLICT_INVALID_STATE_TRANSITION (reason own_account, or
            last_admin).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /users/{user_id}/password-reset:
    post:
      tags: [Users]
      operationId: issuePasswordReset
      summary: Issue a one-time password link (FMS-78)
      description: >
        Needs users:write. For a user who forgot their password, or whose setup link expired. A user with no password
        yet gets a setup link (72 hours), one with a password a reset link (1 hour); older open links stop working. The
        link is shown once in the response and never cached; the administrator passes it on. Not for a user whose
        roles carry permissions the caller lacks (403). Audited.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '201':
          description: The link.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/PasswordLink' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /roles:
    get:
      tags: [Users]
      operationId: listRoles
      summary: The roles and what they allow (FMS-78)
      description: Needs roles:read. Every active role with its permission codes, for the role picker and the access matrix.
      responses:
        '200':
          description: The roles.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /depots:
    get:
      tags: [Depots]
      operationId: listDepots
      summary: Depots (FMS-20)
      description: >
        Any signed-in user: every screen filters by depot. Active depots by default; status inactive or all (deleted
        depots) needs depot:write. in_scope true limits the list to the caller's own depots. api-contract §6.1.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, all], default: active } }
        - { name: in_scope, in: query, description: "true: only the caller's depots.", schema: { type: string, enum: ['true', 'false'], default: 'false' } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of depots.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Depot' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: VALIDATION_FAILED (an unknown parameter or value).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: FORBIDDEN_INSUFFICIENT_ROLE (deleted depots listed without depot:write).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    post:
      tags: [Depots]
      operationId: createDepot
      summary: Create a depot (FMS-20)
      description: Needs depot:write (administrators, fleet owners). The code is stored trimmed and in upper case and is unique. Audited. Location names the depot.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DepotFields'
                - type: object
                  required: [name, location]
      responses:
        '201':
          description: Created.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Depot' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (a required field missing, a field that is not writable, invalid_time_zone, invalid_time).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: CONFLICT_DUPLICATE (a unique value is taken, the code for one), CONFLICT_IDEMPOTENCY_KEY_REUSED or CONFLICT_IDEMPOTENCY_IN_PROGRESS.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /depots/{depot_id}:
    get:
      tags: [Depots]
      operationId: getDepot
      summary: One depot (FMS-20)
      description: Any signed-in user. A deleted depot is visible only to those who manage depots; to anyone else it does not exist (404). The ETag is the version.
      parameters:
        - $ref: '#/components/parameters/DepotId'
      responses:
        '200':
          description: The depot.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Depot' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Depots]
      operationId: updateDepot
      summary: Change a depot (FMS-20)
      description: Needs depot:write. Send the fields to change, at least one. Send If-Match to refuse a stale write. A deleted depot cannot be changed. Audited.
      parameters:
        - $ref: '#/components/parameters/DepotId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DepotFields'
                - type: object
                  minProperties: 1
      responses:
        '200':
          description: The depot after the change.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Depot' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (an empty_update, or a field the depot cannot hold).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_CONCURRENT_MODIFICATION (a stale If-Match), CONFLICT_INVALID_STATE_TRANSITION (a deleted depot) or CONFLICT_DUPLICATE.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    put:
      tags: [Depots]
      operationId: replaceDepot
      summary: Replace a depot (FMS-20)
      description: >
        Needs depot:write. A full replacement: name and location are required, and an optional field the body leaves
        out (code, address, city, country, time zone, position, capacity) is cleared. Otherwise as PATCH.
      parameters:
        - $ref: '#/components/parameters/DepotId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DepotFields'
                - type: object
                  required: [name, location]
      responses:
        '200':
          description: The depot after the change.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Depot' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_CONCURRENT_MODIFICATION, CONFLICT_INVALID_STATE_TRANSITION or CONFLICT_DUPLICATE.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      tags: [Depots]
      operationId: deleteDepot
      summary: Delete a depot (FMS-20)
      description: >
        Needs depot:write. A soft delete: its records stay, it leaves lists and pickers. Refused while active vehicles,
        drivers or user accounts still belong to it. Deleting a deleted depot succeeds and changes nothing.
      parameters:
        - $ref: '#/components/parameters/DepotId'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_DEPOT_NOT_EMPTY. details names what is still active (vehicles, drivers, users) with reason still_active.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /depots/{depot_id}/reactivate:
    post:
      tags: [Depots]
      operationId: reactivateDepot
      summary: Bring a deleted depot back (FMS-20)
      description: Needs depot:write. Reactivating an active depot changes nothing.
      parameters:
        - $ref: '#/components/parameters/DepotId'
      responses:
        '200':
          description: The depot, active.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Depot' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vehicles:
    get:
      tags: [Vehicles]
      operationId: listVehicles
      summary: Vehicles (FMS-16)
      description: >
        Needs vehicle:read, in the caller's depots. health is the band of the health score (at_risk below 75, watch,
        healthy from 85; stale and unscored); documents narrows to vehicles with a live document that is expired
        (past its date), expiring (within the expiry window) or due (either); ready_to_dispatch true lists the vehicles
        that are active, not flagged for maintenance, not on an active trip and have no expired document (false lists
        the rest). api-contract §6.2.
      parameters:
        - { name: depot_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/VehicleStatusValue' } }
        - { name: maintenance_flag, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: ready_to_dispatch, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: documents, in: query, schema: { type: string, enum: [expired, expiring, due] } }
        - { name: health, in: query, schema: { type: string, enum: [at_risk, watch, healthy, stale, unscored] } }
        - { name: search, in: query, description: 'Registration number, make, model or VIN.', schema: { type: string, maxLength: 100 } }
        - { name: sort_by, in: query, description: 'A sortable column of the list; anything else is a 400 (FMS-103).', schema: { type: string, enum: [registration_number, make, model, year, odometer_km, health_score, created_at, updated_at, status, vehicle_type, depot], default: registration_number } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: then_by, in: query, description: 'The tie-breaking column: one of the sort_by columns.', schema: { type: string, enum: [registration_number, make, model, year, odometer_km, health_score, created_at, updated_at, status, vehicle_type, depot] } }
        - { name: then_order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of vehicles.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Vehicle' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: VALIDATION_FAILED (an unknown parameter, a bad value or sort column).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Vehicles]
      operationId: createVehicle
      summary: Register a vehicle (FMS-16)
      description: >
        Needs vehicle:write. The depot must be one of the caller's. Fuel efficiency (whole millilitres per km) is
        required unless the vehicle is electric. status, maintenance_flag and health_score are not writable: their own
        workflows set them. Publishes VehicleRegistered. Audited. Location names the vehicle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VehicleFields'
                - type: object
                  required: [registration_number, make, model, vehicle_type, fuel_type, depot_id]
      responses:
        '201':
          description: Registered.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Vehicle' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: >
            VALIDATION_FAILED (a field that is not writable; fuel_efficiency_ml_per_km required; depot_id
            references_missing_record) or VALIDATION_FLOAT_IN_MONEY_PATH (a fraction of a millilitre).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: CONFLICT_DUPLICATE_PLATE (the registration number is taken) or CONFLICT_DUPLICATE (the VIN is).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /vehicles/{vehicle_id}:
    get:
      tags: [Vehicles]
      operationId: getVehicle
      summary: One vehicle (FMS-16)
      description: Needs vehicle:read, in the caller's depots; anything else, or an id that is not a UUID, is a 404. The ETag is the version.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: The vehicle.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Vehicle' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Vehicles]
      operationId: updateVehicle
      summary: Change a vehicle (FMS-16)
      description: >
        Needs vehicle:write. Send the fields to change, at least one. Send If-Match to refuse a stale write. The
        odometer never goes down. A retired vehicle cannot be changed. To change its status use POST
        /vehicles/{vehicle_id}/status. Publishes VehicleUpdated. Audited.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VehicleFields'
                - type: object
                  minProperties: 1
      responses:
        '200':
          description: The vehicle after the change.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Vehicle' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (an empty_update, a field that is not writable, or the rules of POST /vehicles).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            CONFLICT_CONCURRENT_MODIFICATION (a stale If-Match), CONFLICT_INVALID_STATE_TRANSITION (a retired vehicle),
            CONFLICT_ODOMETER_REGRESSION, CONFLICT_DUPLICATE_PLATE or CONFLICT_DUPLICATE (the VIN).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      tags: [Vehicles]
      operationId: retireVehicle
      summary: Retire a vehicle (FMS-16)
      description: >
        Needs vehicle:delete. Retiring is final and soft: trips, fuel logs and history keep their references.
        Refused while the vehicle is on an active trip or assigned to a driver. Publishes VehicleRetired. Audited.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '204': { description: Retired. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_VEHICLE_IN_USE.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /drivers:
    get:
      tags: [Drivers]
      operationId: listDrivers
      summary: Drivers (FMS-19)
      description: >
        Needs driver:read, in the caller's depots. license_status is computed from the expiry and today's date in Addis
        Ababa; expiring_soon is within 30 days. api-contract §6.3.
      parameters:
        - { name: depot_id, in: query, schema: { type: string, format: uuid } }
        - { name: license_status, in: query, schema: { type: string, enum: [valid, expiring_soon, expired] } }
        - { name: license_expiring_before, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string, enum: [active, retired] } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort_by, in: query, description: 'A sortable column of the list; anything else is a 400 (FMS-103).', schema: { type: string, enum: [full_name, license_number, license_expiry, hire_date, created_at], default: license_number } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of drivers.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Driver' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: VALIDATION_FAILED (an unknown parameter or value).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Drivers]
      operationId: createDriver
      summary: Register a driver (FMS-19)
      description: >
        Needs driver:write. The licence and home depot, plus the person: user_id of an existing account with the driver
        role, or account for a new one (created with the driver role and no password: a setup link comes from POST
        /users/{user_id}/password-reset). Exactly one of the two. The name, email and phone belong to the account and
        change through user administration. Publishes DriverRegistered. Audited.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DriverFields'
                - type: object
                  required: [license_number, license_expiry, depot_id]
                  properties:
                    user_id: { type: string, format: uuid, description: 'An existing account with the driver role. Not together with account.' }
                    account:
                      type: object
                      additionalProperties: false
                      required: [full_name, email]
                      description: A new account. Not together with user_id.
                      properties:
                        full_name: { type: string, minLength: 1, maxLength: 255 }
                        email: { type: string, format: email, maxLength: 255 }
                        phone: { type: [string, 'null'], pattern: '^\+?[0-9][0-9 ()-]{5,29}$' }
      responses:
        '201':
          description: Registered.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Driver' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: >
            VALIDATION_FAILED (user_id_or_account; user_id not a usable account; depot_id references_missing_record;
            hire_date in_future; a licence category or date out of range).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: CONFLICT_DUPLICATE_LICENSE (the licence number is taken), CONFLICT_DUPLICATE (the new account's email is, or the account already has a driver profile), CONFLICT_IDEMPOTENCY_KEY_REUSED or CONFLICT_IDEMPOTENCY_IN_PROGRESS.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /drivers/import:
    post:
      tags: [Drivers]
      operationId: importDrivers
      summary: Register drivers from a CSV (FMS-19)
      description: >
        Needs driver:write. Bulk onboarding: all rows are registered or none. Send text/csv with a header row
        (email, license_number and license_expiry are required, plus depot_code or depot_id; optional
        license_categories separated by commas, semicolons or bars, as API values or names, hire_date, emergency_phone). Up to 500
        rows. Each row registers the existing account with that email as a driver, by the rules of POST /drivers
        (the account must exist and hold the driver role). dry_run true checks everything and saves nothing. Every
        problem is reported at once, by spreadsheet row (the header is row 1).
      parameters:
        - { name: dry_run, in: query, schema: { type: string, enum: ['true', 'false'], default: 'false' } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
            example: "email,license_number,license_expiry,depot_code\nabebe@example.com,AA-12345,2028-05-01,ADD-01\n"
      responses:
        '200':
          description: A dry run found nothing wrong. Nothing was saved.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [valid]
                    properties:
                      valid: { type: integer, description: The rows that would be registered. }
                  meta: { $ref: '#/components/schemas/Meta' }
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [created]
                    properties:
                      created:
                        type: array
                        items:
                          type: object
                          required: [row, id]
                          properties:
                            row: { type: integer, description: The spreadsheet row. }
                            id: { type: string, format: uuid, description: The new driver. }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED. details name each problem as rows.<row> or rows.<row>.<field> with a reason (empty_file, unknown_column, missing_column, duplicate_of_row_N, references_missing_record, already_exists, ...), or field body with reason csv_required. Nothing was saved.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: CONFLICT_IDEMPOTENCY_KEY_REUSED or CONFLICT_IDEMPOTENCY_IN_PROGRESS.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /drivers/me:
    get:
      tags: [Drivers]
      operationId: getMyDriverProfile
      summary: The signed-in driver's own profile (FMS-19)
      description: "Any signed-in user: a driver does not hold driver:read but may see their own profile. 404 when the caller is not a driver."
      responses:
        '200':
          description: The caller's driver profile.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Driver' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /drivers/{driver_id}:
    get:
      tags: [Drivers]
      operationId: getDriver
      summary: One driver (FMS-19)
      description: Needs driver:read, in the caller's depots; anything else, or an id that is not a UUID, is a 404. The ETag is the version.
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: The driver.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Driver' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Drivers]
      operationId: updateDriver
      summary: Change a driver (FMS-19)
      description: >
        Needs driver:write. Send the fields to change, at least one; the account is fixed once the driver exists. Send
        If-Match to refuse a stale write. A retired driver cannot be changed. Moving to another depot publishes
        DriverTransferred. Audited.
      parameters:
        - $ref: '#/components/parameters/DriverId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DriverFields'
                - type: object
                  minProperties: 1
                  properties:
                    depot_id: { type: string, format: uuid }
      responses:
        '200':
          description: The driver after the change.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Driver' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (an empty_update, a field that is not writable, depot_id references_missing_record).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_CONCURRENT_MODIFICATION, CONFLICT_INVALID_STATE_TRANSITION (a retired driver) or CONFLICT_DUPLICATE_LICENSE.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      tags: [Drivers]
      operationId: retireDriver
      summary: Retire a driver (FMS-19)
      description: >
        Needs driver:delete. A soft retirement: trips and attendance keep their references and the user account is left
        as it is. Refused while the driver is on an assigned or en-route trip or assigned to a vehicle. Retiring a
        retired driver succeeds and changes nothing. Publishes DriverRetired. Audited.
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '204': { description: Retired. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_DRIVER_IN_USE.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /drivers/{driver_id}/reinstate:
    post:
      tags: [Drivers]
      operationId: reinstateDriver
      summary: Bring a retired driver back (FMS-19)
      description: >
        Needs driver:write. The driver is active again with their history, in one audited change. Reinstating an
        active driver changes nothing. The account's status is not touched: a disabled account still makes the driver
        ineligible. Publishes DriverReinstated.
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: The driver, active.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Driver' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attendance:
    get:
      tags: [Attendance]
      operationId: getAttendanceRoster
      summary: One day's roster (FMS-21)
      description: >
        Needs attendance:read. Every driver the caller may see, with their record for the day or null if not marked
        yet. The day defaults to today in Addis Ababa; meta.date says which. api-contract §6.3.
      parameters:
        - { name: date, in: query, description: 'A calendar day, or today.', schema: { type: string, default: today } }
        - { name: depot_id, in: query, schema: { type: string, format: uuid } }
        - { name: driver_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [present, absent, on_leave, late, sick, other, unmarked] } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of the roster.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RosterEntry' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/PageMeta'
                      - type: object
                        required: [date]
                        properties:
                          date: { type: string, format: date, description: The day the roster is for. }
        '400':
          description: VALIDATION_FAILED (a bad date or value).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Attendance]
      operationId: recordAttendance
      summary: Record a driver's day (FMS-21)
      description: >
        Needs attendance:write (not dispatchers). One record per driver and day; to change it use PUT or PATCH. The
        status may be left out when a check-in time is given. A driver cannot enter times by hand (403, reason
        scan_only): they check in by scanning the depot's QR code. Publishes AttendanceRecorded. Audited. Location
        names the record.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [driver_id, date]
              properties:
                driver_id: { type: string, format: uuid }
                date: { type: string, format: date }
                status: { type: string, enum: [present, absent, on_leave, late, sick, other] }
                notes: { type: [string, 'null'], maxLength: 500 }
                check_in_at: { type: [string, 'null'], format: date-time }
                check_out_at: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          description: Recorded.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Attendance' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: >
            VALIDATION_FAILED (driver_id references_missing_record; check_out_at before_check_in; a field that is not
            writable).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >
            CONFLICT_ATTENDANCE_DUPLICATE (already recorded for this driver and day), CONFLICT_INVALID_STATE_TRANSITION
            (a retired driver), CONFLICT_IDEMPOTENCY_KEY_REUSED or CONFLICT_IDEMPOTENCY_IN_PROGRESS.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /attendance/{attendance_id}:
    get:
      tags: [Attendance]
      operationId: getAttendance
      summary: One attendance record (FMS-21)
      description: Needs attendance:read, in the caller's depots; anything else, or an id that is not a UUID, is a 404.
      parameters:
        - $ref: '#/components/parameters/AttendanceId'
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Attendance' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Attendance]
      operationId: replaceAttendance
      summary: Replace an attendance record (FMS-21)
      description: Needs attendance:write. The status is required; notes the body leaves out are cleared. Audited.
      parameters:
        - $ref: '#/components/parameters/AttendanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [present, absent, on_leave, late, sick, other] }
                notes: { type: [string, 'null'], maxLength: 500 }
                check_in_at: { type: [string, 'null'], format: date-time }
                check_out_at: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: The record after the change.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Attendance' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Attendance]
      operationId: updateAttendance
      summary: Change an attendance record (FMS-21)
      description: Needs attendance:write. Send the fields to change, at least one. Audited.
      parameters:
        - $ref: '#/components/parameters/AttendanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                status: { type: string, enum: [present, absent, on_leave, late, sick, other] }
                notes: { type: [string, 'null'], maxLength: 500 }
                check_in_at: { type: [string, 'null'], format: date-time }
                check_out_at: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: The record after the change.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Attendance' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (an empty_update, or a field the record cannot hold).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents:
    post:
      tags: [Documents]
      operationId: uploadDocument
      summary: Upload a document (FMS-25)
      description: >
        Needs document:write. multipart/form-data: the file in the "file" part (JPEG, PNG or PDF, at most 10 MB), the
        owner and the type in the other fields. The type is read from the file's first bytes, not from its name or its
        declared Content-Type. The owner (a vehicle or a driver) must be in the caller's depots. Publishes
        DocumentUploaded. Audited. Location names the document. api-contract §8.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, owner_type, owner_id, document_type]
              properties:
                file: { type: string, format: binary }
                owner_type: { type: string, enum: [vehicle, driver] }
                owner_id: { type: string, format: uuid, description: The vehicle's or driver's id. }
                document_type: { $ref: '#/components/schemas/DocumentType' }
                expires_on: { type: string, format: date, description: The document's own expiry (a registration, licence, insurance). }
                retain_until: { type: string, format: date, description: Keep the file at least until then, even once deleted. }
      responses:
        '201':
          description: Stored. GET /documents/{document_id} gives a signed link to the bytes.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/Document' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (file required, owner_id references_missing_record, a field that is not writable, a malformed multipart body).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: PAYLOAD_TOO_LARGE (over 10 MB).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE (not a JPEG, PNG or PDF).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: The documents of vehicles or drivers (FMS-25)
      description: >
        Needs document:read. One owner type and up to 100 owner ids (comma-separated), for the page of vehicles or
        drivers on screen, in the caller's depots. Read one with GET /documents/{document_id} for its signed link.
      parameters:
        - { name: owner_type, in: query, required: true, schema: { type: string, enum: [vehicle, driver] } }
        - { name: owner_id, in: query, required: true, description: 'One id or up to 100, comma-separated.', schema: { type: string } }
      responses:
        '200':
          description: The documents.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: VALIDATION_FAILED (owner_type or owner_id missing or malformed, more than 100 owners).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /documents/{document_id}:
    get:
      tags: [Documents]
      operationId: getDocument
      summary: One document with a signed link (FMS-25)
      description: Needs document:read, for an owner in the caller's depots; anything else is a 404. url (valid until url_expires_at) serves the bytes without a session.
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/DocumentWithUrl' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Delete a document (FMS-25)
      description: "Needs document:delete. A soft delete: the file stays (see retain_until). Audited."
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{document_id}/content:
    get:
      tags: [Documents]
      operationId: getDocumentContent
      summary: The bytes of a document, by signed link (FMS-25)
      description: >
        The url from GET /documents/{document_id}. Public: the signature is the permission, so it can be an img or
        iframe source. Served inline with the original file name, X-Content-Type-Options nosniff and no caching.
      security: []
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - { name: expires, in: query, description: When the link stops working (Unix seconds)., schema: { type: string } }
        - { name: signature, in: query, schema: { type: string } }
      responses:
        '200':
          description: The file.
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '401':
          description: AUTH_TOKEN_INVALID (no valid signature) or AUTH_TOKEN_EXPIRED (the link has expired).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /maintenance-records:
    get:
      tags: [Maintenance]
      operationId: listMaintenanceRecords
      summary: Repair and service records (FMS-22)
      description: >
        Needs maintenance:read, for vehicles in the caller's depots. Newest first by when the record was entered;
        sort_by work_date orders by when the work happened (a vehicle's history, FMS-136). open true lists the work not
        yet completed or cancelled. Also mounted at /maintenance (deprecated). api-contract §10.1.
      parameters:
        - { name: vehicle_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/MaintenanceStatus' } }
        - { name: open, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: maintenance_type, in: query, schema: { $ref: '#/components/schemas/MaintenanceType' } }
        - { name: sort_by, in: query, schema: { type: string, enum: [created_at, work_date], default: created_at } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of records.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MaintenanceRecord' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: VALIDATION_FAILED (an unknown parameter or value).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Maintenance]
      operationId: createMaintenanceRecord
      summary: Open repair or service work (FMS-22)
      description: >
        Needs maintenance:write (not dispatchers). Opening work flags the vehicle for maintenance in the same
        transaction, and work in progress puts it in the workshop. Parts used come off the shelf; using more than the
        stock record holds is recorded in full, stock stops at zero, and the shortfall comes back as a LOW_STOCK
        warning in meta.warnings, never a refusal. A corrective repair can carry its failures here (FMS-125). Money is
        whole cents. Publishes MaintenanceRecordOpened. Audited. Location names the record. Also mounted at
        /maintenance (deprecated).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceCreate' }
      responses:
        '201':
          description: Opened.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceEnvelope' }
        '400':
          description: >
            VALIDATION_FAILED (a field that is not writable; vehicle_id references_missing_record; a part that does not
            exist or is in another depot's stock; duplicate_part) or VALIDATION_FLOAT_IN_MONEY_PATH (a fraction of a cent).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION (a retired vehicle gets no new work).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /maintenance-records/{record_id}:
    get:
      tags: [Maintenance]
      operationId: getMaintenanceRecord
      summary: One repair or service record (FMS-22)
      description: Needs maintenance:read, for a vehicle in the caller's depots; anything else, or an id that is not a UUID, is a 404. The ETag is the version. Also mounted at /maintenance/{record_id} (deprecated).
      parameters:
        - $ref: '#/components/parameters/MaintenanceRecordId'
      responses:
        '200':
          description: The record, with its parts and failures.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Maintenance]
      operationId: replaceMaintenanceRecord
      summary: Change a record (FMS-22)
      description: >
        Needs maintenance:write. The same handler as PATCH: send the fields to change, at least one. completed_at
        completes the work (a corrective repair needs at least one failure, 400 failure_required), returns the vehicle
        from the workshop and clears its flag when it was the last open work. A completed or cancelled record can no
        longer be changed. Send If-Match to refuse a stale write. Also mounted at /maintenance/{record_id} (deprecated).
      parameters:
        - $ref: '#/components/parameters/MaintenanceRecordId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceUpdate' }
      responses:
        '200':
          description: The record after the change.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceEnvelope' }
        '400':
          description: >
            VALIDATION_FAILED (an empty_update; failures failure_required on completing a corrective repair;
            completed_at in_future or before_start; a field that is not writable).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_CONCURRENT_MODIFICATION (a stale If-Match) or CONFLICT_INVALID_STATE_TRANSITION (the record is completed or cancelled).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    patch:
      tags: [Maintenance]
      operationId: updateMaintenanceRecord
      summary: Change a record (FMS-22)
      description: As PUT.
      parameters:
        - $ref: '#/components/parameters/MaintenanceRecordId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceUpdate' }
      responses:
        '200':
          description: The record after the change.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceEnvelope' }
        '400':
          description: As PUT.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: As PUT.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /maintenance-records/{record_id}/complete:
    post:
      tags: [Maintenance]
      operationId: completeMaintenanceRecord
      summary: Complete the work (FMS-22)
      description: >
        Needs maintenance:execute. completed_at defaults to now;
        notes and, for a corrective repair, its failures can come with it, completing and recording them in one
        transaction. Also mounted at /maintenance/{record_id}/complete (deprecated). Publishes MaintenanceRecordCompleted.
      parameters:
        - $ref: '#/components/parameters/MaintenanceRecordId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                completed_at: { type: string, format: date-time }
                notes: { type: [string, 'null'], maxLength: 4000 }
                failures:
                  type: array
                  maxItems: 10
                  items: { $ref: '#/components/schemas/FailureInput' }
      responses:
        '200':
          description: The completed record.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceEnvelope' }
        '400':
          description: VALIDATION_FAILED (failures failure_required for a corrective repair; completed_at in_future or before_start).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CONFLICT_INVALID_STATE_TRANSITION (already completed or cancelled).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

