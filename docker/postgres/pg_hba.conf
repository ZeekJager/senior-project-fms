# Client authentication for the primary and the read replica (FMS-94).
# Mounted read-only and named with -c hba_file, so it applies to a data
# volume created before this file existed too.
#
# The first six lines are what the postgres image writes by default: trust
# inside the container only (its init scripts and healthcheck). The
# replication line lets the replica's role stream WAL from the Compose
# network with a password; the last line is everyone else, with a password.

# TYPE  DATABASE     USER            ADDRESS        METHOD
local   all          all                            trust
host    all          all             127.0.0.1/32   trust
host    all          all             ::1/128        trust
local   replication  all                            trust
host    replication  all             127.0.0.1/32   trust
host    replication  all             ::1/128        trust
host    replication  fms_replicator  all            scram-sha-256
host    all          all             all            scram-sha-256
