# pgBackRest for the FMS database (FMS-108, ADR-07, docs/backups.md).
# Secrets are never written here: the repository's encryption passphrase comes from the environment
# (PGBACKREST_REPO1_CIPHER_PASS, from BACKUP_REPO_CIPHER_PASS in .env). In production, repo1 points at
# the backup bucket and a repo2 in another region is added the same way (repo2-type=s3, repo2-s3-*).

[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
# Three weekly fulls: the oldest is 14 to 21 days old, and the WAL from it on is kept, so point-in-time
# recovery always reaches at least 14 days back, as the card requires (sizes in ADR-07).
repo1-retention-full=3
repo1-retention-diff=14

# zstd at level 3: WAL and data compress about fourfold for little CPU (measured in ADR-07).
compress-type=zst
compress-level=3

# Asynchronous archiving: archive-push returns at once and a background process ships the WAL,
# so a slow repository never slows writes. The spool holds what is not shipped yet.
archive-async=y
spool-path=/var/spool/pgbackrest
process-max=2

# A backup starts at once instead of waiting for the next checkpoint.
start-fast=y
# The container log shows warnings only (archive-push runs about once a minute); detail goes to log-path.
log-level-console=warn
log-level-file=detail
log-path=/var/log/pgbackrest

[fms]
pg1-path=/var/lib/postgresql/data
pg1-user=fms_admin
pg1-database=fms_db
