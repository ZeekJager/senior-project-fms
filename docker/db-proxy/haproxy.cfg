# The stable database endpoint (FMS-162, docs/disaster-recovery.md): the API, the standby and the scripts connect to
# db-proxy, never to a database container by name, so a failover needs no redeploy or configuration change.
#
#   db-proxy:5432   the primary: whichever of the two servers says it is the primary (role agent, port 5480)
#   db-proxy:5433   the standby: whichever says it is a streaming standby (port 5481), for reporting reads (FMS-94)
#
# Every second HAProxy checks each server's port 5432 and asks its role agent (docker/postgres/pgbackrest/
# role-agent.sh). A server whose agent says "down" (a standby, a fenced old primary) leaves the pool at once, and the
# sessions it still had are closed, so the API's pool reconnects to the new primary. A server that cannot be reached
# at all leaves it after 2 failed checks.
global
    log stdout format raw local0 info

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 3s
    # A session arriving while no server is in the pool (the seconds between the old primary leaving and the new one
    # joining) waits at most this long, then is closed: the client sees an error and tries again, never a hang.
    timeout queue 5s
    # Reports and replication keep sessions open for a long time; a dead peer is noticed by the checks instead.
    timeout client 1h
    timeout server 1h
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions on-marked-up shutdown-backup-sessions resolvers docker init-addr last,libc,none

# Docker's DNS, so a server whose container is not running yet (or any more) leaves the pool instead of stopping HAProxy.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s
    hold obsolete 5s

frontend primary
    bind :5432
    default_backend primary

backend primary
    # The first server up takes every session; fencing makes sure at most one says it is the primary.
    balance first
    server pg-a postgres:5432 check agent-check agent-port 5480 agent-inter 1s
    server pg-b postgres-replica:5432 check agent-check agent-port 5480 agent-inter 1s

frontend standby
    bind :5433
    default_backend standby

backend standby
    balance first
    server pg-a postgres:5432 check agent-check agent-port 5481 agent-inter 1s
    server pg-b postgres-replica:5432 check agent-check agent-port 5481 agent-inter 1s
