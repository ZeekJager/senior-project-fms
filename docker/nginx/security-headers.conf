# Included by every location of the web app (FMS-105): an add_header inside a location replaces the
# server-level ones, so these cannot be set once at the top.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The Content-Security-Policy, written at start by /docker-entrypoint.d/40-content-security-policy.sh from CSP_MODE and CSP_IMG_SOURCES.
include /etc/nginx/snippets/csp.conf;
