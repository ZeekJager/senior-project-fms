# The observability stack (FMS-109, FMS-163, ADR-10, docs/observability.md), on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d      (or: make observability)
#
# Metrics: Prometheus scrapes every 15 s (node_exporter, cAdvisor, the PostgreSQL and Redis exporters, the API's and
# the AI service's /metrics), evaluates docker/observability/prometheus/rules/fms.rules.yml and writes every sample to
# VictoriaMetrics, which keeps 13 months and answers the API's GET /system/metrics. Alerts: Alertmanager posts them to
# the API's alert engine. Logs: Promtail sends every container's to Loki. Errors: GlitchTip (Sentry's protocol)
# receives the API's, the web app's and the AI service's. Dashboards: Grafana.
#
# Nothing is published to the network: Grafana and GlitchTip listen on the host's loopback only (127.0.0.1:3001 and
# :8001); the rest is reached on the Compose network. Secrets come from .env (node scripts/init-env.mjs adds them).

x-restart: &restart
  restart: unless-stopped

services:
  backend:
    environment:
      # The metrics history the Resources tab reads, the token Alertmanager sends, and error tracking (empty: off).
      PROMETHEUS_URL: http://victoriametrics:8428
      ALERTMANAGER_WEBHOOK_TOKEN: "${ALERTMANAGER_WEBHOOK_TOKEN:?is not set - run node scripts/init-env.mjs to add it to .env}"
      SENTRY_DSN: "${SENTRY_DSN_BACKEND:-}"

  ai-service:
    environment:
      SENTRY_DSN: "${SENTRY_DSN_AI:-}"

  prometheus:
    <<: *restart
    image: prom/prometheus:v2.53.2
    container_name: fms_prometheus
    entrypoint: ["/bin/sh", "-c"]
    # The AI service's token as a file (Prometheus reads credentials from files, never from the environment).
    command:
      - >
        mkdir -p /prometheus/secrets && printf %s "$$ML_SERVICE_TOKEN" > /prometheus/secrets/ml-token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=15d --web.enable-lifecycle
    environment:
      ML_SERVICE_TOKEN: "${ML_SERVICE_TOKEN:?is not set - run make env or node scripts/init-env.mjs to create .env}"
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  victoriametrics:
    <<: *restart
    image: victoriametrics/victoria-metrics:v1.102.1
    container_name: fms_victoriametrics
    # 13 months of history; queries over a long range are answered from its 5-minute (and longer) steps.
    command: ["-retentionPeriod=13M", "-storageDataPath=/storage", "-search.maxPointsPerTimeseries=30000"]
    volumes:
      - victoriametrics_data:/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  alertmanager:
    <<: *restart
    image: prom/alertmanager:v0.27.0
    container_name: fms_alertmanager
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mkdir -p /alertmanager/secrets && printf %s "$$ALERTMANAGER_WEBHOOK_TOKEN" > /alertmanager/secrets/webhook-token &&
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    environment:
      ALERTMANAGER_WEBHOOK_TOKEN: "${ALERTMANAGER_WEBHOOK_TOKEN:?is not set - run node scripts/init-env.mjs to add it to .env}"
    volumes:
      - ./docker/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  node-exporter:
    <<: *restart
    image: prom/node-exporter:v1.8.2
    container_name: fms_node_exporter
    command: ["--path.rootfs=/host", "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)"]
    pid: host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    <<: *restart
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: fms_cadvisor
    command: ["--docker_only=true", "--housekeeping_interval=15s", "--store_container_labels=false", "--whitelisted_container_labels=com.docker.compose.service"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  # The primary and the standby through the stable endpoint (db-proxy:5432 and :5433), whichever server each is.
  postgres-exporter-primary:
    <<: *restart
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: fms_postgres_exporter_primary
    command: ["--collector.stat_statements", "--collector.database"]
    environment: &pg-exporter
      DATA_SOURCE_URI: db-proxy:5432/fms_db?sslmode=disable
      DATA_SOURCE_USER: fms_admin
      DATA_SOURCE_PASS: "${DB_ADMIN_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to create .env}"

  postgres-exporter-standby:
    <<: *restart
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: fms_postgres_exporter_standby
    command: ["--collector.database"]
    environment:
      <<: *pg-exporter
      DATA_SOURCE_URI: db-proxy:5433/fms_db?sslmode=disable

  redis-exporter:
    <<: *restart
    image: oliver006/redis_exporter:v1.62.0
    container_name: fms_redis_exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?is not set - run make env or node scripts/init-env.mjs to add it to .env}"

  grafana:
    <<: *restart
    image: grafana/grafana:11.1.4
    container_name: fms_grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?is not set - run node scripts/init-env.mjs to add it to .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  loki:
    <<: *restart
    image: grafana/loki:3.1.1
    container_name: fms_loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./docker/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  promtail:
    <<: *restart
    image: grafana/promtail:3.1.1
    container_name: fms_promtail
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./docker/observability/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Error tracking: GlitchTip, an open-source server for Sentry's protocol, with its own database and queue.
  glitchtip-db:
    <<: *restart
    image: postgres:16-alpine
    container_name: fms_glitchtip_db
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: "${GLITCHTIP_DB_PASSWORD:?is not set - run node scripts/init-env.mjs to add it to .env}"
    volumes:
      - glitchtip_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 5s
      timeout: 3s
      retries: 20

  glitchtip-redis:
    <<: *restart
    image: valkey/valkey:7.2-alpine
    container_name: fms_glitchtip_redis

  glitchtip-web:
    <<: *restart
    image: glitchtip/glitchtip:v4.1.3
    container_name: fms_glitchtip
    depends_on:
      glitchtip-db: { condition: service_healthy }
    ports:
      - "127.0.0.1:8001:8000"
    environment: &glitchtip
      DATABASE_URL: "postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/glitchtip"
      SECRET_KEY: "${GLITCHTIP_SECRET_KEY:?is not set - run node scripts/init-env.mjs to add it to .env}"
      REDIS_URL: redis://glitchtip-redis:6379/0
      PORT: "8000"
      GLITCHTIP_DOMAIN: http://localhost:8001
      DEFAULT_FROM_EMAIL: glitchtip@localhost
      EMAIL_URL: consolemail://
      ENABLE_USER_REGISTRATION: "false"
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: "90"
    command: ["sh", "-c", "./bin/run-migrate.sh && exec ./bin/start.sh"]

  glitchtip-worker:
    <<: *restart
    image: glitchtip/glitchtip:v4.1.3
    container_name: fms_glitchtip_worker
    depends_on:
      glitchtip-db: { condition: service_healthy }
    environment: *glitchtip
    command: ["./bin/run-celery-with-beat.sh"]

volumes:
  prometheus_data:
  victoriametrics_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  glitchtip_db:
